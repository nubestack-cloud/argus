{{- if eq .Values.postgres.mode "bundled" }}
{{- $fullname := include "argus-hub.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-db" $fullname) }}
{{- $pgPassword := .Values.postgres.bundled.password }}
{{- if not $pgPassword }}
  {{- if $existing }}
    {{- $pgPassword = index $existing.data "postgresPassword" | b64dec }}
  {{- else }}
    {{- $pgPassword = randAlphaNum 32 }}
  {{- end }}
{{- end }}
{{- /*
The app role's password is derived from the superuser's rather than separately
generated, so this chart holds one secret fewer. The separation that matters is
not two random strings: it is that the app role is created by the migration step
with only the privileges the hub needs, and the hub never connects as the
superuser.
*/ -}}
{{- $appPassword := sha256sum (printf "app:%s" $pgPassword) | trunc 32 }}
{{- $host := include "argus-hub.postgresService" . }}
{{- $db := .Values.postgres.bundled.database }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-db
  labels: {{- include "argus-hub.labels" . | nindent 4 }}
  {{- include "argus-hub.keepAnnotation" . | nindent 2 }}
type: Opaque
stringData:
  postgresPassword: {{ $pgPassword | quote }}
  appPassword: {{ $appPassword | quote }}
  # What the hub runs as: the least-privileged app role.
  url: {{ printf "postgres://argus_app:%s@%s:5432/%s?sslmode=disable" $appPassword $host $db | quote }}
  # What migrations run as. A separate string because migrations CREATE and
  # ALTER, and the hub's own role deliberately cannot.
  migrateUrl: {{ printf "postgres://postgres:%s@%s:5432/%s?sslmode=disable" $pgPassword $host $db | quote }}
{{- end }}
