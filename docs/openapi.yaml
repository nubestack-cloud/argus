      tags: [incidents]
      summary: CPU, memory, restart and throttling series for the incident's workload around the incident.
      description: |
        Requires `incident:read`. Read through the agent's Prometheus access; `available` is false
        with a `reason` when the cluster has no Prometheus configured, the agent is disconnected, or
        the incident is not about a workload — never an empty chart that reads as zero.
      parameters:
        - { $ref: '#/components/parameters/IncidentId' }
