# Loop campaign, wave 5 — admission, runtime and eviction shapes (README.md).
#
#  S42 Pod Security admission (namespace enforces "restricted") rejects a privileged pod
#      → FailedCreate "violates PodSecurity" on the ReplicaSet → incident with the Deployment
#  S43 Container command that does not exist → RunContainerError/CrashLoop → incident
#  S44 Job killed by activeDeadlineSeconds   → DeadlineExceeded → JobFailed → incident
#  S45 emptyDir over its sizeLimit           → Evicted → incident
#  S46 Two replicas wanting one hostPort on one pinned node → second stays Pending → incident
#      (node pinned at apply time: my-rke2-cluster-worker-1)
apiVersion: v1
kind: Namespace
metadata:
  name: argus-loop-psa
  labels: {argus.io/purpose: loop-campaign, pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: s42-privileged, namespace: argus-loop-psa, labels: {loop.argus.io/scenario: S42}}
spec:
  replicas: 1
  selector: {matchLabels: {app: s42-privileged}}
  template:
    metadata: {labels: {app: s42-privileged}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          securityContext: {privileged: true}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: s43-bad-command, namespace: argus-loop-test, labels: {loop.argus.io/scenario: S43}}
spec:
  replicas: 1
  selector: {matchLabels: {app: s43-bad-command}}
  template:
    metadata: {labels: {app: s43-bad-command}}
    spec:
      containers:
        - {name: app, image: busybox:1.36, command: ["/opt/app/bin/server", "--port=8080"]}
---
apiVersion: batch/v1
kind: Job
metadata: {name: s44-deadline, namespace: argus-loop-test, labels: {loop.argus.io/scenario: S44}}
spec:
  activeDeadlineSeconds: 30
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - {name: export, image: busybox:1.36, command: ["sh", "-c", "echo exporting; sleep 600"]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: s45-scratch-hog, namespace: argus-loop-test, labels: {loop.argus.io/scenario: S45}}
spec:
  replicas: 1
  selector: {matchLabels: {app: s45-scratch-hog}}
  template:
    metadata: {labels: {app: s45-scratch-hog}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 5; dd if=/dev/zero of=/scratch/blob bs=1M count=64; sleep 3600"]
          volumeMounts: [{name: scratch, mountPath: /scratch}]
      volumes: [{name: scratch, emptyDir: {sizeLimit: 16Mi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: s46-hostport, namespace: argus-loop-test, labels: {loop.argus.io/scenario: S46}}
spec:
  replicas: 2
  selector: {matchLabels: {app: s46-hostport}}
  template:
    metadata: {labels: {app: s46-hostport}}
    spec:
      nodeSelector: {kubernetes.io/hostname: my-rke2-cluster-worker-1}
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80, hostPort: 31987}]
