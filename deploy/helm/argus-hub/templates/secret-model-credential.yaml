{{- if and (include "argus-hub.cliRunnerEnabled" .) (not .Values.cliRunner.modelCredential.existingSecret) }}
{{- $m := .Values.cliRunner.modelCredential }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argus-hub.fullname" . }}-model-credential
  labels: {{- include "argus-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The operator's own model credential. ARGUS never ships one (lld/12 §10.7).
  # trimmed: `--set-file` keeps the file's trailing newline, which then rides
  # inside the credential and fails authentication in a confusing way.
  #
  # All three keys are always rendered, empty when unset. Helm's upgrade patch
  # only removes a key the previous manifest named, and stringData is folded
  # into data by the API server, so a key simply left out stays in the live
  # Secret forever: switching from an API key to a subscription token kept the
  # old ANTHROPIC_API_KEY, and the CLI went on using it. Writing "" overwrites
  # it on the next upgrade, from any earlier chart version. The runner treats
  # an empty variable as unset (cliEnv passes only non-empty ones).
  ANTHROPIC_API_KEY: {{ $m.anthropicApiKey | default "" | toString | trim | quote }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ $m.claudeCodeOauthToken | default "" | toString | trim | quote }}
  OPENAI_API_KEY: {{ $m.openaiApiKey | default "" | toString | trim | quote }}
{{- end }}
