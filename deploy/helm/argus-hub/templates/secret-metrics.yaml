{{- if not .Values.api.metricsTokenExistingSecret }}
{{- $fullname := include "argus-hub.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-metrics" $fullname) }}
{{- $token := .Values.api.metricsToken }}
{{- if not $token }}
  {{- if $existing }}
    {{- $token = index $existing.data "token" | b64dec }}
  {{- else }}
    {{- $token = randAlphaNum 40 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-metrics
  labels: {{- include "argus-hub.labels" . | nindent 4 }}
  {{- include "argus-hub.keepAnnotation" . | nindent 2 }}
type: Opaque
stringData:
  # GET /metrics requires this as a bearer token, and serves nothing at all
  # without one (internal/api/metrics.go). So this Secret is created on EVERY
  # install, not only when an operator supplies api.metricsToken — a chart
  # that rendered a hub answering 503 to every scrape by default would be a
  # broken default, not a safe one.
  #
  # An operator-supplied api.metricsToken always wins. Otherwise the value is
  # generated once and then PRESERVED across upgrades via the lookup above
  # (the same pattern secret-bootstrap.yaml and secret-cli-runner.yaml use),
  # so `helm upgrade` cannot silently mint a second, different token and
  # break a Prometheus config that was already working.
  #
  # NOTE the lookup's one real limitation, shared with the two Secrets
  # above: `helm template` and `helm install --dry-run` have no cluster to
  # look at, so they render a FRESH random value every time. That rendered
  # value is not what a real install will hold — read the token back out of
  # the cluster (NOTES.txt step 5 prints the command), never out of a
  # template dump.
  token: {{ $token | quote }}
{{- end }}
