{{- if and (include "argus-hub.cliRunnerEnabled" .) (not .Values.cliRunner.existingSecret) }}
{{- $fullname := include "argus-hub.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-cli-runner" $fullname) }}
{{- $token := .Values.cliRunner.token }}
{{- if not $token }}
  {{- if $existing }}
    {{- $token = index $existing.data "token" | b64dec }}
  {{- else }}
    {{- $token = randAlphaNum 40 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-cli-runner
  labels: {{- include "argus-hub.labels" . | nindent 4 }}
  {{- include "argus-hub.keepAnnotation" . | nindent 2 }}
type: Opaque
stringData:
  # Shared hub<->runner credential. The runner refuses to start without its
  # half, so there is no unauthenticated mode to fall into by forgetting it.
  token: {{ $token | quote }}
{{- end }}
