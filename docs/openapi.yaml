    get:
      operationId: getIncidentEvidence
      tags: [incidents]
      summary: One dispatched tool call's own args/result/error, fetched lazily.
      description: Requires `incident:read` — same capability as reading the incident itself.
      parameters:
        - { $ref: '#/components/parameters/IncidentId' }
        - name: evId
          in: path
          required: true
