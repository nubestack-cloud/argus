# E14 lifecycle matrix, row 1 — "Pending pod — insufficient CPU".
# Campaign context and the full row inventory: README.md in this directory.
#
# Why this row: scheduling & pod admission is the largest issue-catalogue
# category (48 entries) and, as of the 2026-09-01 review, had zero live
# evidence behind it. This is the simplest member of that category: a Pod
# whose spec.containers[].resources.requests.cpu exceeds every Node's
# allocatable CPU, so the scheduler can never place it — a standing
# FailedScheduling Warning Event, Pod stuck in Phase=Pending indefinitely.
#
# Expected raw Kubernetes symptom (verified live on kind-argus-disposable,
# 2026-09-03; the exact kubectl output is in the campaign write-up, now in
# git history): Pod stays Pending, a Warning/FailedScheduling event fires
# repeatedly with a message naming "Insufficient cpu" against every Node.
#
# Expected ARGUS mechanism: the existing warning-events detector
# (internal/agent/detector.go) turns the repeated FailedScheduling Warning
# Event into a finding — this is the OLD, pre-E11 hardcoded event-reason
# path, not one of E11's five kind-agnostic predicates (which read
# status.conditions/generation/finalizers/peer-relationships, not Events).
#
# Usage:
#   kubectl apply -f row01-pending-pod-insufficient-cpu.yaml
#   kubectl -n e14-row01 get pod row01-cpu-pending -w
#   kubectl -n e14-row01 describe pod row01-cpu-pending   # confirm FailedScheduling
#   kubectl delete -f row01-pending-pod-insufficient-cpu.yaml   # cleanup
apiVersion: v1
kind: Namespace
metadata:
  name: e14-row01
  labels:
    e14-lifecycle-matrix: "true"
    e14-row: "row01-pending-insufficient-cpu"
---
apiVersion: v1
kind: Pod
metadata:
  name: row01-cpu-pending
  namespace: e14-row01
  labels:
    app: row01-cpu-pending
spec:
  containers:
    - name: pause
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          # Every node on kind-argus-disposable reports 8 allocatable CPU
          # (confirmed live, 2026-09-03: `kubectl get nodes -o
          # custom-columns=...ALLOC-CPU:.status.allocatable.cpu`). 32 is
          # comfortably impossible to satisfy on any single node.
          cpu: "32"
          memory: "64Mi"
---
# Healthy control for the SAME mechanism (E14 lifecycle matrix, row 12,
# "healthy control — pending-pod/insufficient-CPU"): an otherwise identical
# Pod requesting a satisfiable amount of CPU. Proves the detector doesn't
# fire on ordinary scheduling, not just that it fires on the broken case.
apiVersion: v1
kind: Pod
metadata:
  name: row01-cpu-control-healthy
  namespace: e14-row01
  labels:
    app: row01-cpu-control-healthy
spec:
  containers:
    - name: pause
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
