{{- if not (include "argus-agent.skip" .) }}
{{- if and (not .Values.enrollment.tokenSecretRef.name) .Values.enrollment.token }}
# Rendered only as the dev/testing fallback described in values.yaml's
# `enrollment.token` comment. Prefer enrollment.tokenSecretRef (an existing
# Secret you create yourself) for anything beyond a quick local test —
# lld/03-agent-protocol.md §9's chart-values sketch says plainly "never
# inline in values.yaml" for this field, and this fallback exists to make an
# explicit, opt-in, clearly-labeled exception to that, not to replace it as
# the default path.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.enrollment.generatedSecretName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.enrollment.token | quote }}
{{- end }}
{{- end }}
