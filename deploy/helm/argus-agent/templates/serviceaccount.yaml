{{- if not (include "argus-agent.skip" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
{{- if .Values.remediate.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.remediate.serviceAccount.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
{{- end }}
{{- end }}
