openapi: 3.1.0
info:
  title: ARGUS Hub API
  version: "0.2.0"
  description: |
    Hand-authored, hand-verified OpenAPI 3.1 contract for the hub's public HTTP API
    (`internal/api`, routes registered in `internal/api/server.go`).

    ## Why hand-authored rather than generated from the handlers

    `web/src/api/types.ts` (the previous, hand-transcribed contract) carries load-bearing
    prose doc comments next to almost every field — e.g. an absent
    `ClusterRemediation.namespaces` means "unknown", never "denied"; `RemediationPlan.
    effectiveRiskLevel`, not `riskLevel`, is what a risk badge must show. Scraping Go
    struct tags into a spec mechanically would either lose that prose or require adding
    heavyweight doc-comment annotations to dozens of handler files first. Authoring the
    spec by hand, verified line-by-line against `internal/api/*.go`, was the only way to
    carry that prose into `description:` fields intact on this pass — see each schema
    below.

    This is the "hand-written and verified" branch this item's notes call out as
    defensible, on the condition that something actually re-verifies it against the
    handlers on every change. That something is
    `internal/api/openapi_contract_test.go` / `openapi_contract_db_test.go`: they decode
    real handler responses (the same direct-handler-invocation pattern this package's own
    `*_db_test.go` files already use) and validate them against the schemas below with
    `github.com/getkin/kin-openapi`. A handler that changes its response shape without a
    matching spec edit fails that test — see the test files' own header comments for a
    demonstrated failure.

    ## Route coverage — read this before assuming a route is or isn't documented

    Do not read this paragraph and believe it. `internal/api/route_coverage_test.go`
    parses `internal/api`'s own source with `go/ast` and asserts that every registered
    route is either an operation here or an entry on its own short, reasoned allowlist —
    in all four directions, so neither this file nor that list can rot. The prose here
    had already gone stale twice ("roughly 70 routes") before that test existed; the test
    is the answer to "is this route documented", and this paragraph is orientation.

    Coverage is now near-total: auth and identity (including the three federated sign-in
    legs and the WebSocket connect ticket), clusters, incidents and every action on one,
    the pull-request remediation channel (read/preview/open) and repository-link
    discovery, promotion reconciliation, findings, approvals, repositories, tolerations,
    audit events, automation windows, the circuit breaker, changes and rollback,
    analytics (insights, remediation quality, spend, the diagnostics bundle),
    administration (users, grants, custom roles, cluster groups, identity providers), and
    the settings tree with AI-provider and notification-routing configuration.

    **Seven routes are deliberately, permanently outside this spec**, and the allowlist
    entry for each says so in those words rather than leaving it to be re-litigated:
    `GET /healthz`, `GET /readyz` and `GET /metrics` (probes and a Prometheus scrape
    target, not the product API); `GET /` and `GET /ws/events` (the embedded SPA and a
    WebSocket upgrade — no JSON contract, and OpenAPI 3.1 has no vocabulary for frames);
    and `POST`/`DELETE /demo-data` (registered only behind `ARGUS_ENABLE_DEMO_DATA`, so a
    generated client offering them would offer a call that 404s in every real
    deployment). Note that the first five also sit outside this document's own
    `servers[0].url` of `/api/v1`, so there is no path here they could be written at.

    ## Pagination

    Two shapes exist in this API, and both are keyset (never OFFSET) — see
    `internal/api/incidents.go`'s own doc comment for why: several sort columns
    (`last_seen`, `occurrence_count`, ...) mutate constantly under a live fleet, and an
    OFFSET page would skip or repeat rows as incidents are re-seen underneath the reader.

    - **Sort-key-bound cursor** (`GET /incidents`): the response's `nextCursor` (present
      only when a full page came back) encodes `(id, sortKey, value)`. A cursor minted
      under one `?sort=` is REJECTED (400) if replayed against a different `?sort=` — the
      server cannot compare a cursor's stored value against a different column's keyset
      predicate, and doing so silently would mis-paginate rather than error.
    - **Plain `(timestamp, id)` cursor** (`GET /audit-events`, `GET /findings`): encodes
      `(occurred_at, id)`; not sort-key-bound because these endpoints have only one order.
      `GET /findings` is the one case with no mutating-sort-key caveat at all — a finding's
      `occurred_at` never changes after the row is written.

    Neither cursor is signed/HMAC'd: a cursor carries nothing the caller could not
    already read in the same response, so signing it would protect nothing.

    `GET /approvals` returns `nextCursor` under the identical full-page convention, but
    `ApprovalsPage` never sends `?cursor=` today — a generous bounded `?limit=` plus
    server-side filtering is what the endpoint's own regression suite
    (`internal/api/approvals_query_db_test.go`) exists to prove, and the field is
    documented here as part of the contract regardless of whether today's one caller
    exercises it yet.

    Every list endpoint's aggregate counts (`IncidentsResponse.counts`,
    `ApprovalsResponse.counts`) are computed over the FULL scoped set, never just the
    page — never derive a count from `array.length`.

    ## Errors

    Every non-2xx response is an RFC 9457 `application/problem+json` document: `type`
    (a stable `https://argus.io/errors/...` URI — the one field a client may safely branch
    on), `title` and `detail` (human-facing prose that gets reworded; never match on
    these), `status`, and occasionally an extension member (`confirmationToken` on a
    remediation guardrail refusal — see `Problem` below). See `components.responses` for
    the reusable shapes every route can return, and each operation for the
    route-specific ones layered on top.
  contact:
    name: ARGUS
servers:
  - url: /api/v1
    description: Same-origin, relative to wherever the hub serves the web UI (go:embed) or is reverse-proxied.
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Sign-in, session identity, federated login, and the builtin-role reference.
  - name: clusters
    description: Cluster lifecycle — enrollment (agent-facing, unauthenticated), approval, and fleet listing.
  - name: incidents
    description: The incident queue, one incident's full detail, and the actions that act on it.
  - name: findings
    description: |
      Raw detection output across the fleet — including everything the promotion boundary
      deliberately did NOT turn into an incident.
  - name: approvals
    description: The remediation approval queue.
  - name: repositories
    description: Git repository bindings the pull-request remediation channel may open a PR against.
  - name: tolerations
    description: Suppression rules that stop a recurring finding from opening new incidents.
  - name: audit
    description: The tenant's tamper-evident audit log.
  - name: admin
    description: Automation windows and the unattended-execution circuit breaker.
  - name: repository-change
    description: |
      The pull-request remediation channel — reading a file at the pinned synced commit,
      previewing a change, opening the pull request, and linking an object to the
      repository that produces it when no GitOps controller names one.
  - name: changes
    description: What ARGUS has changed on a cluster recently, and undoing one.
  - name: analytics
    description: Read-only fleet aggregates, metered spend, and the redacted operator diagnostic bundle.
  - name: administration
    description: Local accounts and their grants, custom roles, cluster groups, and identity-provider configuration.
  - name: settings
    description: The org settings tree, AI provider configuration, and replaying candidate detection settings against history.
  - name: mcp
    description: Personal access tokens and the MCP endpoint people point their own AI tools at.

paths:
  # ---------------------------------------------------------------- auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Password sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: |
            Deliberately carries no identity at all — both sign-in paths
            return this same token-only shape; see `GET /users/me` for who the token
            authenticates as. The refresh token travels ONLY as a Secure/HttpOnly/SameSite
            cookie this response sets alongside the body; no page script can read it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong email/password, or the account is disabled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Login rate limit exceeded for this (email, IP) pair.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Exchange the HttpOnly refresh cookie for a new access token.
      description: |
        Rotates the cookie on every success. `mustChangePassword` reports the account's
        current state, as sign-in does. Presenting an already-rotated cookie revokes its
        whole session family (audited as `refresh_token.reuse_detected`) — except the
        immediate predecessor of a never-used successor within a few seconds of its
        rotation, which is exchanged once (audited as `refresh_token.grace_exchange`):
        the signature of a response the browser never received.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Missing, expired, or rotated-out-from-under-you refresh cookie.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current refresh token and clear its cookie.
      security: []
      responses:
        '204': { description: "Always succeeds, including when no session exists." }

  /auth/sso/providers:
    get:
      operationId: listSSOProviders
      tags: [auth]
      summary: Federated sign-in options, for the login screen — runs before anyone is authenticated.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSOProvidersResponse' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/sso/start:
    get:
      operationId: startSSOLogin
      tags: [auth]
      summary: Begin an OIDC authorization-code flow.
      description: |
        Unauthenticated. A browser NAVIGATION, not an XHR — follow the redirect; do not
        fetch it and read the body, because on success there is no body.

        The login state (including `state` and `nonce`) is committed before the redirect
        is written, so the browser cannot come back with a state row that does not exist
        yet.
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string }
          description: An identity provider id from `GET /auth/sso/providers`.
        - name: returnTo
          in: query
          schema: { type: string }
          description: |
            Where to land inside the SPA after sign-in. Stored with the login state and
            sanitised on the way back out — never echoed verbatim.
      responses:
        '302':
          description: Redirect to the identity provider's authorization endpoint. No body.
          headers:
            Location: { schema: { type: string } }
        '400':
          description: |
            No `provider` was given, or that provider is not available. The detail is
            deliberately empty — the real error names the issuer and often quotes the IdP,
            and is logged rather than returned.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/sso/callback:
    get:
      operationId: completeSSOLogin
      tags: [auth]
      summary: The identity provider's redirect back, answered with a redirect into the SPA.
      description: |
        Unauthenticated, and reached by a browser navigation from the identity provider.
        It is not called by client code; it is named here because it is half of the
        contract the two routes either side of it assume.

        **Always answers 302, never a problem document** — including on every failure. A
        raw problem document is a dead end for a person who arrived by navigation, so a
        failure redirects to `/login?ssoError=<reason>` with a reason code this server
        chose (`sso_declined` when the IdP reported one, `sso_failed` otherwise) and the
        SPA renders. Nothing the identity provider said ever reaches a page.

        On success it redirects to `/auth/sso/complete?code=...&returnTo=...`, carrying a
        SINGLE-USE handoff code valid for seconds, which the SPA immediately trades at
        `POST /auth/sso/exchange`. The code is not a session.
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
          description: The identity provider's authorization code.
        - name: state
          in: query
          schema: { type: string }
          description: Matched against the committed login state. A missing or unmatched one is a failure redirect, not an error page.
        - name: error
          in: query
          schema: { type: string }
          description: 'Set by the identity provider instead of `code` when the user declined consent — not a fault of the hub''s, and redirected as `sso_declined`.'
      responses:
        '302':
          description: |
            Either into the SPA's handoff route with a single-use code, or back to
            `/login?ssoError=...`. The status is the same for both; the `Location` is what
            distinguishes them.
          headers:
            Location: { schema: { type: string } }

  /auth/sso/exchange:
    post:
      operationId: exchangeSSOCode
      tags: [auth]
      summary: Trade the single-use handoff code for a session.
      description: |
        Unauthenticated (the code IS the credential). This is where a federated session is
        minted, and it deliberately mints exactly what `POST /auth/login` does — same
        access token, same refresh token, same TTL — so every downstream route, sweeper and
        capability check is identical for a federated and a local user.

        The handoff code is single-use and expires in seconds; a replayed or stale one is a
        401. The account's disabled state is re-checked here rather than trusted from the
        callback, because the window is short but not zero.

        Like `POST /auth/login`, the response body carries no identity, and the refresh
        token travels ONLY as the Secure/HttpOnly cookie this response sets.
        `mustChangePassword` is always false: a federated user has no local password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: The single-use handoff code from the callback redirect. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: The code has already been used, has expired, or the user could not be reloaded.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The account was disabled between the callback and this exchange.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Who the presented access token authenticates as.
      description: |
        The one source of truth for "who am I" on every sign-in path — password,
        federated, and a session restored from a refresh token. No capability check:
        being authenticated as yourself is always enough to ask who you are.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/me/effective-permissions:
    get:
      operationId: getEffectivePermissions
      tags: [auth]
      summary: Every (capability, scope) grant that actually applies to the caller right now.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissionsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------- AD3: MCP for people's own AI tools
  /users/me/mcp-tokens:
    get:
      operationId: listMyMcpTokens
      tags: [mcp]
      summary: Your own personal access tokens for the MCP endpoint, newest first.
      description: |
        No capability is required beyond being signed in, deliberately: someone whose
        `mcp:use` was withdrawn must still be able to see, and revoke, the tokens they hold.
        Only ever the caller's own tokens. The secret is never returned here — only a
        four-character `hint` of its end.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalTokenList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createMyMcpToken
      tags: [mcp]
      summary: Create a personal access token for your own MCP client. The secret is returned once.
      description: |
        Requires `mcp:use`. The token acts as you: every MCP tool call made with it
        re-resolves your grants and needs that tool's own capability. Only its SHA-256 is
        stored, so `secret` cannot be shown again. Lifetime defaults to 90 days and is at
        most 365; one person may hold at most 20 active tokens (409 beyond that). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePersonalTokenRequest' }
      responses:
        '201':
          description: Created. `secret` is the full token, shown only in this response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatePersonalTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: You already hold the maximum number of active tokens.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/me/mcp-tokens/{id}:
    delete:
      operationId: revokeMyMcpToken
      tags: [mcp]
      summary: Revoke one of your own tokens. It stops working on its next request.
      description: |
        No capability is required — revoking your own credential is never blocked. A
        token that is not yours is a 404, the same as one that does not exist. Revoking an
        already-revoked token succeeds. Audited.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mcp:
    post:
      operationId: mcpEndpoint
      tags: [mcp]
      summary: The MCP endpoint for your own AI tool (Streamable HTTP, JSON-RPC 2.0).
      description: |
        Point an MCP client at `<hub>/api/v1/mcp` with `Authorization: Bearer <personal
        access token>`. NOT a session route: a hub access token (JWT) is refused here, and a
        personal token is refused everywhere else.

        Methods: `initialize` (protocol versions 2025-06-18, 2025-03-26, 2024-11-05),
        `tools/list`, `tools/call`, `ping`. Every response is HTTP 200 with the JSON-RPC
        result or error in the body; a notification (no `id`) gets 202 with no body. An
        invalid, expired or revoked token is JSON-RPC error -31001 "invalid or expired MCP
        token"; so is a token whose owner no longer holds `mcp:use` (with that reason), and
        a token over its rate limit (60 requests a minute, bursts of 30).

        The tool surface is read-only: list/get clusters, incidents (with their latest
        analysis and timeline) and findings, a fleet-wide object search, and every tool on
        `POST /clusters/{id}/inspect`'s allowlist, each taking a `clusterId` (id or display
        name). Each call runs as the token's owner: the tool's capability (`cluster:read`,
        `incident:read` or `cluster:inspect`) is checked on the named cluster, and a missing
        one is a tool error naming it. Every call is written to the audit log
        (`actorAuthMethod: mcp_token`, the token id, the tool, the cluster, the outcome).
      security:
        - personalAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JsonRpcRequest' }
      responses:
        '200':
          description: A JSON-RPC response (result or error).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonRpcResponse' }
        '202': { description: A notification was accepted; no body. }
    get:
      operationId: mcpEndpointStream
      tags: [mcp]
      summary: Not offered — this server sends no server-initiated messages.
      description: Streamable HTTP lets a server refuse the optional GET event stream; this one does, with 405.
      security:
        - personalAccessToken: []
      responses:
        '405': { description: Method not allowed (Allow — POST). }
    delete:
      operationId: mcpEndpointSessionEnd
      tags: [mcp]
      summary: Not offered — this server keeps no MCP session state to end.
      security:
        - personalAccessToken: []
      responses:
        '405': { description: Method not allowed (Allow — POST). }

  /roles:
    get:
      operationId: listRoles
      tags: [auth]
      summary: The 5 fixed builtin roles and the capabilities each one carries.
      description: GET only, no specific capability required — same "this isn't sensitive" reasoning as effective-permissions.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------- clusters
  /clusters/enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      tags: [clusters]
      summary: Issue a token an agent can redeem to enroll a new cluster.
      description: Requires `cluster:onboard`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnrollmentTokenRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateEnrollmentTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clusters/fleet-tokens:
    get:
      operationId: listFleetTokens
      tags: [clusters]
      summary: List fleet enrollment tokens, newest first.
      description: >-
        Requires `cluster:onboard`. A token itself is shown only once, when it is issued
        (`POST /clusters/enrollment-tokens` with ttlClass "F"); this lists what it is, how
        often it was used, and whether it was revoked.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FleetToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clusters/fleet-tokens/{id}:
    delete:
      operationId: revokeFleetToken
      tags: [clusters]
      summary: Revoke a fleet token. Clusters already enrolled with it are unaffected.
      description: Requires `cluster:onboard`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /agent/tunnel:
    get:
      operationId: agentTunnel
      tags: [clusters]
      summary: Agent-facing — the agent tunnel, as a WebSocket.
      description: |
        Upgrades to a WebSocket that carries the agent tunnel through the same address and
        Ingress as the rest of the API. The agent runs its mTLS session inside the socket,
        and that is what authenticates it: the hub identifies the cluster by the client
        certificate it issued at enrollment, exactly as on the dedicated tunnel port.
      security: []
      responses:
        '101': { description: Switching to the WebSocket protocol. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /clusters/enroll:
    post:
      operationId: enrollCluster
      tags: [clusters]
      summary: Agent-facing — redeem an enrollment token and get a signed cluster certificate.
      description: |
        Unauthenticated by necessity: the caller is an agent presenting a bearer
        enrollment token (in the body, not a header), not a user with a session — this
        is how a newly installed agent starts its cluster's identity.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: A cluster with this fingerprint is already enrolled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clusters/enroll/status:
    get:
      operationId: getEnrollStatus
      tags: [clusters]
      summary: Agent-facing — poll for approval and (once approved) collect the signed certificate.
      description: |
        Unauthenticated, like `POST /clusters/enroll` — the caller presents the poll
        token minted by that call, not a user session. Once issued, the cert/CA/plan-
        signing-key payload replays identically for 24h (`pollTokenReplayGrace`) and then
        404s, closing what would otherwise be an eternal replay window for the plan
        signing key.
      security: []
      parameters:
        - name: pollToken
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollStatusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clusters/{id}/accept:
    post:
      operationId: acceptCluster
      tags: [clusters]
      summary: Approve a cluster out of PendingApproval into Provisioning.
      description: Requires `cluster:accept`. Only valid from state `PendingApproval`.
      parameters: [ { $ref: '#/components/parameters/ClusterId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clusterId, status]
                properties:
                  clusterId: { type: string }
                  status: { type: string, const: Provisioning }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cluster is not in state `PendingApproval`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clusters/{id}/rename:
    post:
      operationId: renameCluster
      tags: [clusters]
      summary: Change a cluster's display name.
      description: |
        Requires `cluster:onboard` (reused deliberately, not a new capability — renaming
        is the same "manage a cluster's identity metadata" authority applied after the
        fact). Valid from ANY state, including terminal Archived/Rejected.
      parameters: [ { $ref: '#/components/parameters/ClusterId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string, maxLength: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clusterId, displayName]
                properties:
                  clusterId: { type: string }
                  displayName: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clusters/{id}/decommission:
    post:
      operationId: decommissionCluster
      tags: [clusters]
      summary: Archive a cluster, dismissing every open incident on it and severing its tunnel.
      description: Requires `cluster:delete`. Valid from any non-terminal state; already Archived/Rejected is a 409.
      parameters: [ { $ref: '#/components/parameters/ClusterId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clusterId, status]
                properties:
                  clusterId: { type: string }
                  status: { type: string, const: Archived }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already Archived or Rejected — a no-op the caller must not be misled about.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clusters:
    get:
      operationId: listClusters
      tags: [clusters]
      summary: The fleet — excluding retired (archived) clusters unless asked otherwise.
      description: |
        Requires `cluster:read`.

        `?archived=` decides which half of the fleet comes back, and its DEFAULT is
        load-bearing: every cluster picker, count and scope control in the web UI calls
        this route with no parameters, so a decommissioned cluster is excluded from all
        of them by construction rather than by each caller remembering to filter.
      parameters:
        - name: archived
          in: query
          required: false
          schema: { type: string, enum: [exclude, only, include], default: exclude }
          description: |
            `exclude` (default) — the live fleet. `only` — just the retired ones, for a
            retirement view. `include` — both. An unrecognised value is a 400, never a
            silent fall back to the default.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClustersResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clusters/{id}:
    get:
      operationId: getCluster
      tags: [clusters]
      summary: One cluster's full detail, including its last-reported facts.
      description: |
        Requires `cluster:read` at the route level, PLUS a per-cluster scope check inside
        the handler (`authz.HasCapabilityForCluster`) — a grant scoped to other clusters
        gets a 403 naming this cluster specifically, distinct from the route-level 403.
      parameters: [ { $ref: '#/components/parameters/ClusterId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /applications:
    get:
      operationId: listApplications
      tags: [clusters]
      summary: Applications folded across the clusters the caller may read.
      description: >-
        Requires `cluster:read`; only clusters the caller may read are included. Built from the
        fleet-check snapshots (no agent calls). An application folds by the argus.io/app annotation,
        then by declared source (repository plus path or chart), then — for a Helm release no GitOps
        controller owns — by release name; `matchedBy` says which. `skew` is true when instances run
        different applied source revisions; Helm revision numbers are per cluster and never compared.
      responses:
        '200':
          description: The applications, problems first, then skew.
          content:
            application/json:
              schema:
                type: object
                required: [applications]
                properties:
                  asOf: { type: string, format: date-time }
                  truncated: { type: array, items: { type: string }, description: Clusters whose stored list was capped. }
                  applications:
                    type: array
                    items:
                      type: object
                      required: [key, name, matchedBy, instances, skew, problems]
                      properties:
                        key: { type: string }
                        name: { type: string }
                        matchedBy: { type: string, enum: [annotation, source, name] }
                        source: { type: string }
                        skew: { type: boolean }
                        problems: { type: integer }
                        instances:
                          type: array
                          items:
                            type: object
                            required: [clusterId, clusterName, kind, namespace, name]
                            properties:
                              clusterId: { type: string }
                              clusterName: { type: string }
                              kind: { type: string }
                              namespace: { type: string }
                              name: { type: string }
                              version: { type: string }
                              sync: { type: string }
                              health: { type: string }
                              problem: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clusters/{id}/rightsizing/proposals:
    post:
      operationId: proposeRightsizing
      tags: [clusters]
      summary: Turn one rightsizing row into a resource-limits plan awaiting approval.
      description: >-
        Requires `remediation:execute:inplace` on the cluster. The body names the row only; the hub
        re-reads the agent's measurement and proposes each existing request at its recommendation. It
        opens a low-severity incident (RightsizingRequested) whose analysis is the measurement, with
        the plan awaiting approval. 409 when there is no measurement or nothing to change.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, kind, workload, container]
              properties:
                namespace: { type: string }
                kind: { type: string, enum: [Deployment, StatefulSet] }
                workload: { type: string }
                container: { type: string }
      responses:
        '201':
          description: The incident and its plan.
          content:
            application/json:
              schema:
                type: object
                required: [incidentId, planId, outcome, reason]
                properties:
                  incidentId: { type: string }
                  planId: { type: string }
                  outcome: { type: string }
                  reason: { type: string }
        '400': { description: Malformed body., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'No measurement, or nothing to change.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: The change is not proposable or was refused by plan validation., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { description: The cluster's agent is not connected., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /clusters/{id}/agent-upgrade:
    post:
      operationId: upgradeClusterAgent
      tags: [clusters]
      summary: Move this cluster's agent onto the image the hub was released with.
      description: >-
        Requires `agent:upgrade` on the cluster. The hub signs the request with the cluster's plan
        key, pinned to the agent Deployment's resourceVersion, and sends it to the remediate
        connection, which patches only the two agent Deployments' image. 409 when the hub has no
        `agentImage`, the agent chart does not enable self-upgrade, or the agent already runs it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The agent accepted the new image; it restarts onto it.
          content:
            application/json:
              schema:
                type: object
                required: [image]
                properties:
                  image: { type: string }
                  from: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Nothing to do, or not enabled.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '502': { description: The agent refused or failed., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { description: The cluster's agent is not connected., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /clusters/{id}/workload-metrics:
    get:
      operationId: getWorkloadMetrics
      tags: [clusters]
      summary: CPU, memory, restart and throttling series for one workload or pod, ending now.
      description: |
        Requires `cluster:inspect` (the object panel's Metrics tab). Read through the
        agent's Prometheus access. `available` is false with a `reason` when the cluster has no
        Prometheus configured or the agent is disconnected — never an empty chart that reads as zero.
        `kind` must be Pod, Deployment, StatefulSet, DaemonSet, ReplicaSet or Job, and `namespace`
        and `name` DNS-1123 names; anything else is a 400.
      parameters:
        - { $ref: '#/components/parameters/ClusterId' }
        - { name: kind, in: query, required: true, schema: { type: string } }
        - { name: namespace, in: query, required: true, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: range, in: query, schema: { type: string, enum: ['1h', '6h', '24h'] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkloadMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clusters/{id}/inspect/{tool}:
    post:
      operationId: inspectCluster
      tags: [clusters]
      summary: Run one allowlisted read-only agent tool against this cluster, on behalf of a person.
      description: |
        Requires `cluster:inspect` at the route level, PLUS a per-cluster scope check inside
        the handler. `tool` must be one of the hub's inspectable tools
        (`internal/api/cluster_inspect.go`'s `inspectableTools`): describe_resource, get_events,
        get_logs, get_owner_chain, get_gitops_ownership, get_neighborhood, trace_service_path,
        evaluate_network_policy, get_subject_permissions, diagnose_autoscaler, diagnose_rollout,
        explain_scheduling, get_drain_impact, get_rightsizing, get_karpenter_capacity, get_policy_findings, get_gitops_insight, get_helm_release_status,
        get_upgrade_readiness, get_traffic, get_cost_summary, search_objects,
        get_posture_findings, list_certificates, list_helm_releases, list_gitops_apps,
        get_namespace_topology, get_network_policy_map. Anything else is a 404 before the agent is
        asked. The agent answering that the object it was asked about does not exist
        (its reason ends "not found") is also a 404, titled "Not found", with problem type
        `https://argus.io/errors/object-not-found` and the agent's reason in `detail`. The body is the tool's argument object. The result is the tool's own JSON,
        already redacted by the agent at capture time. `get_logs` reads are recorded in the
        audit log.
      parameters:
        - { $ref: '#/components/parameters/ClusterId' }
        - name: tool
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502':
          description: The agent answered with an error other than not-found. `detail` carries the agent's own reason (redacted by the agent at capture, tidied and bounded by the hub) when it gave one, otherwise the kind of failure (no answer in time, not delivered). A failed audited read (`get_logs`) is still audited.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: The cluster's agent is not connected.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /clusters/{id}/resource-changes:
    get:
      operationId: listResourceChanges
      tags: [clusters]
      summary: Field-level changes the agent recorded for this cluster's objects, newest first.
      description: |
        Requires `cluster:read` at the route level, PLUS a per-cluster scope check. Env and
        ConfigMap values never appear — only that they were added, removed or modified.
        `gaps` are windows in which changes were lost (the history is incomplete there).
      parameters:
        - { $ref: '#/components/parameters/ClusterId' }
        - { name: namespace, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceChangeList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clusters/{id}/timeline:
    get:
      operationId: getClusterTimeline
      tags: [clusters]
      summary: One cluster's object changes, findings and incidents on one time axis, one row per owning object.
      description: |
        Requires `cluster:read` at the route level, PLUS a per-cluster scope check. Findings and
        incidents are read only when the caller also holds `incident:read` on this cluster; otherwise
        they are left out and named in `restricted`. Rows are objects rolled up to their owning
        workload (Pod → ReplicaSet → Deployment) from recorded ownerReferences and incident workload
        keys; each mark names its own object. Repeated reports of one finding are collapsed into runs
        (no silence longer than `findingRunGapSeconds`). Filters run before every cap; `totals` are
        exact and `truncated` counts what a cap left out. The window may not exceed 7 days.
      parameters:
        - { $ref: '#/components/parameters/ClusterId' }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: 'Defaults to 24 hours before until.' }
        - { name: until, in: query, schema: { type: string, format: date-time }, description: 'Defaults to now.' }
        - { name: namespace, in: query, schema: { type: string } }
        - { name: types, in: query, schema: { type: string }, description: 'Comma-separated subset of changes, findings, incidents. Default all.' }
        - { name: onlyIncidents, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterTimeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clusters/{id}/upgrade-scans/latest:
    get:
      operationId: getLatestUpgradeScan
      tags: [clusters]
      summary: This cluster's newest upgrade-readiness scan, with its full result.
      description: Requires `cluster:read` plus a per-cluster scope check. `scan` is null when none has run.
      parameters: [ { $ref: '#/components/parameters/ClusterId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpgradeScanEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clusters/{id}/upgrade-scans:
    post:
      operationId: runUpgradeScan
      tags: [clusters]
      summary: Run an upgrade-readiness scan for a target Kubernetes minor now.
      description: |
        Requires `cluster:read` plus a per-cluster scope check — the scan only reads the agent's
        object cache. At most one per cluster per minute. An empty target means the next minor.
        A target must be newer than the cluster's current minor and no later than the release the
        check catalogue is reviewed through (the next minor itself is always accepted); anything
        else is a 400 whose detail names the usable range. A jump of several minors is accepted —
        the scan's upgrade-path check reports each skipped minor as a blocker. Every scan sent to
        the agent is audited (`upgrade_scan:run`), whatever its outcome. A 502 carries the agent's
        own reason in `detail`.
      parameters: [ { $ref: '#/components/parameters/ClusterId' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetVersion: { type: string, example: '1.37' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpgradeScanEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '429':
          description: Scanned less than a minute ago.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: The agent could not complete the scan.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: The cluster's agent is not connected.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /fleet/summary:
    get:
      operationId: getFleetSummary
      tags: [clusters]
      summary: The fleet Overview's aggregate — every readable cluster's facts digest and stored fleet checks.
      description: |
        Requires `cluster:read`; each cluster is listed only when the caller holds `cluster:read` on it.
        `checks` carries the hub's stored answers to four read-only agent tools (certificates, posture,
        Helm releases, GitOps apps), re-read for every connected cluster every `intervalSeconds`, and
        is present only where the caller also holds `cluster:inspect` on that cluster
        (`checksReadable`). Each check keeps its last successful summary when a later read fails, with
        the failure beside it. A check absent from `checks` has not been read yet.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /upgrade-scans/latest:
    get:
      operationId: listFleetUpgradeScans
      tags: [clusters]
      summary: Each visible cluster's newest next-minor upgrade-readiness verdict (without the full result).
      description: |
        Requires `cluster:read`; RLS limits the rows to the caller's clusters. Only scans whose
        target is the minor right after the scanned version count — a one-off scan for another
        target never replaces a cluster's "next upgrade" verdict, and a cluster with only such
        scans is absent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [scans]
                properties:
                  scans:
                    type: array
                    items: { $ref: '#/components/schemas/UpgradeScan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /search:
    get:
      operationId: searchObjects
      tags: [clusters]
      summary: Find objects by name, label or image across every connected cluster the caller may inspect.
      description: |
        Requires `cluster:inspect`; each cluster is additionally checked per cluster. Clusters that
        did not answer are listed, so a partial result never reads as complete. Query grammar:
        free words plus `kind:`, `ns:`, `label:k=v`, `image:`.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------ incidents
  /incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: The incident queue — filtered, sorted, counted and paginated server-side.
      description: Requires `incident:read`. See the top-level description for pagination.
      parameters:
        - { $ref: '#/components/parameters/IncidentClusterId' }
        - { $ref: '#/components/parameters/IncidentState' }
        - { $ref: '#/components/parameters/RequiresAction' }
        - name: status
          in: query
          schema: { type: string, enum: [open, requiresAction, inProgress, closed] }
          description: |
            The lifecycle bucket: a disposition (requiresAction, inProgress, closed), or `open` for the
            first two together. Absent means every state.
        - name: severity
          in: query
          schema: { type: string, enum: [low, medium, high, critical] }
        - name: search
          in: query
          schema: { type: string }
          description: Free-text ILIKE across fingerprint, id, cluster name/id, opening reason, and object name/namespace.
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/IncidentSortKey' }
        - name: direction
          in: query
          schema: { $ref: '#/components/schemas/IncidentSortDirection' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - name: cursor
          in: query
          schema: { type: string }
          description: A `nextCursor` from a previous response under the SAME `?sort=`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /incidents/digest:
    get:
      operationId: listIncidentsDigest
