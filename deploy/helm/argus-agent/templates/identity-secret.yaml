{{- if not (include "argus-agent.skip" .) }}
{{- if not (has .Values.identity.mode (list "secret" "ephemeral")) }}
{{- fail (printf "argus-agent: identity.mode must be \"secret\" (durable, the default) or \"ephemeral\" (identity lost on any pod replacement — see values.yaml). Got %q." .Values.identity.mode) }}
{{- end }}
{{- if eq .Values.identity.mode "secret" }}
# PROJECT.md B163: durable agent identity, without assuming a StorageClass.
#
# THE FAILURE THIS CLOSES. The agent's issued private key, leaf certificate,
# tunnel CA, cluster id, plan signing key and fingerprint used to live only in
# the `agent-data` volume, which is an emptyDir unless persistence.enabled was
# turned on. So ANY pod replacement — node drain, eviction, `kubectl rollout
# restart`, a resource-limit edit, `helm upgrade` — destroyed this cluster's
# identity, and reconnecting then needed a fresh enrollment token AND a repeat
# human "accept" on the hub. A routine Kubernetes operation permanently
# disconnected a cluster, and the documented happy path was the fragile one.
#
# WHY A SECRET AND NOT THE PVC. The recorded reason persistence.enabled
# defaults to false is still correct and is not being overridden here: this
# chart targets a fleet of 200+ heterogeneous clusters and cannot assume any of
# them provisions a usable default StorageClass, so defaulting a PVC on would
# break `helm install` wherever there is none. A Secret needs no StorageClass,
# is reachable from whichever node the replacement Pod lands on, and survives
# node loss — which a node-local ReadWriteOnce PVC does not. persistence
# remains available and unchanged for anyone who prefers a volume.
#
# WHY THIS IS NOT A WIDENING OF THE AGENT'S SECRET ACCESS. This chart already
# stores the ENROLLMENT TOKEN as a Secret in this same namespace
# (templates/secret.yaml, values.yaml's enrollment.tokenSecretRef) — the
# credential that lets a party enroll as this cluster in the first place.
# Anyone who can read Secrets in this namespace could already take this
# cluster's identity; keeping the issued leaf next to the token that issues it
# changes nothing about who can do what. The grant below is a NAMESPACED Role,
# restricted by resourceNames to this one Secret, with `get` and `update` only:
#
#   - no `create`, because RBAC cannot restrict create by resourceNames (the
#     name is not known at admission time), so granting it would mean "create
#     any Secret in this namespace". The chart creates the empty Secret here
#     instead, so the agent never needs it.
#   - no `list` or `watch`, which would expose every other Secret in the
#     namespace — the same permanent exclusion templates/clusterrole.yaml's
#     header states for the cluster-wide read role.
#   - nothing is added to that ClusterRole at all. Its "no Secret access beyond
#     a single named get" posture is untouched by this file.
#
# TWO OPERATIONAL CAVEATS, stated rather than left to be discovered:
#
#   - `helm upgrade --force` replaces objects instead of patching them, which
#     would discard this Secret's contents and force a re-enrollment. Do not
#     use --force against an enrolled agent.
#   - `helm uninstall` deletes this Secret with the rest of the release. That
#     is deliberate — an uninstall is a decommission — but it means a
#     reinstall is a fresh enrollment, not a resumption.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.identity.secretName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
  annotations:
    argus.io/purpose: "agent identity issued by the hub at enrollment — written by the agent, never by an operator"
type: Opaque
# No `data` block, deliberately and permanently. The agent owns the contents;
# this chart owns only the object. Rendering the data (even via `lookup` to
# preserve it) would put the identity under Helm's three-way merge, where a
# later revision that rendered it empty would DELETE the live keys — the exact
# failure this whole file exists to prevent. A field this chart has never
# managed is a field Helm will never remove.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus-agent-identity
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.identity.secretName }}]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus-agent-identity
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
subjects:
  # The investigation agent, which is the one that ENROLLS and therefore the
  # one that writes this Secret. `update` is for it.
  - kind: ServiceAccount
    name: {{ include "argus-agent.serviceAccountName" . }}
    namespace: {{ .Values.namespace.name }}
  {{- if .Values.remediate.enabled }}
  # PROJECT.md E11: the remediation agent READS the same identity, and never
  # enrolls.
  #
  # This is what makes "one physical cluster, one ARGUS cluster record, two
  # tunnel connections" work with no change to the enrollment API at all.
  # Both Deployments present the SAME hub-issued client certificate, so the
  # gateway's cert-serial lookup resolves both connections to the same
  # cluster id; they are told apart by the role each declares on its first
  # message (internal/tunnel.Hello), not by separate credentials.
  #
  # The alternative would have been a second enrollment, which the hub
  # correctly refuses (409, duplicate fingerprint) — and working around THAT
  # with values.yaml's clusterFingerprint override would produce two cluster
  # records for one cluster, which is exactly the cost that override's own
  # comment warns is only acceptable for a temporary side-by-side rollout.
  #
  # It grants this identity no more than the investigation agent already has
  # on this one named Secret: get + update, resourceNames-restricted, no
  # list, no watch, no create. See this file's header for why that is not a
  # widening of the agent's Secret access.
  - kind: ServiceAccount
    name: {{ .Values.remediate.serviceAccount.name }}
    namespace: {{ .Values.namespace.name }}
  {{- end }}
roleRef:
  kind: Role
  name: argus-agent-identity
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
