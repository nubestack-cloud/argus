{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argus-hub.serviceAccountName" . }}
  labels: {{- include "argus-hub.labels" . | nindent 4 }}
# No RBAC of any kind, deliberately. The hub does not talk to the Kubernetes API
# — every cluster interaction goes out through an agent over the tunnel, and the
# agent holds the only Kubernetes credentials (lld/04-rbac-profiles.md). A hub
# ServiceAccount with cluster permissions would quietly undo that.
automountServiceAccountToken: false
{{- end }}
