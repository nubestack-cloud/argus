#
# Fixture: a plain (non-GitOps) Deployment mounting a ConfigMap as a volume.
# The ConfigMap was deleted and the Pod force-recreated, producing a real,
# repeated `FailedMount: configmap "e14-row9-cm" not found` warning event —
# the exact fault internal/remediation/createresource.go's own header names
# as CreateResource's motivating case.
apiVersion: v1
kind: Namespace
metadata:
  name: e14-row9-recreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: e14-row9-cm
  namespace: e14-row9-recreate
data:
  app.conf: "mode=production\nretries=3\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e14-row9-app
  namespace: e14-row9-recreate
  labels:
    app: e14-row9-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e14-row9-app
  template:
    metadata:
      labels:
        app: e14-row9-app
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "cat /etc/e14row9/app.conf && sleep 3600"]
          volumeMounts:
            - name: cfg
              mountPath: /etc/e14row9
      volumes:
        - name: cfg
          configMap:
            name: e14-row9-cm

