{{- /*
The backup before an upgrade. Migrations only move forward, so the way back
from a bad upgrade is the dump taken just before it (docs/INSTALL.md,
"Rolling back an upgrade"). A pre-upgrade hook: it runs against the database
as it is, before Helm changes anything, and the upgrade stops if it fails.

The dump goes onto the database's own volume (backups/, beside pgdata/), so it
needs no second volume. That volume is ReadWriteOnce, which lets a second pod
mount it on the same node, so the Job is scheduled next to the Postgres pod.
This is a way back from an upgrade, not a backup policy: it shares the
database's disk. Production databases are external, with their own backups.

A dump holds the hub's keys (session signing, enrollment, the agents' CA,
plan signing, secret encryption) beside the data. It connects as the
`postgres` superuser from the -db Secret: every ARGUS table has FORCE ROW
LEVEL SECURITY, so the app role would dump nothing.
*/}}
{{- $backup := dig "backup" dict .Values.postgres.bundled }}
{{- $fullname := include "argus-hub.fullname" . }}
{{- $keep := int ($backup.keep | default 2) }}
{{- if and (eq .Values.postgres.mode "bundled") .Values.postgres.bundled.persistence.enabled (ne ($backup.beforeUpgrade | toString) "false") .Release.IsUpgrade (lookup "apps/v1" "StatefulSet" .Release.Namespace (printf "%s-postgres" $fullname)) }}
{{- if lt $keep 1 }}
{{- fail "postgres.bundled.backup.keep must be at least 1." }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-postgres-backup-pre-upgrade
  labels:
    {{- include "argus-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-backup
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        {{- include "argus-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-backup
    spec:
      restartPolicy: Never
      # Talks to Postgres only; it has no use for a Kubernetes API token.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        # On the Postgres pod's node, the only place its volume can mount.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "argus-hub.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: postgres
      securityContext:
        # The image's own postgres UID, as the StatefulSet runs.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pg-dump
          # The same pinned image as the server, so pg_dump's version matches.
          image: {{ .Values.postgres.bundled.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: PGHOST
              value: {{ include "argus-hub.postgresService" . | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: {{ .Values.postgres.bundled.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-db
                  key: postgresPassword
            - name: KEEP
              value: {{ $keep | quote }}
          # Written under a .partial name and renamed only after pg_restore
          # --list has read the whole archive back, so a failed run never
          # leaves something that looks like a good dump.
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              mkdir -p /pgvolume/backups
              cd /pgvolume/backups
              ts="$(date -u +%Y%m%dT%H%M%SZ)"
              pg_dump -Fc -f "argus-$ts.dump.partial"
              pg_restore --list "argus-$ts.dump.partial" > /dev/null
              mv "argus-$ts.dump.partial" "argus-$ts.dump"
              rm -f ./*.partial
              ls -1 argus-[0-9]*.dump | sort -r | tail -n "+$((KEEP + 1))" | xargs -r rm -f --
              echo "pre-upgrade backup: backups/argus-$ts.dump ($(wc -c < "argus-$ts.dump") bytes); kept newest $KEEP"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: pgvolume
              mountPath: /pgvolume
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pgvolume
          persistentVolumeClaim:
            claimName: data-{{ $fullname }}-postgres-0
        - name: tmp
          emptyDir: {}
{{- end }}
