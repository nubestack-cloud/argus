{{- if not (include "argus-agent.skip" .) }}
{{- if and .Values.remediate.enabled .Values.remediate.nodeOps.enabled }}
# PROJECT.md PG15: cordon and drain. Its own opt-in, because none of these
# verbs can be narrowed by name: `patch nodes` reaches every node, and `create
# pods/eviction` can evict any pod in any namespace (disruption budgets bound
# the availability impact only where they exist). The admission policy below
# limits the node write to spec.unschedulable; the eviction API itself
# enforces disruption budgets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argus-remediate-nodeops
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argus-remediate-nodeops
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.remediate.serviceAccount.name }}
    namespace: {{ .Values.namespace.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argus-remediate-nodeops
---
# The node write may change spec.unschedulable and nothing else: not labels,
# annotations, taints (the node controller adds the unschedulable taint under
# its own identity), the pod CIDR or the provider ID.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argus-remediate-node-restriction
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["nodes"]
  matchConditions:
    - name: only-argus-remediate
      expression: "request.userInfo.username == 'system:serviceaccount:{{ .Values.namespace.name }}:{{ .Values.remediate.serviceAccount.name }}'"
  validations:
    - expression: >
        (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) &&
        (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {})
      message: "argus-remediate may not change a Node's labels or annotations"
    - expression: >
        (has(object.spec.taints) ? object.spec.taints : []) == (has(oldObject.spec.taints) ? oldObject.spec.taints : []) &&
        (has(object.spec.podCIDR) ? object.spec.podCIDR : '') == (has(oldObject.spec.podCIDR) ? oldObject.spec.podCIDR : '') &&
        (has(object.spec.podCIDRs) ? object.spec.podCIDRs : []) == (has(oldObject.spec.podCIDRs) ? oldObject.spec.podCIDRs : []) &&
        (has(object.spec.providerID) ? object.spec.providerID : '') == (has(oldObject.spec.providerID) ? oldObject.spec.providerID : '')
      message: "argus-remediate may change only spec.unschedulable on a Node"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: argus-remediate-node-restriction
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
spec:
  policyName: argus-remediate-node-restriction
  validationActions: ["Deny"]
{{- end }}
{{- end }}
