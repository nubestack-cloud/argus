    get:
      operationId: getIncidentTimeline
      tags: [incidents]
      summary: The incident's own chronology — what ARGUS did and when.
      description: Requires `incident:read`. Always oldest-first.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelineResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /incidents/{id}/analyze:
    post:
      operationId: analyzeIncident
      tags: [incidents]
      summary: Start (or re-start) the investigation loop against this incident.
      description: |
        Requires `incident:reanalyse`. Answers `202` as soon as the run is claimed — the
        incident is `Investigating` and `analysisStartedAt` is set — and investigates in
        the background, so no request outlives a proxy's idle timeout. The outcome is read
        from `GET /incidents/{id}` (signalled by the live-events feed's `IncidentUpdated`):
        `analysis` and the next `state` on success, or `analysisError` and a restored
        `state` on failure.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      responses:
        '202':
          description: Accepted — the investigation is running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisStarted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            An investigation of this incident is already running
            (`type` `https://argus.io/errors/analysis-in-progress`; a second request never
            starts a duplicate, on any hub replica), or the incident's state forbids one
            (`https://argus.io/errors/invalid-state` — closed, or mid-execution).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: |
            Nothing was started: the cluster's agent is not connected
            (`https://argus.io/errors/cluster-unreachable`), no AI provider is usable
            (`https://argus.io/errors/llm-not-configured`, `detail` says why), or the hub is
            draining for a restart (`https://argus.io/errors/shutting-down`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /incidents/{id}/approve:
    post:
      operationId: approveIncident
      tags: [approvals]
      summary: Approve the incident's current plan.
      description: |
        Requires `remediation:approve` at the route level, PLUS `remediation:execute:
        inplace` or `remediation:execute:pr` depending on the approved plan's own action
        type (a property of the plan, not the route). See `ApprovalDecisionResponse` for
        what actually happens on approval per action type.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmScaleFromZero: { type: boolean }
                confirmGitOpsManaged: { type: boolean }
                confirmationToken: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDecisionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Two structurally distinct refusals share this status, each with its own
            `type` (see `client.ts`'s `PROBLEM_SCALE_FROM_ZERO_REFUSED` /
            `PROBLEM_GITOPS_MANAGED_REFUSED`): the live target's replica count read as 0
            (retry with `confirmScaleFromZero`), or the target is Helm-/GitOps-owned
            (retry with `confirmGitOpsManaged`). A remediation guardrail refusal instead
            carries `confirmationToken` as an extension member on the problem document —
            echo it back on the confirmed retry.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /incidents/{id}/reject:
    post:
      operationId: rejectIncident
      tags: [approvals]
      summary: Reject the incident's current plan, dismissing the incident.
      description: Requires `remediation:reject`.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDecisionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /incidents/{id}/preflight:
    post:
      operationId: preflightIncident
      tags: [approvals]
      summary: Rehearse the incident's current plan against the live cluster; persists nothing.
      description: Requires `remediation:approve` — same floor as approve, since this makes ARGUS send a dry-run patch.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreflightResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /incidents/{id}/resolve:
    post:
      operationId: resolveIncident
      tags: [incidents]
      summary: Close the incident as resolved.
      description: |
        Requires `incident:read`-adjacent triage capability. Closing an incident is a
        statement about the past — its detector opens a new one if the fault recurs,
        because nothing here mutes detection (see `POST /incidents/{id}/tolerate` for
        that).
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentTriageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /incidents/{id}/dismiss:
    post:
      operationId: dismissIncident
      tags: [incidents]
      summary: Close the incident as dismissed — a named person decided it does not need action.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentTriageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /incidents/{id}/tolerate:
    post:
      operationId: tolerateIncident
      tags: [incidents]
      summary: Create a suppression rule from this incident, and dismiss it.
      description: Requires `incident:silence`.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reasons: { type: array, items: { type: string } }
                note: { type: string }
                expiresAt: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TolerateIncidentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------- repository changes
  # The pull-request remediation channel, driven by a human from the incident
  # page: read a file at the pinned synced commit, preview what a pull request
  # would contain, then open it. All three share one resolution phase
  # (`internal/api/repository_files.go`'s `resolveRepoChangeTarget`) and all
  # three require the SAME three capabilities — see each operation.
  /incidents/{id}/repository-change/file:
    get:
      operationId: getRepositoryChangeFile
      tags: [repository-change]
      summary: One file's current content at the commit the GitOps controller reports synced.
      description: |
        Requires ALL THREE of `repo:write`, `remediation:approve` and
        `remediation:execute:pr`, each re-checked against this incident's own cluster.
        The route writes nothing and still carries the write routes' capabilities
        deliberately: it returns real repository content, so whoever can call it can read
        any file the binding reaches under the synced directory.

        The repository, the directory and the commit come from the incident's stored
        GitOps ownership — never from the request. That is what makes it safe for a
        caller (or a model) to name a file: it names one inside a repository and a
        directory it did not choose.

        `filePath` is optional. With none, ARGUS finds the single file under the synced
        directory that declares this incident's object and refuses if there are none or
        several; `filePathSource` and `filesScanned` in the response say which happened.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: filePath
          in: query
          schema: { type: string }
          description: |
            Repository-relative path. Confined to the directory the controller reports
            syncing and checked against the forbidden-path denylist (`*.age`, `*.sops.*`,
            sealed secrets, CI definitions) BEFORE anything is read — this route must not
            become a way to read content ARGUS may never touch.
      responses:
        '200':
          description: The file as it reads at the pinned synced commit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryFileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Missing one of the three capabilities on this incident's cluster
            (`https://argus.io/errors/scope-denied`), or the repository credential was
            rejected or has expired (`https://argus.io/errors/repository-unusable`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/RepositoryChangeUnprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /incidents/{id}/repository-change/preview:
    post:
      operationId: previewRepositoryChange
      tags: [repository-change]
      summary: What the pull request would contain — nothing is branched, committed or opened.
      description: |
        Requires the same three capabilities as opening the change (`repo:write`,
        `remediation:approve`, `remediation:execute:pr`): a preview reads repository
        content at a specific commit and renders it back, so granting it to a wider
        audience than the people who may open the pull request would be an exposure in
        exchange for nothing.

        It runs the SAME code the commit does (`gitops.PreviewChanges` and
        `gitops.ProposeChanges` share `prepareChanges` verbatim) and stops where the
        other cuts a branch — so every refusal the write path can make is reachable here
        without costing a branch. `verification` is byte-identical in shape to the one
        `POST /incidents/{id}/repository-change` returns.

        Deliberately NOT refused for a closed incident, unlike the open route: a preview
        writes nothing.

        A client assembling a multi-file change calls this after each edit with every
        file it has so far.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryChangeRequest' }
      responses:
        '200':
          description: The diffs, the checks, and what ARGUS could not check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryChangePreviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Missing a capability on this incident's cluster, or the repository credential was rejected.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: A file has changed since the proposal was built (`https://argus.io/errors/repository-changed`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/RepositoryChangeUnprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /incidents/{id}/repository-change:
    post:
      operationId: openRepositoryChange
      tags: [repository-change]
      summary: Open a pull request carrying these whole files.
      description: |
        Requires `repo:write` AND `remediation:approve` AND `remediation:execute:pr`, all
        three re-checked against this incident's own cluster. The last is what
        lld/02-authz-spec.md's "may approve PRs but never touch a cluster in place"
        grant names.

        **Nothing in the cluster changes.** The fix takes effect when a human merges the
        pull request and the GitOps controller syncs it — ARGUS never auto-merges.

        A change is a set of WHOLE FILES, not a field and a value: one file or several,
        each carrying the content the file should end up holding (or `delete: true`).
        ARGUS computes the diff. The repository, the directory, the synced commit, the
        base branch and the fix branch are all resolved from the incident's stored
        ownership and cannot be named by the caller; every path is confined to the
        directory the controller reports syncing and checked against the forbidden-path
        denylist; every file is read at the pinned commit and committed as a
        compare-and-swap against the blob that was read.

        Refused with 409 if the incident is Resolved or Dismissed.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryChangeRequest' }
      responses:
        '201':
          description: |
            The pull request is open. A non-empty `warning` means something non-fatal did
            not happen (today, only labelling) — "read this", not "it failed".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryChangeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Missing a capability on this incident's cluster, or the repository credential was rejected or expired.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The incident is closed (`.../invalid-state`), a fix branch for it already
            exists (`.../invalid-state`), or a file changed since the proposal was built
            (`.../repository-changed`). Nothing was written in any of the three.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/RepositoryChangeUnprocessable' }
        '500':
          description: |
            Also the honest answer to "the pull request opened but its audit record could
            not be written": the response reports failure and names the pull request,
            rather than claiming a success ARGUS cannot account for.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ----------------------------------------------------- repository links
  # "Ask once, where the problem is met": an incident whose object is Helm-managed
  # or plain-manifest has no GitOps controller to name a repository, so ARGUS
  # renders registered repositories and asks the operator to confirm the match.
  /incidents/{id}/discover-repository-link:
    post:
      operationId: discoverRepositoryLink
      tags: [repository-change]
      summary: Find which registered repository actually produces this incident's object.
      description: |
        Requires `repo:read` — this only renders (Helm) or parses (plain manifests) in
        the sandbox and never writes. Takes no request body.

        Applies to exactly two states: a Helm-managed object, or a plain-manifest object
        (no Helm release, no GitOps controller) with labels of its own — either way with
        NO repository already known. Anything else is a 409: an Argo CD/Flux-managed
        object already has a controller that names its source, and a target that already
        resolves to a repository has nothing to discover.

        `status` is the verdict, and `degraded` is never conflated with `none`: a chart
        that could not be rendered has told ARGUS nothing about whether it produces the
        object.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      responses:
        '200':
          description: The verdict and its candidates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoverRepositoryLinkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `https://argus.io/errors/conflict` — the incident is not a Helm or
            plain-manifest object with no repository link, it already resolves to a
            repository, or it names no object at all. The request is well-formed; it is
            the incident's own state that makes the action inapplicable.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /incidents/{id}/confirm-repository-link:
    post:
      operationId: confirmRepositoryLink
      tags: [repository-change]
      summary: Register the confirmed link as an object mapping on a repository binding.
      description: |
        Requires `repo:write`. ARGUS never links silently, even on an exact render match:
        this one-click confirmation is the only write path that adds an object mapping
        for the discovery flow.

        The release name and namespace (Helm mode) or the label selector (manifest mode)
        are NEVER taken from the request — they are re-read from the incident's own
        stored ownership, so a client cannot register a mapping this incident's evidence
        never proved. Only `bindingId`, `path` and `scope` are the caller's to state.

        On success the incident's ownership is re-resolved immediately, so the
        pull-request channel becomes available on this same request rather than only
        after the next analysis.

        Returns the updated repository binding, the same shape `GET /repositories`
        returns per entry.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmRepositoryLinkRequest' }
      responses:
        '200':
          description: The binding, with the new mapping appended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryBinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such repository binding.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Same three inapplicable-state conflicts as `POST /incidents/{id}/discover-repository-link`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /incidents/{id}/decline-repository-link:
    post:
      operationId: declineRepositoryLink
      tags: [repository-change]
      summary: Never ask about this release (or labelled object) again.
      description: |
        Requires `repo:write` — a decline is stored, durable state, for the same reason
        a confirmation is. Takes no request body.

        Keyed on the same identity a confirmed mapping is (cluster + release + namespace
        in Helm mode, the object's own identity in manifest mode), and checked BEFORE any
        render runs, so declining is also what stops a repeatedly-reopened incident
        spending sandbox budget every time.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      responses:
        '204':
          description: |
            Recorded. Discovery for this identity now answers with a `status` of `declined`.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Same three inapplicable-state conflicts as `POST /incidents/{id}/discover-repository-link`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------- promotion reconcile
  /incidents/reconcile-promotion:
    post:
      operationId: reconcileIncidentPromotion
      tags: [incidents]
      summary: Close the open incidents the current evidence boundary would no longer raise.
      description: |
        Requires `incident:triage` — the same capability that dismisses one incident by
        hand, because this is that same decision made once for a set, not a new
        authority. A caller sees and can close exactly the clusters their grants reach.

        **A dry run unless the body says `{"apply": true}`**, and `apply` additionally
        requires a non-empty `note`: this closes incidents nobody reviewed, and `Expired`
        has no way back except a genuine recurrence.

        A candidate is an open incident with finding history whose findings are ALL ones
        today's promotion boundary would not promote. An open incident with no findings
        at all is never a candidate — an empty history is not a non-promotable one.

        It closes the INCIDENT and never touches a `findings` row; `findingsRetained`
        is reported so that is checkable rather than asserted. Incidents another writer
        owns (anything not awaiting human action, or with no legal edge to `Expired`)
        are skipped and say so in `skipReason`.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionReconcileRequest' }
      responses:
        '200':
          description: |
            The verdict, the per-incident evidence summary, and a `message` stating in
            words what was or would be done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionReconcileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------ approvals
  # ------------------------------------------------------------ findings
  /findings:
    get:
      operationId: listFindings
      tags: [findings]
      summary: Every finding the fleet reported, with what ARGUS did about each one.
      description: |
        Requires `incident:read` — the same capability as the incident list, because a
        finding is the evidence an incident is made of and `GET /incidents/{id}` already
        returns findings under it.

        **What this answers.** `GET /incidents` is what ARGUS RAISED. This is everything it
        SAW, including what the promotion boundary
        (`internal/gateway/promotion.go`) deliberately kept as an observation. Every
        response carries `promotionRule` — the boundary itself, as data — so a reader can
        see why something stayed a finding rather than being told to trust that it should
        have.

        **What it cannot show, and says so.** Three of the gateway's dispositions
        (a disabled detector, a disabled rule, and a condition the polarity gate resolved
        as healthy) drop the finding before any row is written. Those exist in no table and
        appear at no filter setting; `promotionRule.notRecorded` states that in the payload,
        and the `argus_findings_processed_total` counter is where their volume is visible.

        **`counts` is the true total**, over the full cluster/reason/class/confidence/impact/
        window scope — never the length of the returned page, and deliberately NOT narrowed
        by `?disposition=` (that would leave two of the three buckets at zero and destroy
        the comparison). With `?disposition=` applied, the exact total of the rows being
        listed is the count that names it.

        **Time window.** `?since=` defaults to seven days back and the resolved bounds come
        back in `window`. `findings` is range-partitioned on `occurred_at` and is the
        highest-volume table in the schema, so the window is what keeps the exact counts
        affordable — and a count is only honest alongside the window it counted.
      parameters:
        - { $ref: '#/components/parameters/IncidentClusterId' }
        - name: reason
          in: query
          schema: { type: string }
          description: Exact match on the detector's reason, not a substring — a closed vocabulary, where a substring match would conflate `GenericConditionAnomaly:Ready` with `GenericConditionAnomaly:ReadyReplicas`.
        - name: disposition
          in: query
          schema: { $ref: '#/components/schemas/FindingDisposition' }
        - name: class
          in: query
          schema: { $ref: '#/components/schemas/FindingClass' }
        - name: confidence
          in: query
          schema: { $ref: '#/components/schemas/FindingConfidence' }
        - name: impact
          in: query
          schema: { $ref: '#/components/schemas/FindingImpact' }
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: RFC 3339. Defaults to seven days before the request.
        - name: until
          in: query
          schema: { type: string, format: date-time }
          description: RFC 3339. Open-ended when omitted. Must not be earlier than `since`.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: cursor
          in: query
          schema: { type: string }
          description: A `nextCursor` from a previous response.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: The remediation approval queue — everything ApprovalsPage needs per row without a second round trip.
      description: Requires `remediation:approve` (GET is gated by the same capability as the write actions).
      parameters:
        - name: clusterId
          in: query
          schema: { type: string }
        - name: actionType
          in: query
          schema: { $ref: '#/components/schemas/RemediationActionType' }
        - name: riskLevel
          in: query
          schema: { type: string, enum: [low, medium, high] }
          description: Filters on the plan's EFFECTIVE risk level, never the model's bare declared `riskLevel`.
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/ApprovalSortKey' }
        - name: direction
          in: query
          schema: { $ref: '#/components/schemas/ApprovalSortDirection' }
          description: Each sort key has its own default direction when omitted — "waiting" defaults asc (oldest first); "risk"/"severity" default desc.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --------------------------------------------------------- repositories
  /repositories:
    get:
      operationId: listRepositories
      tags: [repositories]
      summary: Every registered Git repository binding.
      description: Requires `repo:read`. Never returns a stored token — only `credentialStored`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoriesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createRepository
      tags: [repositories]
      summary: Register a repository binding (or rotate its credential, by re-registering the same URL).
      description: Requires `repo:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRepositoryBindingRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryBinding' }
        '400':
          description: Bad JSON, missing token, a classic-PAT-shaped token refused as too broad, a bad `expiresAt`, or a provider validation failure.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /repositories/{id}:
    put:
      operationId: updateRepository
      tags: [repositories]
      summary: A genuine partial update — every field is independently optional; omitting one leaves it unchanged.
      description: Requires `repo:write`. See `UpdateRepositoryBindingRequest` for the per-field omit/clear/replace contract.
      parameters: [ { $ref: '#/components/parameters/RepositoryId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRepositoryBindingRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryBinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Another repository is already registered for that URL.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteRepository
      tags: [repositories]
      summary: Remove a repository binding and its stored credential together.
      description: Requires `repo:write`.
      parameters: [ { $ref: '#/components/parameters/RepositoryId' } ]
      responses:
        '204': { description: Binding and credential removed together. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /repositories/{id}/check:
    post:
      operationId: checkRepository
      tags: [repositories]
      summary: Prove the stored credential works right now, via a real authenticated read.
      description: Requires `repo:write`. Proves READ access only, never write.
      parameters: [ { $ref: '#/components/parameters/RepositoryId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryCheckResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The credential is expired or forbidden (same problem `type` as 422 below — `repository-unusable`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The credential could not be used for a reason other than expired/forbidden.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------- tolerations
  /tolerations:
    get:
      operationId: listTolerations
      tags: [tolerations]
      summary: Every active (non-removed) suppression rule visible to the caller.
      description: |
        Requires `incident:silence`. No pagination and no filters — this is every active
        rule, newest first; the response body is a bare JSON array, not an envelope
        object.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Toleration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tolerations/{id}:
    get:
      operationId: getToleration
      tags: [tolerations]
      summary: One suppression rule, where it came from, and what it has actually silenced.
      description: Requires `incident:silence`. Not filtered on removed — a removed rule's history remains readable.
      parameters: [ { $ref: '#/components/parameters/TolerationId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TolerationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: removeToleration
      tags: [tolerations]
      summary: Soft-delete a suppression rule — future findings on that object resume opening incidents.
      description: Requires `incident:silence`.
      parameters: [ { $ref: '#/components/parameters/TolerationId' } ]
      responses:
        '204': { description: Removed (or already removed — same 404 either way if retried after success). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found, or already removed — indistinguishable to the client by design.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --------------------------------------------------------------- audit
  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: The tenant's audit log — keyset-paginated, newest first.
      description: Requires `audit:read` (org-only, super-admin-only — not tenant-admin).
      parameters:
        - name: actor
          in: query
          schema: { type: string }
          description: Free text against actor id, email, or display name.
        - name: capability
          in: query
          schema: { type: string }
        - name: cluster
          in: query
          schema: { type: string }
          description: >-
            Exact match against cluster_id. Rows with no cluster (org-level events —
            a settings write, login, user/grant change) never match, deliberately.
        - name: resource
          in: query
          schema: { type: string }
          description: >-
            Free text against the object an event was about, matched either directly
            (details.objectKey) or via the incident the event names
            (details.incidentId -> incidents.object_key). Events with neither key
            (most non-remediation, non-incident writes) have no resource concept
            and are never matched. Not index-backed on this table — pair with
            `cluster`/`since`/`until` on a large log.
        - name: outcome
          in: query
          schema: { type: string, enum: [success, denied, error] }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /audit-events/{id}:
    get:
      operationId: getAuditEvent
      tags: [audit]
      summary: One audit event's full detail, including its raw scope/details and hash-chain fields.
      description: Requires `audit:read`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /audit-events/export:
    get:
      operationId: exportAuditEvents
      tags: [audit]
      summary: Stream a bounded, chronological window of audit events as CSV or JSON.
      description: |
        Requires `audit:read`. Unlike the list route, `since`/`until` are BOTH REQUIRED
        here and the window is capped at 92 days. Streamed: the response commits to 200
        on the first byte, so a mid-stream failure produces a truncated body rather than
        an RFC 9457 error (a deliberate, documented trade for flat memory use on a large
        export).
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
        - name: actor
          in: query
          schema: { type: string }
        - name: capability
          in: query
          schema: { type: string }
        - name: cluster
          in: query
          schema: { type: string }
          description: Same as GET /audit-events's `cluster` — see that entry.
        - name: resource
          in: query
          schema: { type: string }
          description: Same as GET /audit-events's `resource` — see that entry.
        - name: outcome
          in: query
          schema: { type: string, enum: [success, denied, error] }
        - name: since
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: A CSV or JSON array of `AuditEventExportRow`, streamed.
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEventExportRow' }
        '400':
          description: Missing/invalid format, filter, or a since/until window that is missing, inverted, or wider than 92 days.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --------------------------------------------------------------- admin
  /admin/automation-windows:
    get:
      operationId: listAutomationWindows
      tags: [admin]
      summary: Configured maintenance/freeze windows, and whether automation would run right now.
      description: |
        Requires `org:settings:write` (deliberately not a narrower capability — see
        `AutomationWindowsResponse`). A malformed FREEZE window is reported as open (fail-
        blocking), never as closed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationWindowsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createAutomationWindow
      tags: [admin]
      summary: Add a maintenance or freeze window.
      description: Requires `org:settings:write`. Validated at configuration time — a bad cron schedule is refused when typed, not discovered when a window fails to open.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAutomationWindowRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties: { id: { type: string } }
        '400':
          description: An invalid schedule, kind, timezone, or duration.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/automation-windows/{id}:
    delete:
      operationId: deleteAutomationWindow
      tags: [admin]
      summary: Remove a window — deleting a freeze is the act of permitting automation during a period someone deliberately closed.
      description: Requires `org:settings:write`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/circuit-breaker:
    get:
      operationId: getCircuitBreaker
      tags: [admin]
      summary: The unattended-execution circuit breaker's policy and every currently-open trip.
      description: |
        Requires `org:settings:write`. Unlike a blast-radius cap, a breaker STAYS tripped
        until reset — unattended execution is off until somebody acts.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircuitBreakerResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateCircuitBreakerPolicy
      tags: [admin]
      summary: Update the breaker's thresholds.
      description: Requires `org:settings:write`. Every field is optional; an omitted field leaves its stored value unchanged.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                maxPerCluster: { type: integer, minimum: 1 }
                maxFleetWide: { type: integer, minimum: 1 }
                windowSeconds: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircuitBreakerResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/circuit-breaker/{id}/reset:
    post:
      operationId: resetCircuitBreakerTrip
      tags: [admin]
      summary: Manually reset one open trip, resuming unattended execution for its scope.
      description: Requires `org:settings:write`. Race-safe — a second concurrent reset of the same trip 404s.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { note: { type: string, maxLength: 4096 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [reset]
                properties: { reset: { type: boolean, const: true } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No open trip with that id — it may already have been reset.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------- administration
  # The admin console's own surface: local accounts and their grants, custom
  # roles, cluster groups, and federated identity-provider configuration. One
  # client today (the web UI), but the shapes are the contract regardless.
  /users:
    get:
      operationId: listUsers
      tags: [administration]
      summary: Every local account with its currently-active grants.
      description: |
        Requires `user:read`. Deliberately NOT paginated — this is a small admin list (a
        handful to low hundreds of accounts), not a fleet-scale table.

        "Active" here means exactly what it means everywhere authorization is decided:
        not revoked, and not expired.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createUser
      tags: [administration]
      summary: Create a local account with a server-generated temporary password.
      description: |
        Requires `user:manage`. Not an email-invite flow: the account gets a
        server-generated temporary password and `mustChangePassword: true`, the same
        mechanism the bootstrap account uses.

        **The temporary password is returned exactly once, in this response only.** It is
        never logged, not even at debug level, and never appears in the audit event this
        request records.

        An `initialGrant` is applied atomically in the same request. A role naming
        capabilities the CREATOR does not themselves hold is refused with 403 — the
        no-escalation-through-delegation rule, not a scope check.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created. Capture `temporaryPassword` now — it cannot be read back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateUserResponse' }
        '400':
          description: Invalid email, unknown role, invalid scope, or a scope naming a cluster or cluster group that does not exist.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Missing `user:manage`, or (`https://argus.io/errors/scope-denied`) the initial
            grant would confer capabilities the caller does not hold.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`https://argus.io/errors/already-exists` — an account with this email already exists.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/{id}:
    delete:
      operationId: removeUser
      tags: [administration]
      summary: Soft-remove an account, preserving its audit history.
      description: |
        Requires `user:remove` — deliberately stricter than disable/enable's `user:manage`,
        and super-admin only.

        A SOFT removal: historical audit references to this actor stay intact. Removing
        yourself is refused, and so is removing the last active super-admin — a tenant
        with nobody who can administer it is not a recoverable state.
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200':
          description: 'Removed. `status` is `removed`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserLifecycleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: User not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`https://argus.io/errors/self-removal`, or `https://argus.io/errors/last-super-admin`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/{id}/grants:
    post:
      operationId: createGrant
      tags: [administration]
      summary: Grant a role to this account at a scope.
      description: |
        Requires `user:manage`. `role` is either one of the five builtin roles or a custom
        role id — there is no second assignment route for custom roles.

        Refused with 403 if the role would confer a capability the CALLER does not
        themselves hold, at the scope they hold it.

        `justification` is optional by decision: a reason on the grants someone will
        actually ask about beats a mandatory field filled with "asdf" under time pressure.
        It is what an access review reads first.
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGrantRequest' }
      responses:
        '201':
          description: The created grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Missing `user:manage`, or the grant would escalate beyond what the caller holds.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such user.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/{id}/grants/{grantId}:
    delete:
      operationId: revokeGrant
      tags: [administration]
      summary: Revoke one grant.
      description: |
        Requires `user:manage`. The row is marked revoked rather than deleted, so an
        access review can still see that the access existed and when it ended.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: grantId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Revoked. `status` is `revoked`.'
          content:
            application/json:
              schema:
                type: object
                required: [grantId, status]
                properties:
                  grantId: { type: string }
                  status: { type: string, enum: [revoked] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such grant.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [administration]
      summary: Issue a fresh temporary password and end every session this account holds.
      description: |
        Requires `user:manage`. Takes no request body.

        It really is a reset, not just a gate on the NEXT sign-in: it forces
        `mustChangePassword` back on, revokes every refresh-token session, AND bumps the
        token generation, which invalidates access tokens already issued and not yet
        expired. An admin resetting a compromised account must be able to end the session
        an attacker is already holding.

        No new token pair comes back — the acting admin is not the target user. The
        temporary password is returned once and never logged.
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200':
          description: The temporary password, shown once.
          content:
            application/json:
              schema:
                type: object
                required: [temporaryPassword]
                properties:
                  temporaryPassword: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: User not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/{id}/disable:
    post:
      operationId: disableUser
      tags: [administration]
      summary: Disable an account without deleting it.
      description: |
        Requires `user:manage`. A soft disable, not a hard delete — the account, its
        grants and its audit history stay. Takes no request body.

        Refused if the account is already disabled, or if it is the last active
        super-admin.
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200':
          description: 'Disabled. `status` is `disabled`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserLifecycleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: User not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`.../invalid-state` (already disabled) or `.../last-super-admin`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/{id}/enable:
    post:
      operationId: enableUser
      tags: [administration]
      summary: Re-enable a disabled account.
      description: Requires `user:manage`. Takes no request body. Refused if the account is already enabled.
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200':
          description: 'Enabled. `status` is `enabled`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserLifecycleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: User not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`.../invalid-state` — already enabled.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/me/password:
    put:
      operationId: changeOwnPassword
      tags: [auth]
      summary: Change your own password.
      description: |
        No capability is required — being authenticated as yourself is always sufficient
        to change your own password.

        `currentPassword` is verified even for an account still carrying a temporary
        password from `POST /users/{id}/reset-password`. Skipping that check there would
        let anyone who ever saw the temporary password set one of their own, even after
        the legitimate owner had already changed it.

        On success the password is rotated, `mustChangePassword` is cleared, and the token
        generation is bumped — which invalidates every OTHER session immediately. That is
        why this route returns a **fresh token pair** (`LoginResponse`, with the refresh
        token as a cookie) rather than an empty body: the caller's own session would
        otherwise be invalidated by its own request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200':
          description: A new token pair for this session. Every other session is now invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          description: Malformed body, or the new password does not meet requirements — `detail` says which rule.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: '`https://argus.io/errors/invalid-credentials` — the current password is wrong.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----------------------------------------------------------- custom roles
  /custom-roles:
    get:
      operationId: listCustomRoles
      tags: [administration]
      summary: Admin-authored bundles of existing capabilities.
      description: |
        Requires `user:read` — the same floor as `GET /users`, and no more sensitive than
        the grants that list already returns.

        A custom role is never a new permission: it is a named subset of the SAME
        capability catalogue the builtin roles draw from. Unlike `GET /roles` (the builtin
        reference, ungated), these are real tenant-authored rows.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles: { type: array, items: { $ref: '#/components/schemas/CustomRole' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createCustomRole
      tags: [administration]
      summary: Compose a named bundle of capabilities.
      description: |
        Requires `role:manage`. Two independent checks on the capability set, and both
        matter: every string must be a REAL, current capability (never an arbitrary or
        typo'd one), and the set must not confer anything the CREATOR does not themselves
        hold — composing a bundle you do not hold and handing it to someone else,
        including your later self, is the same escalation.

        The name may not reuse one of the five builtin role names.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomRoleRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomRole' }
        '400':
          description: No name, a reserved name, or a capability set containing a string that is not a real capability.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`https://argus.io/errors/scope-denied` — the set contains capabilities the caller does not hold.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`https://argus.io/errors/already-exists` — a custom role with this name exists.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /custom-roles/{id}:
    put:
      operationId: updateCustomRole
      tags: [administration]
      summary: Replace a custom role's capability set.
      description: |
        Requires `role:manage`. The capability set is REPLACED wholesale, subject to the
        same two checks the create route applies. The name is immutable by this route.

        Note the response is built from the request rather than re-read: `createdBy` and
        `createdAt` come back as empty strings here. Re-read `GET /custom-roles` if you
        need them.
      parameters: [ { $ref: '#/components/parameters/CustomRoleId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capabilities]
              properties:
                capabilities: { type: array, items: { type: string } }
      responses:
        '200':
          description: 'The updated role, with `createdBy`/`createdAt` empty — see the description.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The set contains capabilities the caller does not hold.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Custom role not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteCustomRole
      tags: [administration]
      summary: Delete a custom role that nothing is using.
      description: |
        Requires `role:manage`. Refused with 409 while any active grant still references
        it — deleting it would silently remove someone's access.
      parameters: [ { $ref: '#/components/parameters/CustomRoleId' } ]
      responses:
        '200':
          description: 'Deleted. `status` is `deleted`.'
          content:
            application/json:
              schema:
                type: object
                required: [roleId, status]
                properties:
                  roleId: { type: string }
                  status: { type: string, enum: [deleted] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Custom role not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`https://argus.io/errors/in-use` — an active grant still references this role.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --------------------------------------------------------- cluster groups
  /cluster-groups:
    get:
      operationId: listClusterGroups
      tags: [administration]
      summary: Named subsets of the cluster inventory, with their membership.
      description: |
        Requires `cluster:read` — the same floor as `GET /clusters`.

        A group exists to be the target of a `ClusterGroup`-scoped grant: "team ownership"
        is not a separate schema, it is an ordinary grant scoped to a group instead of to
        one cluster or to all of them.

        Membership is an explicit, audited row, NOT a dynamic label-selector match.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clusterGroups]
                properties:
                  clusterGroups: { type: array, items: { $ref: '#/components/schemas/ClusterGroup' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createClusterGroup
      tags: [administration]
      summary: Create an empty cluster group.
      description: Requires `cluster:group:manage`. The group starts with no members.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: 'Created, with `clusterIds` empty.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cluster-groups/{id}:
    delete:
      operationId: deleteClusterGroup
      tags: [administration]
      summary: Delete a cluster group nothing is scoped to.
      description: |
        Requires `cluster:group:manage`. Refused with 409 while any active grant is scoped
        to this group — deleting it would silently change who can reach what.
      parameters: [ { $ref: '#/components/parameters/ClusterGroupId' } ]
      responses:
        '200':
          description: 'Deleted. `status` is `deleted`.'
          content:
            application/json:
              schema:
                type: object
                required: [groupId, status]
                properties:
                  groupId: { type: string }
                  status: { type: string, enum: [deleted] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Cluster group not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`https://argus.io/errors/in-use` — an active grant is scoped to this group.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cluster-groups/{id}/clusters:
    post:
      operationId: addClusterToGroup
      tags: [administration]
      summary: Add a cluster to a group.
      description: |
        Requires `cluster:group:manage`.

        This write is itself an audited security event, not incidental logging: adding a
        cluster to a group silently grants access to everyone already holding a
        `ClusterGroup` grant on it.
      parameters: [ { $ref: '#/components/parameters/ClusterGroupId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clusterId]
              properties:
                clusterId: { type: string }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [groupId, clusterId]
                properties:
                  groupId: { type: string }
                  clusterId: { type: string }
        '400':
          description: No `clusterId`, or it names a cluster that does not exist.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Cluster group not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`https://argus.io/errors/already-exists` — already a member.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cluster-groups/{id}/clusters/{clusterId}:
    delete:
      operationId: removeClusterFromGroup
      tags: [administration]
      summary: Remove a cluster from a group.
      description: Requires `cluster:group:manage`. Audited for the same reason adding one is.
      parameters:
        - $ref: '#/components/parameters/ClusterGroupId'
        - name: clusterId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Removed. `status` is `removed`.'
          content:
            application/json:
              schema:
                type: object
                required: [groupId, clusterId, status]
                properties:
                  groupId: { type: string }
                  clusterId: { type: string }
                  status: { type: string, enum: [removed] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: This cluster is not a member of that group.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------- identity providers
  /admin/identity-providers:
    get:
      operationId: listIdentityProviders
      tags: [administration]
      summary: Every configured OIDC provider with its group mappings.
      description: |
        Requires `identity:manage` — super-admin only.

        **The client secret is write-only over this API.** No read path returns it and
        there is no reveal endpoint; `hasClientSecret` is how a form renders "leave blank
        to keep". An operator who has lost it rotates it at the identity provider.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers: { type: array, items: { $ref: '#/components/schemas/IdentityProvider' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createIdentityProvider
      tags: [administration]
      summary: Register an OIDC provider.
      description: |
        Requires `identity:manage`.

        **Discovery is attempted before the row is written when the provider is being
        enabled.** A configuration that cannot discover cannot authenticate anyone, so
        storing it enabled would present a broken sign-in button and the operator would
        hear about it from a user rather than from this API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveIdentityProviderRequest' }
      responses:
        '200':
          description: The provider's id.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        '400':
          description: Invalid configuration, or discovery against the issuer failed while enabling it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/identity-providers/{id}:
    put:
      operationId: updateIdentityProvider
      tags: [administration]
      summary: Update a registered OIDC provider.
      description: |
        Requires `identity:manage`. Same handler and same pre-write discovery check as the
        create route.

        `clientSecret` has three distinguishable cases and they all mean different things:
        absent keeps what is stored, `""` makes it a public client, a value replaces it.
      parameters: [ { $ref: '#/components/parameters/IdentityProviderId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveIdentityProviderRequest' }
      responses:
        '200':
          description: The provider's id.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        '400':
          description: Invalid configuration, or discovery failed while enabling it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteIdentityProvider
      tags: [administration]
      summary: Remove an OIDC provider.
      description: |
        Requires `identity:manage`.

        Deleting the provider does NOT revoke anything: existing sessions and
        IdP-derived grants are unchanged, and the response says so in `note`. Revoke them
        separately if that is the intent.
      parameters: [ { $ref: '#/components/parameters/IdentityProviderId' } ]
      responses:
        '200':
          description: Deleted, with the standing note about sessions and grants.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, note]
                properties:
                  deleted: { type: string }
                  note: { type: string }
        '400':
          description: No provider id was given.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such identity provider.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/identity-providers/{id}/group-mappings:
    post:
      operationId: addIdentityGroupMapping
      tags: [administration]
      summary: Map one IdP group onto one ARGUS role.
      description: |
        Requires `identity:manage`.

        The role must be one this hub actually has — a builtin or a custom role — checked
        HERE rather than at sign-in: a mapping naming a role that does not exist would
        silently grant nothing, and "nobody is in that group" would look identical.

        The mapping's scope is always `AllClusters` today, matching what every builtin
        role's scope means. A narrower per-mapping scope is not offered rather than being
        offered and ignored.
      parameters: [ { $ref: '#/components/parameters/IdentityProviderId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupName, roleId]
              properties:
                groupName: { type: string }
                roleId: { type: string, description: A builtin role name or a custom role id. }
      responses:
        '200':
          description: The mapping's id.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        '400':
          description: Missing `groupName`/`roleId`, or a role that is neither builtin nor a custom role in this organisation.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/identity-providers/{id}/group-mappings/{mappingId}:
    delete:
      operationId: deleteIdentityGroupMapping
      tags: [administration]
      summary: Remove one group mapping.
      description: |
        Requires `identity:manage`. Grants already derived from this mapping are not
        revoked by removing it; they are re-synced on the user's next federated sign-in.
      parameters:
        - $ref: '#/components/parameters/IdentityProviderId'
        - name: mappingId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such group mapping.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------ analytics
  /insights:
    get:
      operationId: getInsights
      tags: [analytics]
      summary: Fleet-wide aggregates — recurring issue classes, noisy namespaces, unstable clusters, investigation outcomes and token spend.
      description: |
        Requires `incident:read` AND `analysis:read` — both, because the response genuinely
        reads both tables. Every builtin role that holds one holds the other, so this
        documents the real dependency rather than picking one capability as a stand-in.

        Every ranked list is a top-10 digest, not a paginated listing: this is a reporting
        screen's "top offenders" panel, and there is no cursor.

        All aggregation happens in Postgres (`GROUP BY`/`COUNT`/`SUM`/`AVG`); nothing is
        fetched into memory to be counted.

        Two panels are deliberately NOT computed and are returned as `notBuilt` entries
        with a written reason instead: a confidence calibration curve (which would need
        shadow-mode history that does not exist — plotting self-reported model confidence
        as a verified probability is exactly what must never ship) and per-class autonomy
        readiness. Render the reason; do not render an empty chart.
      parameters:
        - name: clusterId
          in: query
          schema: { type: string }
          description: Narrow every aggregate to one cluster. Omit for the whole fleet.
        - name: days
          in: query
          schema: { type: integer, enum: [14, 30, 90] }
          description: |
            Ranking window for the top-N lists. Only 14, 30 or 90 are accepted — anything
            else is a 400. Omitting it aggregates over all history.

            It does NOT narrow what "new" means: `newIssueClasses`/`newNoisyNamespaces`
            use their own fixed lookback, reported as `newSignalWindowDays`, because "does
            this have ANY history before the last N days" has to be asked against the whole
            visible history.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /insights/remediation-quality:
    get:
      operationId: getRemediationQualityInsights
      tags: [analytics]
      summary: Which recommendations humans keep rejecting, and which combinations they always approve.
      description: |
        Requires `remediation:approve` — NOT `incident:read`/`analysis:read`. It is a
        separate endpoint from `GET /insights` for that reason alone: approval and
        rejection history is already gated behind `remediation:approve`, a strictly
        narrower set of roles, and folding it into the main insights response would either
        weaken that response's gate or silently omit fields for a capability the caller
        cannot see.

        Accepts the same `clusterId`/`days` contract as `GET /insights`.
      parameters:
        - name: clusterId
          in: query
          schema: { type: string }
        - name: days
          in: query
          schema: { type: integer, enum: [14, 30, 90] }
          description: 14, 30 or 90 only; anything else is a 400. Omit for all history.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemediationQualityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /spend/today:
    get:
      operationId: getSpendToday
      tags: [analytics]
      summary: Today's measured AI spend, and whether it can be measured at all.
      description: |
        Requires `spend:read` — deliberately narrower and more widely held than the
        `org:settings:write` that configures pricing and the ceiling.

        `todaySpendUsd` sums only analyses whose cost was actually METERED. A
        subscription-billed CLI run reports a notional figure, not spend, and is excluded
        rather than folded in as zero — `spendCountable` is how a caller knows the total
        cannot be complete. Never render an unmeasurable total as `$0.00`.

        `ceilingBreached` can be true while `ceilingEnforceable` is false (a deployment
        that switched backends mid-day still has countable rows from earlier). A caller
        showing both must let "breached" win: that is the one that actually stopped
        automatic investigation.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendTodayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /diagnostics/bundle:
    get:
      operationId: getDiagnosticsBundle
      tags: [analytics]
      summary: A bounded, redacted support bundle — versions, connection state, configuration presence, detector health, recent internal errors.
      description: |
        Requires `org:settings:write` — the same capability that rewrites AI-provider and
        repository configuration, because being able to rewrite it already implies being
        able to see whether it works, and with `?probe=true` this route spends provider
        tokens and makes live outbound calls.

        This is a support artifact for a human to read and attach, NOT centralized log
        aggregation, a telemetry product or a remote-support channel.

        **No secret reaches this bundle.** Configuration is reported as PRESENCE only
        (`apiKeySet`, `runnerTokenSet`, `credentialStored`), never as a value; freeform
        text from outside the process (a probe's error message, a detector's failure, an
        audited action's summary) is scrubbed of every collected secret value and then run
        through the bounded pattern layer.

        The bundle states what it left out: `manifest.omitted` names each field and why,
        which is what makes the rest of it trustworthy. `manifest.truncated` and the
        per-section `*Truncated` flags say when a section was cut to stay inside the size
        bound — an absent row is not an absent fact.
      parameters:
        - name: probe
          in: query
          schema: { type: boolean, default: false }
          description: |
            `true` additionally makes one live connectivity check per configured AI
            provider and Git host. This spends tokens and makes outbound calls; without it
            every `connectivityChecked` is false and no connectivity field is populated.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticsBundle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------ settings
  /admin/settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: The whole org settings tree.
      description: |
        Requires `org:settings:write` — there is no separate read capability, and this is
        deliberately super-admin only (tenant-admin does not hold it). The sections carry
        credentials' PRESENCE and the autonomy ceiling, so read and write have the same
        audience.

        **No secret is ever returned.** `apiKeySet`, `cliRunnerTokenSet` and
        `webhookConfigured` are booleans; there is no reveal path.

        Two conventions run through the whole tree and a client that ignores either will
        render the wrong thing:

        - **null means "not configured", and what that falls back to differs per
          section.** For `analysis` and `autonomy` a null falls back to a further tier
          (env var, then a hardcoded default) — which is why those sections also carry
          `effective*` fields, always concrete, stating what the very next run would
          actually use. For `retention`, `detection` and `cost` there is no further tier:
          null means exactly what it says (keep forever / no ceiling / no pricing), and
          there is nothing to resolve.
        - **an empty array is a real answer, not a missing one.** No severity selected
          means nothing is auto-analysed; an empty unattended-namespace allowlist means
          unattended execution may act NOWHERE. Neither is "unset, so everything".

        `cost.todaySpendUsd`/`ceilingBreached` are not columns — they are the live answer,
        computed the same way the enforcement check computes it, so the screen and the
        guardrail can never disagree.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update one or more sections of the settings tree.
      description: |
        Requires `org:settings:write`. Returns the whole tree as it now stands, so a
        client never has to guess what a write resolved to.

        **The merge is per SECTION, not per field.** Omit a section entirely and it is
        untouched. Include a section and every field in it is taken exactly as given —
        a key missing inside a present section decodes to its zero value and CLEARS the
        stored one. The two exceptions are the secrets (`llm.apiKey`,
        `llm.cliRunnerToken`, `notify.webhookUrl`), which are pointers: absent keeps what
        is stored, `""` clears it, a value replaces it.

        `outbound.privateDestinations` is replaced wholesale for the same reason —
        removing an exception is the operation that matters most on a list of security
        exceptions, and merge semantics would make it unexpressible.

        This route cannot weaken the hard, non-configurable high-risk-and-irreversible
        floor: that check runs before any autonomy field is consulted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSettingsRequest' }
      responses:
        '200':
          description: The whole tree after the write.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
        '400':
          description: |
            A validation failure with a precise message: an unknown provider kind or CLI
            agent, an unknown severity or detector/rule id, a duplicate id, a
            storm-protection threshold without its window, an out-of-range risk level or
            confidence, or a malformed outbound allowlist entry.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/notification-routing:
    get:
      operationId: getNotificationRouting
      tags: [settings]
      summary: Which destination a notification goes to, by cluster group, severity and transition.
      description: |
        Requires `org:settings:write` — the same capability as `/admin/settings`, because
        the single webhook URL these rules generalise is already behind it: repointing
        every notification in the fleet must not be reachable by someone not trusted to
        change the one URL.

        **No destination URL is ever returned.** An incoming-webhook URL embeds a
        bearer-equivalent token in its path, so a destination is identified by NAME and
        `urlConfigured` is the only thing said about its URL — which is what makes this
        response safe to render, log and screenshot.

        `defaultRule` is reported separately because it is not editable here: it is
        whatever the settings tree resolves the webhook URL to, and `source` names the
        screen to change it on. It is reported at all because a default with nowhere to
        send silently delivers nothing that no rule claimed, and that state is worth
        showing rather than discovering from a log line.

        `transitions` and `severities` are the closed sets a rule may name, served with
        the configuration so a client builds its selects from what THIS build accepts
        rather than from a list copied into a frontend that then drifts.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationRoutingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateNotificationRouting
      tags: [settings]
      summary: Replace the whole routing table in one transaction.
      description: |
        Requires `org:settings:write`. Returns the same shape `GET` does, re-read after
        the write.

        **Whole-set, not per-row, deliberately.** A routing table is ordered and its rows
        are only meaningful relative to each other: "critical anywhere pages the on-call,
        everything else goes to the team channel" is one statement about three rules, not
        three independent facts. A per-row CRUD surface would have intermediate states in
        which notifications are genuinely mis-routed, with no way for a client to avoid
        them. One PUT is one transaction and has no such window.

        A destination's `url` is nullable so an admin UI that read the GET back can rename
        a destination or repoint a rule at it WITHOUT having the URL to send: absent or
        null keeps whatever is stored under that name.

        A rule's `enabled` is absent-means-ENABLED — a rule an operator said nothing about
        should be in force, and the other default would silently disable every rule
        written by a client that has not learned the field yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationRoutingRequest' }
      responses:
        '200':
          description: The routing table as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationRoutingResponse' }
        '400':
          description: |
            Malformed body, or `https://argus.io/errors/validation` — a rule naming a
            destination that is not in the same request, an unknown severity or
            transition, a duplicate name, or any other rejection from the routing
            validator, with the specific reason in `detail`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/ai-providers:
    get:
      operationId: listAIProviders
      tags: [settings]
      summary: Every configured AI provider, and which one is active.
      description: |
        Requires `org:settings:write` — these carry an LLM API key and a runner bearer
        token, the same secrets `/admin/settings` does, so splitting them onto a
        different capability would be inconsistent for no gain.

        Secrets are never returned: `apiKeySet`/`runnerTokenSet` only.

        `activeProviderId` is empty when nothing is active, which is a real state (a fresh
        install, or the active provider was deleted) and not an error — but note that no
        analysis can run in it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIProvidersResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createAIProvider
      tags: [settings]
      summary: Configure another AI provider.
      description: |
        Requires `org:settings:write`. Creating one does not activate it.

        Every mutation in this group returns the FULL list rather than the one row, so a
        client never has to guess what else changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIProviderRequest' }
      responses:
        '201':
          description: The full list after the create.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIProvidersResponse' }
        '400':
          description: A validation failure, surfaced verbatim — e.g. `baseUrl is required for an api provider`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A provider with that name already exists.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/ai-providers/{id}:
    put:
      operationId: updateAIProvider
      tags: [settings]
      summary: Update one AI provider.
      description: |
        Requires `org:settings:write`. `apiKey`/`runnerToken` follow the pointer contract:
        omitted leaves the stored secret unchanged, `""` clears it, a value replaces it.
        Every other field is taken exactly as given.
      parameters: [ { $ref: '#/components/parameters/AIProviderId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIProviderRequest' }
      responses:
        '200':
          description: The full list after the update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIProvidersResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: AI provider not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: That name is taken.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteAIProvider
      tags: [settings]
      summary: Remove an AI provider.
      description: |
        Requires `org:settings:write`. Deleting the ACTIVE provider silently stops all
        analysis until another is activated — `activeProviderId` comes back empty, and a
        client should say so rather than render the absence quietly.
      parameters: [ { $ref: '#/components/parameters/AIProviderId' } ]
      responses:
        '200':
          description: The full list after the delete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIProvidersResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: AI provider not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/ai-providers/{id}/activate:
    post:
      operationId: activateAIProvider
      tags: [settings]
      summary: Make this the provider every analysis uses.
      description: |
        Requires `org:settings:write`. Takes no request body. Exactly one provider is
        active, so this flips two rows — which is why the full list comes back.
      parameters: [ { $ref: '#/components/parameters/AIProviderId' } ]
      responses:
        '200':
          description: The full list, with `activeProviderId` now this one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIProvidersResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: AI provider not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/ai-providers/{id}/test:
    post:
      operationId: testAIProvider
      tags: [settings]
      summary: Make one real round-trip against this provider, now.
      description: |
        Requires `org:settings:write`. Takes no request body.

        **This spends money** — a real, if tiny, paid request — so there is no honest
        read-only version of it, and it is audited on EVERY call including failures. It is
        only ever invoked by a human pressing the button: nothing calls it on save, on
        activate, on a timer, or on page load.

        The point is to learn the provider is misconfigured before an incident depends on
        it, so a failure passes the specific reason through rather than collapsing into
        "check failed".

        `caveat` is always populated on a pass and must always be shown: the one genuinely
        dangerous outcome of this feature is a green tick read as "analysis will work".
        Nothing about the stored configuration is echoed back — `model` is the model the
        PROVIDER named in its own reply, which is diagnostic, not a reflection of what is
        saved.
      parameters: [ { $ref: '#/components/parameters/AIProviderId' } ]
      responses:
        '200':
          description: The round-trip succeeded. Render `caveat` next to the result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIProviderTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: AI provider not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `https://argus.io/errors/ai-provider-unusable` — the request was well-formed
            and authorized, and the thing it tested does not work. Carries `kind` and
            `latencyMs` as RFC 9457 extension members so a client can branch on the
            failure class structurally instead of matching on the message.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /detection/dry-run:
    post:
      operationId: detectionDryRun
      tags: [settings]
      summary: Replay candidate detection settings against real recorded history.
      description: |
        Requires `org:settings:write` — the capability that gates WRITING detection
        settings, even though this writes nothing: it reveals the same
        operational-policy-shaped information (which detectors are candidates for
        disabling, how aggressive a storm-protection ceiling would be against real
        history), so it gets that capability's existing scope rather than a broader read
        one.

        Pure simulation. No settings row is touched, no finding or incident is written,
        and no live cluster is called: it is Postgres over already-recorded
        `findings`/`incidents` history plus an in-memory replay.

        The request body is the `detection` section of `PUT /admin/settings`, validated by
        the same function — a candidate that PUT would reject gets the identical 400 here
        before a single query runs.

        The replay calls the SAME pure functions the live tunnel path calls for every
        real finding (`gateway.IsDetectorDisabled`, `StormProtectionConfigured`,
        `StormProtectionWindowStart`, `StormProtectionShouldSuppress`) — there is no
        second copy of "is this detector disabled" to drift.

        What it does NOT resimulate is correlation: whether a historical finding bumped an
        already-open incident or faced a genuine open-a-new-incident decision is read off
        what actually happened, because that is unaffected by either control being
        simulated here.
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
          description: |
            How far back to replay. The simulation reads further back than this only to
            warm up the candidate's rolling storm window, so the ceiling is not
            under-counted at the start of the requested window.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DetectionSettingsRequest' }
      responses:
        '200':
          description: |
            Two independent halves: how many of the window's real findings the candidate's
            `disabledDetectorIds` would have dropped before correlation, and what its
            storm-protection ceiling would have done to the new-incident decisions that
            survived that filter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectionDryRunResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # -------------------------------------------------------------- live feed
  /ws/ticket:
    post:
      operationId: createWebSocketTicket
      tags: [auth]
      summary: Mint the short-lived, single-use ticket the live-event socket authenticates with.
      description: |
        Requires `incident:read` OR `cluster:read`. Takes no request body.

        **Why this route exists at all.** Every other route here authenticates with
        `Authorization: Bearer`. A browser's WebSocket API cannot attach a custom header to
        an upgrade request, so the socket is authenticated instead by a ticket minted here,
        on an ordinary authenticated call, and passed as the only query parameter on the
        upgrade that immediately follows. A long-lived credential in a URL was rejected —
        query strings end up in browser history and access logs — which is why this ticket
        is single-use and lives for seconds.

        The ticket grants NOTHING the caller did not already have; it carries their
        identity across the upgrade. Which events then actually reach the socket is decided
        per event, per subscriber, against that subscriber's own capabilities. Holding
        either read capability entitles you to a connection, not to a feed of everything.

        The socket itself (`GET /ws/events`, deliberately outside `/api/v1`) is not
        described here: it is a frame stream, which OpenAPI has no vocabulary for.
      responses:
        '201':
          description: The ticket, and when it stops working. Open the socket immediately.
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresAt]
                properties:
                  ticket: { type: string, description: 'Single-use. A second upgrade with the same ticket is refused.' }
                  expiresAt: { type: string, format: date-time, description: Seconds away. Mint a fresh one per connection attempt rather than caching this. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --------------------------------------------------------------- changes
  /executions/{id}/rollback:
    post:
      operationId: rollbackExecution
      tags: [changes]
      summary: Undo one in-place execution by applying its recorded compensating action.
      description: |
        Requires `remediation:rollback` AND `remediation:execute:inplace`, both re-checked
        against the cluster the execution touched. The second is not redundant: an undo
        writes to a live cluster, so a principal who may approve pull requests but never
        touch a cluster in place must not reach it.

        The undo is the compensating action captured at the ORIGINAL execution from a
        value read off the live object before it was changed — never a fresh proposal.
        It shares the forward path's whole safety apparatus (resolved target, a fresh
        `resourceVersion` precondition, per-action bounds, the GitOps refusal, the signed
        plan and the server-side dry run) and diverges only in bookkeeping: no approval
        decision is recorded, and the incident lands in `Reopened` rather than
        `Validating` where it was `Validating`, and mostly nowhere from any other state.

        An undo does NOT re-diagnose the original problem, which is still there.

        Every refusal below means nothing was changed.

        The whole body is optional — it carries only acknowledgements — but each
        acknowledgement must be sent in answer to the specific refusal that asked for it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The execution id, as `GET /changes` reports it.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RollbackRequest' }
      responses:
        '200':
          description: |
            The cluster accepted the change. An empty `incidentState` means the outcome
            could not be recorded and the recovery sweep will finish it — render the
            absence, never a state of `""`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RollbackResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such execution.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            Six structurally distinct refusals share this status, each with its own
            `type`. Four are about the execution or the incident:
            `.../invalid-state` (the execution did not succeed, or another change is in
            flight on this incident right now), `.../already-rolled-back`,
            `.../nothing-to-undo` (the field is already where the undo would put it —
            usually a GitOps controller's next sync having reverted ARGUS), and
            `.../undo-value-changed` (something else moved the field since; re-send with
            `confirmValueChanged: true` if you have checked and still want the original
            value restored — the acknowledgement is audited).

            The other two are the same guardrail refusals `POST /incidents/{id}/approve`
            makes, for the same reasons: `.../scale-from-zero-refused` and
            `.../gitops-managed-refused`, each carrying `confirmationToken` as an
            extension member to echo back with the matching `confirm*` flag.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `.../no-rollback-recorded` — this action type has no undo (expected for a
            workload restart: the pods it replaced are already gone) — or
            `.../invalid-state` when the stored compensating action does not decode.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: '`.../remediation-execution-failed` — the undo could not be applied.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            `.../cluster-unreachable` — the cluster has no live agent connection, or
            ARGUS could not read the current value and refused to apply an undo blind.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /changes:
    get:
      operationId: listChanges
      tags: [changes]
      summary: Every change ARGUS has made to a cluster recently, across every incident.
      description: |
        Requires `incident:read` AND `analysis:read`. The front door for
        `POST /executions/{id}/rollback`, which was previously reachable only by someone
        who already knew which incident made the change.

        Two kinds of change on one list: an in-place execution (ordered by `executedAt`)
        and a **merged** repository change (ordered by `pr_merged_at`). An open or
        closed-unmerged pull request is a proposal, not a change, and is not listed —
        see `internal/api/changes.go` for why, including the fact that no column records
        when a pull request was opened.
      parameters:
        - name: windowHours
          in: query
          schema: { type: integer, minimum: 1, maximum: 2160, default: 168 }
          description: How far back to look. Defaults to 7 days, capped at 90.
        - name: clusterId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token from `POST /auth/login`, `/auth/refresh`, or the SSO exchange. Sent as `Authorization: Bearer <token>`."
    personalAccessToken:
      type: http
      scheme: bearer
      description: "A personal access token (`argus_pat_…`) from `POST /users/me/mcp-tokens`. Accepted only by `POST /mcp`."

  parameters:
    ClusterId: { name: id, in: path, required: true, schema: { type: string } }
    IncidentId: { name: id, in: path, required: true, schema: { type: string } }
    RepositoryId: { name: id, in: path, required: true, schema: { type: string } }
    TolerationId: { name: id, in: path, required: true, schema: { type: string } }
    UserId: { name: id, in: path, required: true, schema: { type: string } }
    CustomRoleId: { name: id, in: path, required: true, schema: { type: string } }
    ClusterGroupId: { name: id, in: path, required: true, schema: { type: string } }
    IdentityProviderId: { name: id, in: path, required: true, schema: { type: string } }
    AIProviderId: { name: id, in: path, required: true, schema: { type: string } }
    IncidentClusterId: { name: clusterId, in: query, schema: { type: string } }
    IncidentState:
      name: state
      in: query
      schema: { type: string }
      description: One or more comma-separated `IncidentState` values.
    RequiresAction:
      name: requiresAction
      in: query
      schema: { type: boolean }
      description: |
        The incident queue's own definition, not "open": everything nobody owes work on
        right now, in-flight investigation states included.

  responses:
    BadRequest:
      description: Malformed request — bad JSON, an invalid enum value, or a validation failure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, malformed, or expired/revoked bearer token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated, but missing the required capability (or the required capability on this specific resource's scope).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource, or (for a cluster-scoped resource) not visible to this caller's RLS scope — the two are indistinguishable on the wire by design.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RepositoryChangeUnprocessable:
      description: |
        The request is well-formed and ARGUS refused it on the facts. Each refusal carries
        its own `type`, and NOTHING was written in any of them:
        `.../no-repository-target` (no Git source is resolved for this incident's object —
        it is unmanaged, a Helm release whose metadata names a release rather than a
        repository, or its controller has never synced),
        `.../revision-not-pinned` (the controller reports a branch or tag, so nobody can
        say which commit is actually running),
        `.../invalid-state` (the incident names no object),
        `.../repository-unusable` (the repository is not registered with ARGUS, or its
        binding has pull requests disabled),
        `.../file-not-located` (ARGUS could not name a single file for this object, or the
        path is outside the synced directory),
        `.../repository-change-refused` (a forbidden path, or any other refusal from the
        change pipeline),
        `.../change-not-verified` (content ARGUS will not accept as reviewable: empty, over
        the byte bound, or plain YAML that does not parse),
        `.../redacted-value-echoed` (the change would write a redaction marker into a file
        — the real value was withheld from the model at capture time, so a human has to
        supply it),
        `.../no-change` (nothing in the change differs from the repository), or
        `.../not-found` (that file does not exist at the synced commit).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Unexpected server error. `detail` never carries raw internal error text — see `internal/api`'s `writeProblem` convention.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ResourceChange:
      type: object
      required: [id, clusterId, observedAt, kind, name, op, fields]
      properties:
        id: { type: string }
        clusterId: { type: string }
        observedAt: { type: string, format: date-time }
        kind: { type: string }
        apiGroup: { type: string }
        namespace: { type: string }
        name: { type: string }
        ownerKind: { type: string }
        ownerName: { type: string }
        op: { type: string, enum: [add, update, delete] }
        fields:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              oldValue: {}
              newValue: {}
        summary: { type: string }
    ResourceChangeGap:
      type: object
      required: [from, to, reason]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        reason: { type: string }
    ResourceChangeList:
      type: object
      required: [changes, gaps]
      properties:
        changes: { type: array, items: { $ref: '#/components/schemas/ResourceChange' } }
        gaps: { type: array, items: { $ref: '#/components/schemas/ResourceChangeGap' } }
        truncated: { type: boolean }
    TimelineObjectRef:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string }
        apiGroup: { type: string }
        namespace: { type: string }
        name: { type: string }
    TimelineMark:
      type: object
      required: [at, type, summary, id]
      properties:
        at: { type: string, format: date-time, description: 'For a finding, the first report of this run inside the window.' }
        type: { type: string, enum: [change, finding, incident-opened, incident-closed] }
        summary: { type: string }
        severity: { type: string }
        id: { type: string, description: 'Change id, finding fingerprint, or incident id.' }
        object: { $ref: '#/components/schemas/TimelineObjectRef' }
        incidentId: { type: string }
        op: { type: string, enum: [add, update, delete] }
        reason: { type: string }
        detectorId: { type: string }
        until: { type: string, format: date-time, description: 'Finding only: the last report of this run.' }
        reports: { type: integer, description: 'Finding only: reports in this run.' }
        continuesFromBefore: { type: boolean, description: 'Finding only: also reported within findingRunGapSeconds before the window opened.' }
        state: { type: string }
        more: { type: integer, description: 'Earlier events of the same type on this row, within markBucketSeconds before this one, not drawn individually.' }
    TimelineSpan:
      type: object
      required: [incidentId, from, to, severity, state, summary]
      properties:
        incidentId: { type: string }
        from: { type: string, format: date-time }
        to: { type: [string, 'null'], format: date-time, description: 'Null while the incident is open.' }
        endEstimated: { type: boolean, description: 'Closed without a resolved_at; ends at its last_seen.' }
        severity: { type: string }
        state: { type: string }
        summary: { type: string }
        object: { $ref: '#/components/schemas/TimelineObjectRef' }
    TimelineRowCounts:
      type: object
      required: [changes, findingRuns, findingReports, incidents, incidentsOpened, incidentsClosed]
      properties:
        changes: { type: integer }
        findingRuns: { type: integer }
        findingReports: { type: integer }
        incidents: { type: integer }
        incidentsOpened: { type: integer }
        incidentsClosed: { type: integer }
    TimelineRow:
      type: object
      required: [key, kind, name, marks, spans, counts, marksOmitted, spansOmitted, markBucketSeconds, lastActivityAt]
      properties:
        key: { type: string }
        kind: { type: string, description: 'Empty on an objectless row.' }
        apiGroup: { type: string }
        namespace: { type: string }
        name: { type: string, description: 'The object name, or the reason on an objectless row.' }
        objectless: { type: boolean }
        marks: { type: array, items: { $ref: '#/components/schemas/TimelineMark' } }
        spans: { type: array, items: { $ref: '#/components/schemas/TimelineSpan' } }
        counts: { $ref: '#/components/schemas/TimelineRowCounts' }
        marksOmitted: { type: integer, description: 'Events on this row not drawn as their own mark (counted in a mark''s more, or past the cap).' }
        spansOmitted: { type: integer }
        markBucketSeconds: { type: integer, description: 'The stretch a busy row was thinned over; 0 when every event is drawn.' }
        lastActivityAt: { type: [string, 'null'], format: date-time }
    ClusterTimeline:
      type: object
      required: [clusterId, since, until, types, onlyIncidents, rows, gaps, namespaces, totals, truncated, limits, findingRunGapSeconds, restricted]
      properties:
        clusterId: { type: string }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        namespace: { type: string }
        types: { type: array, items: { type: string, enum: [changes, findings, incidents] } }
        onlyIncidents: { type: boolean }
        rows: { type: array, items: { $ref: '#/components/schemas/TimelineRow' } }
        gaps: { type: array, items: { $ref: '#/components/schemas/ResourceChangeGap' } }
        namespaces: { type: array, items: { type: string } }
        totals:
          type: object
          required: [rows, changes, findingRuns, findingReports, incidents, incidentsOpened]
          properties:
            rows: { type: integer }
            changes: { type: integer }
            findingRuns: { type: integer }
            findingReports: { type: integer }
            incidents: { type: integer }
            incidentsOpened: { type: integer, description: 'How many of `incidents` opened inside the window; the rest were already open when it began.' }
        truncated:
          type: object
          required: [rows, changes, findingRuns, incidents]
          properties:
            rows: { type: integer }
            changes: { type: integer }
            findingRuns: { type: integer }
            incidents: { type: integer }
        limits:
          type: object
          required: [maxRows, maxMarksPerRow, maxSpansPerRow]
          properties:
            maxRows: { type: integer }
            maxMarksPerRow: { type: integer }
            maxSpansPerRow: { type: integer }
        findingRunGapSeconds: { type: integer }
        restricted:
          type: array
          items:
            type: object
            required: [source, capability]
            properties:
              source: { type: string, enum: [findings, incidents] }
              capability: { type: string }
    UpgradeScan:
      type: object
      required: [id, clusterId, currentVersion, targetVersion, verdict, reviewedThrough, scannedAt]
      properties:
        id: { type: string }
        clusterId: { type: string }
        currentVersion: { type: string }
        targetVersion: { type: string }
        verdict: { type: string }
        reviewedThrough: { type: string }
        scannedAt: { type: string, format: date-time }
        result: { description: The agent's full scan result. }
    FleetSummary:
      type: object
      required: [intervalSeconds, clusters]
      properties:
        intervalSeconds: { type: integer, description: How often the hub re-reads each connected cluster. }
        clusters:
          type: array
          items: { $ref: '#/components/schemas/FleetClusterSummary' }
    FleetClusterSummary:
      type: object
      required: [clusterId, facts, factsUpdatedAt, checksReadable, checks]
      properties:
        clusterId: { type: string }
        facts:
          nullable: true
          description: The fields of the cluster's last facts report the Overview reads; null before the agent's first inventory sync.
          allOf: [ { $ref: '#/components/schemas/FleetFactsDigest' } ]
        factsUpdatedAt: { type: string, format: date-time, nullable: true }
        checksReadable: { type: boolean, description: False when the caller lacks cluster:inspect on this cluster; checks is then empty. }
        checks:
          type: object
          properties:
            certificates: { $ref: '#/components/schemas/FleetCheckCertificates' }
            posture: { $ref: '#/components/schemas/FleetCheckPosture' }
            helm: { $ref: '#/components/schemas/FleetCheckHelm' }
            gitops: { $ref: '#/components/schemas/FleetCheckGitOps' }
    FleetFactsDigest:
      type: object
      required: [nodes]
      properties:
        kubernetesVersion: { type: string }
        nodeCount: { type: integer }
        reachable: { type: boolean }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeStatus' }
        detectors: { $ref: '#/components/schemas/ClusterDetectors' }
        summary:
          type: object
          properties:
            networkPolicyCoverage:
              type: object
              required: [coveredWorkloads, totalWorkloads]
              properties:
                coveredWorkloads: { type: integer }
                totalWorkloads: { type: integer }
    FleetCheckMeta:
      type: object
      required: [summaryAt, error, errorAt]
      properties:
        summaryAt: { type: string, format: date-time, nullable: true, description: When the summary was read; null when no read has succeeded. }
        error: { type: string, nullable: true, description: "The latest read's failure, when it failed." }
        errorAt: { type: string, format: date-time, nullable: true }
    FleetCheckCertificates:
      allOf:
        - { $ref: '#/components/schemas/FleetCheckMeta' }
        - type: object
          required: [summary]
          properties:
            summary:
              nullable: true
              type: object
              required: [listed, unknown, later, due, dueTotal, truncated]
              properties:
                listed: { type: integer }
                unknown: { type: integer }
                later: { type: integer }
                due:
                  type: array
                  description: The soonest 25 certificates expiring inside 90 days (or expired), soonest first.
                  items:
                    type: object
                    required: [name, namespace, daysLeft]
                    properties:
                      name: { type: string }
                      namespace: { type: string }
                      daysLeft: { type: integer }
                dueTotal: { type: integer }
                truncated: { type: boolean }
    FleetCheckPosture:
      allOf:
        - { $ref: '#/components/schemas/FleetCheckMeta' }
        - type: object
          required: [summary]
          properties:
            summary:
              nullable: true
              type: object
              required: [danger, warning, categories]
              properties:
                danger: { type: integer }
                warning: { type: integer }
                categories:
                  type: object
                  additionalProperties:
                    type: object
                    required: [passing, warning, danger]
                    properties:
                      passing: { type: integer }
                      warning: { type: integer }
                      danger: { type: integer }
    FleetCheckHelm:
      allOf:
        - { $ref: '#/components/schemas/FleetCheckMeta' }
        - type: object
          required: [summary]
          properties:
            summary:
              nullable: true
              type: object
              required: [total, listed, failing, truncated]
              properties:
                total: { type: integer }
                listed: { type: integer }
                failing: { type: integer, description: Failing among the listed releases. }
                truncated: { type: boolean }
    FleetCheckGitOps:
      allOf:
        - { $ref: '#/components/schemas/FleetCheckMeta' }
        - type: object
          required: [summary]
          properties:
            summary:
              nullable: true
              type: object
              required: [total, listed, problems, truncated]
              properties:
                total: { type: integer }
                listed: { type: integer }
                problems: { type: integer, description: Applications with a problem among those listed. }
                truncated: { type: boolean }
    UpgradeScanEnvelope:
      type: object
      required: [scan]
      properties:
        scan:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/UpgradeScan' } ]
    SearchClusterRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    SearchResult:
      type: object
      required: [query, hits, clustersQueried, clustersAnswered, clustersFailed, clustersDisconnected]
      properties:
        query: { type: string }
        hits:
          type: array
          items:
            type: object
            required: [clusterId, clusterName, score, kind, name]
            properties:
              clusterId: { type: string }
              clusterName: { type: string }
              score: { type: integer }
              kind: { type: string }
              apiGroup: { type: string }
              namespace: { type: string }
              name: { type: string }
              matched: { type: array, items: { type: string } }
              status: { type: string }
        truncated: { type: boolean }
        clustersQueried: { type: integer }
        clustersAnswered: { type: integer }
        clustersFailed: { type: array, items: { $ref: '#/components/schemas/SearchClusterRef' } }
        clustersDisconnected: { type: array, items: { $ref: '#/components/schemas/SearchClusterRef' } }
    IncidentMetrics:
      type: object
      required: [available, start, end, step, openedAt, panels, receivedAt]
      properties:
        available: { type: boolean }
        reason: { type: string }
        workload: { type: string }
        scope: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        step: { type: string }
        openedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        panels:
          type: array
          items: { $ref: '#/components/schemas/MetricPanel' }
    MetricPanel:
      type: object
      required: [id, title, unit, series]
      properties:
        id: { type: string }
        title: { type: string }
        unit: { type: string }
        error: { type: string }
        note: { type: string, description: "Why an empty panel is empty, when the cause is known." }
        series:
          type: array
          items:
            type: object
            required: [labels, points]
            properties:
              labels: { type: object, additionalProperties: { type: string } }
              points: { type: array, items: { type: array, items: { type: number } } }
    WorkloadMetrics:
      type: object
      required: [available, start, end, step, panels, receivedAt]
      properties:
        available: { type: boolean }
        reason: { type: string }
        workload: { type: string }
        scope: { type: string, description: "Which pods the series cover, in words." }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        step: { type: string }
        receivedAt: { type: string, format: date-time }
        panels:
          type: array
          items: { $ref: '#/components/schemas/MetricPanel' }
    InspectResult:
      type: object
      required: [tool, receivedAt, result]
      properties:
        tool: { type: string }
        receivedAt: { type: string, format: date-time, description: When the hub received the agent's answer. }
        result: { description: The tool's own JSON result. }
    # The `result` of three inspect tools, documented so the
    # cluster page's Helm, GitOps and Map tabs are typed against the agent's shape
    # (internal/agent/tools_inventory.go). Every result also carries `observedAt`
    # and, when the agent's cache lacked a kind, `coverage`.
    InspectCoverage:
      type: array
      items:
        type: object
        required: [kind, state]
        properties:
          group: { type: string }
          kind: { type: string }
          state: { type: string, description: 'synced | syncing | forbidden | absent | disabled | error' }
          reason: { type: string }
    InventoryObjectRef:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string }
        apiGroup: { type: string }
        namespace: { type: string }
        name: { type: string }
    HelmReleaseList:
      type: object
      description: |
        `list_helm_releases {namespace?}`. Releases are found from the `meta.helm.sh/release-*`
        annotations on cached objects; revision/status/updated come from the newest release
        Secret's LABELS via named gets (D-R12) — never its payload, so chart version, values
        and manifests are absent by design. At most 200 releases (`truncated`, `total`).
      required: [observedAt, releases, total, note]
      properties:
        observedAt: { type: string, format: date-time }
        coverage: { $ref: '#/components/schemas/InspectCoverage' }
        truncated: { type: boolean }
        total: { type: integer, description: 'Distinct releases found before the cap.' }
        note: { type: string }
        releases:
          type: array
          items:
            type: object
            required: [name, namespace, objects, graded]
            properties:
              name: { type: string }
              namespace: { type: string }
              revision: { type: integer }
              revisionLowerBound: { type: boolean, description: 'The get budget ran out; the newest revision is at least this.' }
              status: { type: string, description: "Helm's own word: deployed, failed, pending-upgrade, superseded, …" }
              updated: { type: string, format: date-time, description: 'The latest of createdAt and modifiedAt.' }
              createdAt: { type: string, format: date-time, description: "The newest release record's metadata.creationTimestamp — when that revision was made." }
              modifiedAt: { type: string, format: date-time, description: "Helm's modifiedAt label, verbatim. Helm rewrites it on old revisions when superseding them, so it is not when a revision was made." }
              statusUnavailable: { type: string, description: 'Why revision/status are absent.' }
              lastOperation: { type: object, additionalProperties: true, description: 'helmstatus.Operation when the newest revision failed or is stuck pending.' }
              objects: { type: integer }
              objectKinds:
                type: array
                items: { type: object, required: [kind, count], properties: { kind: { type: string }, count: { type: integer } } }
              graded: { type: integer, description: 'Objects whose health ARGUS grades (workloads, PVCs).' }
              healthCounts: { type: object, additionalProperties: { type: integer } }
              health: { type: string, description: 'Worst graded level; absent when nothing was graded.' }
              problems:
                type: array
                items:
                  allOf:
                    - { $ref: '#/components/schemas/InventoryObjectRef' }
                    - { type: object, required: [health], properties: { health: { type: string }, reason: { type: string } } }
              mainObject: { $ref: '#/components/schemas/InventoryObjectRef' }
              members:
                type: array
                description: The objects carrying this release's annotations, worst health first; at most 50 (`membersTruncated`). `objects` stays the true count.
                items:
                  allOf:
                    - { $ref: '#/components/schemas/InventoryObjectRef' }
                    - { type: object, properties: { health: { type: string } } }
              membersTruncated: { type: boolean }
    GitOpsAppList:
      type: object
      description: |
        `list_gitops_apps {namespace?}` — Argo CD Applications and Flux Kustomizations /
        HelmReleases from the agent's cache. A `namespace` matches the object's own namespace or
        its destination. `kinds` says which of the three kinds the agent can see; an absent
        kind is a coverage fact, not an error. Problems sort first; at most 300 apps.
      required: [observedAt, apps, counts, kinds]
      properties:
        observedAt: { type: string, format: date-time }
        coverage: { $ref: '#/components/schemas/InspectCoverage' }
        truncated: { type: boolean }
        kinds: { $ref: '#/components/schemas/InspectCoverage' }
        counts:
          type: object
          required: [total, outOfSync, syncUnknown, degraded, suspended, reconciling]
          properties:
            total: { type: integer }
            outOfSync: { type: integer }
            syncUnknown: { type: integer }
            degraded: { type: integer }
            suspended: { type: integer }
            reconciling: { type: integer }
        apps:
          type: array
          items:
            type: object
            required: [tool, kind, apiGroup, namespace, name, managed]
            properties:
              tool: { type: string, description: 'argocd | flux' }
              kind: { type: string }
              apiGroup: { type: string }
              namespace: { type: string }
              name: { type: string }
              sync: { type: string }
              health: { type: string }
              repoURL: { type: string }
              path: { type: string }
              chart: { type: string }
              sourceRef: { type: string }
              sourceCount: { type: integer }
              targetRevision: { type: string }
              revision: { type: string }
              destinationServer: { type: string }
              destinationNamespace: { type: string }
              lastSync: { type: string }
              autoSync: { type: string }
              suspended: { type: boolean }
              reconciling: { type: boolean }
              terminating: { type: boolean }
              managed: { type: integer }
              headline: { type: string, description: 'Plain-language reason this app needs attention (gitopsinsight.HeadlineFor).' }
              causes: { type: array, items: { type: string } }
              stuck: { type: boolean }
              problem: { type: boolean }
    NamespaceTopology:
      type: object
      description: |
        `get_namespace_topology {namespace?, cap?}`. With a namespace: that namespace's
        relationship graph (the get_neighborhood node/edge shape), replica pods collapsed to
        PodGroups and cluster Nodes left out (counted in `clusterNodes`), capped at `cap` nodes
        (default 150, max 300) and 600 edges with `omittedNodes`/`omittedByKind`/`omittedEdges`.
        Without one: `namespaces`, the picker index, largest first.
      required: [observedAt]
      properties:
        observedAt: { type: string, format: date-time }
        coverage: { $ref: '#/components/schemas/InspectCoverage' }
        namespace: { type: string }
        nodes: { type: array, items: { type: object, additionalProperties: true } }
        edges: { type: array, items: { type: object, additionalProperties: true } }
        totalNodes: { type: integer }
        omittedNodes: { type: integer }
        omittedByKind: { type: object, additionalProperties: { type: integer } }
        omittedEdges: { type: integer }
        truncated: { type: boolean }
        clusterNodes: { type: integer }
        unavailable: { type: array, items: { type: string } }
        namespaces:
          type: array
          items:
            type: object
            required: [name, pods, workloads, services, notHealthy]
            properties:
              name: { type: string }
              pods: { type: integer }
              workloads: { type: integer, description: 'What the namespace map draws a card for: Deployments, StatefulSets, DaemonSets, CronJobs, and Jobs no CronJob owns.' }
              services: { type: integer }
              notHealthy: { type: integer, description: 'podsNotHealthy + workloadsNotHealthy.' }
              podsNotHealthy: { type: integer, description: 'Absent from agents that predate the split.' }
              workloadsNotHealthy: { type: integer, description: 'Absent from agents that predate the split.' }
        namespacesTruncated: { type: boolean }
    # ---------------------------------------------------------- shared
    NetworkPolicyMap:
      type: object
      description: |
        `get_network_policy_map {namespace?}`, the cluster page's Network policy tab
        (`internal/agent/netpolmap`). With a namespace: each workload with running pods, whether
        some policy isolates its ingress and egress, and what its policies admit, every selector
        resolved to the workloads, namespaces or node addresses it matches now (`none` when it
        matches nothing). A workload peer on a numeric port carries `effective`: the whole path
        judged from both ends (`blocked` when the other end refuses it). `findings` are the
        recommendations. Without a namespace: `namespaces`, the picker index, most warnings
        first. Fails when Pods, Namespaces or NetworkPolicies are not readable.
      required: [observedAt, note]
      properties:
        observedAt: { type: string, format: date-time }
        coverage: { $ref: '#/components/schemas/InspectCoverage' }
        note: { type: string }
        namespace: { type: string }
        workloadsTruncated: { type: boolean }
        workloads:
          type: array
          items:
            type: object
            required: [kind, name, pods, ingressIsolated, egressIsolated, policies, ingress, egress]
            properties:
              kind: { type: string }
              name: { type: string }
              pods: { type: integer }
              hostNetwork: { type: boolean, description: 'Pods on the node network: no NetworkPolicy applies; ingress and egress are empty.' }
              ingressIsolated: { type: boolean }
              egressIsolated: { type: boolean }
              policies: { type: array, items: { type: string } }
              ingress: { type: array, items: { $ref: '#/components/schemas/NetworkPolicyAllow' } }
              egress: { type: array, items: { $ref: '#/components/schemas/NetworkPolicyAllow' } }
              ingressTruncated: { type: boolean }
              egressTruncated: { type: boolean }
        policies:
          type: array
          items:
            type: object
            required: [name, types, workloads]
            properties:
              name: { type: string }
              types: { type: array, items: { type: string } }
              workloads: { type: array, items: { type: string } }
        findings:
          type: array
          items:
            type: object
            required: [code, severity, title, fix, objects]
            properties:
              code: { type: string }
              severity: { type: string, enum: [warning, review] }
              title: { type: string }
              fix: { type: string }
              objects: { type: array, items: { type: string } }
              more: { type: integer }
        namespaces:
          type: array
          items:
            type: object
            required: [name, workloads, policies, open, warnings, reviews]
            properties:
              name: { type: string }
              workloads: { type: integer }
              policies: { type: integer }
              open: { type: integer }
              warnings: { type: integer }
              reviews: { type: integer }
    NetworkPolicyAllow:
      type: object
      required: [peer, ports]
      properties:
        peer:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [workload, namespace, cidr, anywhere, none] }
            kind: { type: string }
            namespace: { type: string }
            name: { type: string }
            cidr: { type: string }
            except: { type: array, items: { type: string } }
            nodes: { type: array, items: { type: string } }
            selector: { type: string }
            matched: { type: integer, description: 'For a workload peer: how many workloads the selector matched.' }
        ports: { type: array, items: { type: string } }
        policies: { type: array, items: { type: string } }
        effective: { type: string, enum: [allowed, blocked, unknown] }
        blockedBy: { type: array, items: { type: string } }
    Problem:
      type: object
      description: |
        RFC 9457 problem+json. `type` is the one field a client may branch on structurally
        — `title`/`detail` are human-facing prose that gets reworded with no type error to
        catch a client that matched on it instead.
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri, description: 'A stable `https://argus.io/errors/...` URI.' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        confirmationToken:
          type: string
          description: |
            RFC 9457 extension member, present only on a remediation guardrail refusal
            (`internal/authz.GuardrailConfirmationIssuer`). Echo it back on the confirmed
            retry — the boolean alone no longer proves the refusal was shown; only this
            token does.
        requestId:
          type: string
          description: |
            RFC 9457 extension member carrying this request's correlation id (`req_01j...`),
            the same value returned in the `X-Request-Id` response header on every response,
            error or not. Quote it in a support request: it is the one string that pins this
            exact request in the hub's structured logs, and — for an investigation — it is
            also stamped on the `analyses` row the request produced.

            A caller may supply its own id in the `X-Request-Id` request header and have it
            adopted, provided it is at most 64 characters of `[A-Za-z0-9_-]`; anything else is
            ignored and a fresh id minted, so an id echoed back is always safe to log.

            Absent only on a response produced before the hub could set it at all.

    # ---------------------------------------------------------- auth
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [accessToken, expiresIn, mustChangePassword]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer }
        mustChangePassword: { type: boolean }

    SSOProvider:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }

    SSOProvidersResponse:
      type: object
      required: [providers, localLoginAvailable]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/SSOProvider' }
        localLoginAvailable:
          type: boolean
          description: Always true today — break-glass local login survives SSO being enabled, so an identity-provider outage cannot lock everyone out.
        loginStyle:
          type: string
          description: Optional on the wire — an older hub build omits it; treat any unrecognised value as the default.
        version: { type: string }

    MeResponse:
      type: object
      required: [userId, email, authMethod, primaryColorId, overviewDefaultWindowDays, minPasswordLength, sessionIdleTimeoutMinutes]
      properties:
        userId: { type: string }
        email: { type: string }
        authMethod:
          type: string
          enum: [password, federated]
          description: 'A federated account has no ARGUS password at all — the change-password control must be disabled for it, with this reason named, never left looking available and failing.'
        primaryColorId:
          type: string
          description: |
            The org-wide primary-colour preset (Settings > Appearance), rendered for every
            authenticated user regardless of capability — see AppearanceSettings for the admin-facing
            twin of this field.
        overviewDefaultWindowDays:
          type: integer
          enum: [14, 30]
          description: OverviewPage's "incidents opened" window on first load.
        minPasswordLength:
          type: integer
          description: The floor PUT /users/me/password enforces on a self-chosen new password.
        sessionIdleTimeoutMinutes:
          type: [integer, 'null']
          description: Null means no idle limit — a refresh token good for its full lifetime regardless of activity.

    GrantScope:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [Cluster, ClusterGroup, AllClusters] }
        clusterId: { type: string }
        clusterGroupId: { type: string }

    EffectiveGrant:
      type: object
      required: [capability, scope]
      properties:
        capability: { type: string }
        scope: { $ref: '#/components/schemas/GrantScope' }

    EffectivePermissionsResponse:
      type: object
      required: [userId, computedAt, grants]
      properties:
        userId: { type: string }
        computedAt: { type: string, format: date-time }
        grants:
          type: array
          items: { $ref: '#/components/schemas/EffectiveGrant' }

    RolesResponse:
      type: object
      required: [roles]
      properties:
        roles:
          type: object
          description: Keyed by builtin role id (super-admin, tenant-admin, resolver, pr-approver, viewer).
          additionalProperties:
            type: object
            required: [capabilities]
            properties:
              capabilities: { type: array, items: { type: string } }

    # ------------------------------------------------------- clusters
    ClusterState:
      type: string
      enum: [PendingApproval, Provisioning, Active, Degraded, Disconnected, IncompatibleVersion, Rejected, Archived]

    AgentCompatibilityVerdict:
      type: string
      enum: [unknown, current, upgrade_recommended, upgrade_required]
      description: |
        Comes straight off the wire — never re-derived client-side by comparing
        `agentVersion` to a policy, which is exactly the "two policies drift" failure this
        field exists to avoid.

    AgentCompatibilityFeatureGap:
      type: object
      required: [name, minVersion, description, wireContract]
      properties:
        name: { type: string }
        minVersion: { type: string }
        description: { type: string }
        wireContract:
          type: string
          description: How an agent below minVersion presents on the wire (e.g. "omits the field") — what tells a reader an absence must never be read as a denial.

    AgentUpgradeGuidance:
      type: object
      required: [command]
      properties:
        command: { type: string }
        releaseContextKnown:
          type: boolean
          description: 'False for every cluster today, in which case `command` carries placeholders and `note` explains why, rather than a guessed release name that could target the wrong release.'
        note: { type: string }

    AgentCompatibility:
      type: object
      required: [verdict, label, agentVersion, minSupportedVersion, recommendedVersion, reason]
      description: |
        The one verdict object both `GET /clusters` and `GET /clusters/{id}` attach to
        every cluster, from the identical server-side evaluation.
      properties:
        verdict: { $ref: '#/components/schemas/AgentCompatibilityVerdict' }
        label: { type: string }
        agentVersion: { type: [string, 'null'] }
        minSupportedVersion: { type: string }
        recommendedVersion: { type: string }
        reason: { type: string }
        missingFeatures:
          type: array
          items: { $ref: '#/components/schemas/AgentCompatibilityFeatureGap' }
          description: Present only for upgrade_recommended/upgrade_required — an "unknown" verdict carries neither.
        upgrade: { $ref: '#/components/schemas/AgentUpgradeGuidance' }

    Cluster:
      type: object
      required: [id, displayName, state, agentVersion, lastHeartbeatAt, createdAt, archivedAt, compatibility]
      properties:
        id: { type: string }
        displayName: { type: string }
        state: { $ref: '#/components/schemas/ClusterState' }
        agentVersion: { type: [string, 'null'] }
        lastHeartbeatAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Non-null exactly when the cluster has been decommissioned — set in the same
            UPDATE as `state: Archived`, so the two cannot disagree. A retirement is a
            server-stated fact with a date; a client must not re-derive it from `state`.
        compatibility: { $ref: '#/components/schemas/AgentCompatibility' }

    ClustersResponse:
      type: object
      required: [clusters]
      properties:
        clusters: { type: array, items: { $ref: '#/components/schemas/Cluster' } }

    NodeStatus:
      type: object
      required: [name, ready]
      properties:
        name: { type: string }
        ready: { type: boolean }
        cpuAllocatable: { type: string }
        memoryAllocatable: { type: string }
        cpuUsed:
          type: string
          description: Present only when metrics-server is installed on that cluster. Absent (not zero) otherwise — render as "not available", never as 0.
        memoryUsed: { type: string }

    ClusterDetectors:
      type: object
      description: |
        Absent entirely on an agent that predates this field — the same nil-means-unknown
        convention every optional ClusterFacts field uses. An agent that DOES report this
        always reports all three; there is no partial shape.
      properties:
        warningEvents: { $ref: '#/components/schemas/DetectorStatus' }
        podConditions: { $ref: '#/components/schemas/DetectorStatus' }
        sweep: { $ref: '#/components/schemas/DetectorStatus' }

    DetectorStatus:
      type: object
      description: |
        The all-absent zero value is NOT a claim that this detector is failing — it means
        "this agent has not completed a run of it yet". `error`/`errorAt` are NOT cleared
        by a later success; compare `errorAt` against `lastSuccessAt` to tell which was
        more recent. `deniedReads` absent/empty means either "nothing is denied" or "this
        check was not available yet" — indistinguishable on the wire, and must never be
        read as a clean bill of health on its own.
      properties:
        lastSuccessAt:
          type: string
          format: date-time
          description: >-
            The last run that completed with no FAILING check. For the sweep detector a pass
            in which a check TIMED OUT still advances this and names that check in
            `timedOutChecks` — the two are separate facts. Absent means "never observed",
            never "failing".
        error: { type: string }
        errorAt: { type: string, format: date-time }
        timedOutChecks:
          type: array
          items: { type: string }
          description: >-
            Checks that did not answer within the per-check timeout during this detector's
            MOST RECENT pass. The only field here that describes one pass rather than
            history — a clean pass clears it, unlike `error`/`errorAt`, which are never
            cleared. Absent means either "the last pass was complete" or "this agent
            predates the field"; an agent of any build also records the same fact in
            `error` behind the stable prefix `sweep checker timeout: `.
        deniedReads: { type: array, items: { type: string } }

    ClusterRemediation:
      type: object
      required: [checked, canPatchDeployments, canPatchStatefulSets, canDeletePods]
      description: |
        `checked=false` means the question could not be asked — NOT "not allowed". The
        three cluster-scoped booleans answer only the fleet-wide question; a namespace-
        scoped grant correctly answers false to them. `namespaces` is where that gets
        corrected: absent or empty means "no per-namespace breakdown available" (an old
        agent, or one that found no namespace-scoped Role for its own identity) — those
        two cases are indistinguishable on the wire BY DESIGN, and an absent/empty
        `namespaces` must never be read as "this agent may change nothing anywhere"; the
        three fleet-wide fields above remain the fallback answer regardless.
      properties:
        checked: { type: boolean }
        canPatchDeployments: { type: boolean }
        canPatchStatefulSets: { type: boolean }
        canDeletePods: { type: boolean }
        error: { type: string }
        reporter:
          type: string
          enum: [remediate]
          description: '`remediate` when the separately deployed remediation identity answered for itself. Absent means the investigation agent answered for its own identity, which is read-only on a split install.'
        namespaces:
          type: array
          items: { $ref: '#/components/schemas/NamespaceRemediation' }
        namespacesTruncated:
          type: boolean
          description: True when more namespace-scoped Roles existed than the agent checked in one pass — `namespaces` is then a prefix, not the complete set.

    NamespaceRemediation:
      type: object
      required: [namespace, canPatchDeployments, canPatchStatefulSets, canDeletePods]
      description: Every entry here was actually checked — a present entry with every field false is a genuine, checked "no", never an unknown (contrast ClusterRemediation.namespaces' absent-is-unknown rule).
      properties:
        namespace: { type: string }
        canPatchDeployments: { type: boolean }
        canPatchStatefulSets: { type: boolean }
        canDeletePods: { type: boolean }

    FindingQueueStatus:
      type: object
      required: [pending, dropped, capacity]
      description: |
        One agent's finding-queue occupancy, as that agent reports it on its heartbeat. The
        agent holds detected findings here until the hub acks each one, coalescing repeats of
        the same fingerprint, and discards the oldest once `capacity` distinct findings are
        pending. Counters about ARGUS's own plumbing only — no object identity, namespace or
        message crosses the tunnel for this; the agent's own log is what names a discarded
        object.
      properties:
        pending:
          type: integer
          description: Distinct findings waiting to be sent or acked right now. A depth that stays near `capacity` is the early warning that `dropped` is about to climb.
        dropped:
          type: integer
          description: >-
            Running total of findings discarded at the capacity bound since the AGENT PROCESS
            started. Monotonic within one agent lifetime and reset to 0 by a restart — a
            decrease is a restart, not a recovery.
        capacity:
          type: integer
          description: The bound `dropped` is counted against, reported by the agent rather than assumed, so a depth stays readable as a fraction of the real bound across agent builds.

    ClusterDetection:
      type: object
      description: Every field is omitempty and absent from an agent predating it — a zero value must be read as "not reported", not as zero seconds.
      properties:
        sweepIntervalSeconds: { type: integer }
        sustainedThresholdSeconds: { type: integer }
        resendCooldownSeconds: { type: integer }

    ClusterFacts:
      type: object
      required: [nodeCount, nodes, reachable]
      description: '`kubernetesVersion` is omitted by the agent when unreachable; `nodeCount`/`reachable`/`nodes` are always present (`nodes` is `[]`, not omitted, whenever the agent has nothing to report).'
      properties:
        kubernetesVersion: { type: string }
        nodeCount: { type: integer }
        nodes: { type: array, items: { $ref: '#/components/schemas/NodeStatus' } }
        reachable: { type: boolean }
        detection: { $ref: '#/components/schemas/ClusterDetection' }
        remediation: { $ref: '#/components/schemas/ClusterRemediation' }
        detectors: { $ref: '#/components/schemas/ClusterDetectors' }
        metrics: { $ref: '#/components/schemas/ClusterMetrics' }
        agent:
          type: object
          description: The agent's own image and whether its chart lets the hub upgrade it (from the chart, not an RBAC check).
          required: [selfUpgrade]
          properties:
            image: { type: string }
            namespace: { type: string }
            selfUpgrade: { type: boolean }
            kubecost: { type: boolean, description: 'The chart names a Kubecost API as the cost source.' }

    ClusterMetrics:
      type: object
      required: [checked, allowed]
      description: >-
        Whether this agent can query a Prometheus-compatible endpoint through the API server's
        Service proxy (metrics.prometheusService on the agent chart). `checked` false is unknown,
        not denied. `suggested` is a Service the agent found when none is configured; it is never
        applied automatically.
      properties:
        checked: { type: boolean }
        allowed: { type: boolean }
        error: { type: string }
        external: { type: boolean, description: 'Queries go to metrics.external (a URL outside the cluster), not a Service through the proxy.' }
        scopedByLabel: { type: boolean, description: 'The extra_label sent with every query was observed to be enforced by the endpoint.' }
        labelIgnored: { type: boolean, description: 'An extra_label is configured, but the endpoint returned series outside it (plain Prometheus and Thanos ignore it).' }
        suggested:
          type: object
          required: [namespace, name, port]
          properties:
            namespace: { type: string }
            name: { type: string }
            port: { type: integer }
            flavour: { type: string, enum: [prometheus, thanos, victoriametrics] }

    ClusterDetail:
      allOf:
        - { $ref: '#/components/schemas/Cluster' }
        - type: object
          required: [facts, factsUpdatedAt]
          properties:
            facts:
              oneOf:
                - { $ref: '#/components/schemas/ClusterFacts' }
                - type: 'null'
              description: Null when the agent has not completed its first inventory sync.
            findingQueue:
              oneOf:
                - { $ref: '#/components/schemas/FindingQueueStatus' }
                - type: 'null'
              description: >-
                What this cluster's agent last reported about its own finding queue, as of
                `lastHeartbeatAt`. Null when the agent does not report it (a build older than
                the field, or a cluster that has not heartbeated since) — that is "we do not
                know", NOT "nothing has been dropped", and must not be rendered as a zero.
            hubAgentImage:
              type: [string, 'null']
              description: The agent image this hub was released with; null when it was not configured.
            factsUpdatedAt:
              type: [string, 'null']
              format: date-time
              description: >-
                When the hub last received `facts`, on the hub's clock. Everything in `facts` is an
                absolute-state snapshot that carries no evidence of its own age, so this is what
                distinguishes a current reading from one recorded long ago and never revisited. A
                connected agent re-sends its facts periodically, so on a healthy cluster this is
                minutes old. Null whenever `facts` is null.

    TtlClass:
      type: string
      enum: [A, B, C, F]
      description: >-
        A: 15 minutes, one use. B: one hour, one use (the UI's enroll command). C: 24 hours,
        a batch. F: a fleet token, shared by a GitOps rollout, revocable.

    FleetToken:
      type: object
      required: [id, name, issuedBy, issuedAt, expiresAt, redemptions, maxRedemptions, autoAccept]
      properties:
        id: { type: string }
        name: { type: string }
        issuedBy: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        redemptions: { type: integer }
        maxRedemptions: { type: integer }
        autoAccept: { type: boolean, description: Clusters enrolling with it are accepted on the issuer's behalf. }
        revokedAt: { type: string, format: date-time }

    CreateEnrollmentTokenRequest:
      type: object
      required: [ttlClass]
      properties:
        ttlClass: { $ref: '#/components/schemas/TtlClass' }
        maxRedemptions:
          type: integer
          description: Only meaningful (>1) for ttlClass "C" and "F" (1 to 10000, default 1000 for "F").
        name:
          type: string
          description: ttlClass "F" only, required — what this fleet token is for.
        expiresInDays:
          type: integer
          description: ttlClass "F" only — 1 to 365, default 90.
        autoAccept:
          type: boolean
          description: >-
            ttlClass "F" only — accept every cluster that enrolls with it, on the issuer's behalf.
            Needs `cluster:accept` as well as `cluster:onboard`.
        scopeHint:
          type: object
          additionalProperties: { type: string }
          description: Advisory display-name pattern/labels — string values, not arbitrary JSON.

    CreateEnrollmentTokenResponse:
      type: object
      required: [token, expiresAt, agentInstall]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        tokenId: { type: string, description: "A fleet token's id, for listing and revoking it." }
        agentInstall:
          type: object
          description: >-
            What a `helm install` of the agent needs, from the hub's own deployment. A field the hub
            was not given is null, so a client prints a placeholder rather than guessing.
          required: [chartRef, chartVersion, hubApiUrl]
          properties:
            chartRef: { type: string, description: "Where the agent chart is pulled from, e.g. an oci:// reference." }
            chartVersion: { type: string, nullable: true, description: The agent chart released with this hub. }
            hubApiUrl: { type: string, nullable: true, description: The address agents use to reach this hub's API. }

    EnrollRequest:
      type: object
      required: [token, csrPem, clusterFingerprint]
      description: Agent-facing body for `POST /clusters/enroll` — not modeled in `web/src/api/types.ts` since the web UI never calls this route.
      properties:
        token: { type: string }
        csrPem: { type: string }
        clusterFingerprint: { type: string }
        displayName:
          type: string
          description: 'Falls back to "cluster-<short fingerprint>" if omitted.'

    EnrollResponse:
      type: object
      required: [clusterId, status, pollToken]
      properties:
        clusterId: { type: string }
        status: { type: string, const: pendingApproval }
        pollToken:
          type: string
          description: Returned once; only its hash is stored.

    EnrollStatusResponse:
      type: object
      required: [status]
      description: |
        `certPem`/`caPem`/`hubEndpoint`/`planSigningKey` are present only once `status`
        is "issued". `planSigningKey` is this cluster's OWN derived remediation-plan
        signing key — never the hub's root key — and can be silently absent even when
        issued if HKDF derivation errored (logged, not surfaced as a request error).
      properties:
        status: { type: string, enum: [pendingApproval, rejected, issued] }
        certPem: { type: string }
        caPem: { type: string }
        hubEndpoint: { type: string }
        planSigningKey: { type: string, description: base64-standard. }

    # ------------------------------------------------------- incidents
    IncidentSeverity: { type: string, enum: [low, medium, high, critical] }

    IncidentState:
      type: string
      description: Mirrors the incidents state-machine CHECK constraint (`lld/08-remediation-contracts.md`).
      enum:
        - Detected
        - Investigating
        - RecommendationReady
        - NeedsHumanInvestigation
        - AwaitingApproval
        - Executing
        - AwaitingMerge
        - Validating
        - Resolved
        - Failed
        - Reopened
        - Dismissed
        - Diagnosed
        - ExecutionUnknown
        - ValidationUnknown
        - PlanRejected
        - Expired

    IncidentSortKey: { type: string, enum: [failure, cluster, severity, state, occurrences, lastSeen, importance] }
    IncidentSortDirection: { type: string, enum: [asc, desc] }

    Finding:
      type: object
      required: [id, detectorId, gvk, namespace, objectName, reason, message, severity, occurrenceCount, occurredAt]
      description: reason/message are Kubernetes-event-derived text — untrusted; render through plain text interpolation only, never as HTML.
      properties:
        id: { type: string }
        detectorId: { type: string }
        gvk: { type: string }
        namespace: { type: string }
        objectName: { type: string }
        reason: { type: string }
        message: { type: string }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        occurrenceCount: { type: integer }
        occurredAt: { type: string, format: date-time }

    FindingReasonGroup:
      type: object
      required: [reason, count, firstSeen, lastSeen]
      description: One reason's WHOLE-HISTORY totals, computed over every finding stored for that reason — never derive a count from the bounded `findings` array, which carries only the newest few per reason.
      properties:
        reason: { type: string }
        count: { type: integer }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }

    # ---------------------------------------------------------- findings
    FindingClass: { type: string, enum: [fault, risk, anomaly] }
    FindingConfidence: { type: string, enum: [verified, inferred, unverified] }
    FindingImpact: { type: string, enum: [unavailable, degraded, potential, none] }

    FindingDisposition:
      type: string
      enum: [correlated, retained_unpromoted, suppressed]
      description: |
        What ARGUS did with this observation. DERIVED from the row (there is no
        disposition column — one would be a second, lagging copy of what the evidence
        columns and `incident_id` already determine), and derived against TODAY's
        boundary, so a row's disposition moves when the boundary moves. That is
        deliberate: the question is "would ARGUS raise this", present tense.

        - `correlated` — it reached correlation and is part of an incident. `incidentId`
          is present exactly when this is the value; the two are the same fact.
        - `retained_unpromoted` — the promotion boundary kept it as an observation.
          `promotion.unmet` names which criteria it missed. Spelled the same as the
          `argus_findings_processed_total` label, so a Prometheus graph and this list use
          one word for one thing.
        - `suppressed` — it CLEARED the boundary and still has no incident, which exactly
          two things cause: a toleration, or storm protection. Nothing durable records
          which, so this does not guess — both write an audit event
          (`finding_suppressed_by_toleration` / `storm_protection_suppressed_new_incident`)
          naming the toleration id or the storm window, and that is where the answer is.

    FindingPromotionCriterion:
      type: object
      required: [dimension, accepted, statement]
      description: One dimension of the promotion boundary. `accepted` is derived from the live gate, and `statement` is generated from `accepted`, so the prose cannot contradict the values.
      properties:
        dimension: { type: string, enum: [class, confidence, impact] }
        accepted: { type: array, items: { type: string } }
        statement: { type: string }

    FindingPromotionRule:
      type: object
      required: [summary, criteria, notRecorded, source]
      description: |
        The evidence boundary itself, carried in every response rather than living only in
        a comment. A list of things that were not raised is a list of unexplained
        decisions without it.
      properties:
        summary: { type: string }
        criteria: { type: array, items: { $ref: '#/components/schemas/FindingPromotionCriterion' } }
        notRecorded:
          type: string
          description: |
            The honesty clause. Findings dropped before storage — a disabled detector, a
            disabled rule, or a condition the polarity gate resolved as healthy — are
            written to no table and can appear at no filter setting. Render it; a surface
            that silently overstates its own coverage is worse than none.
        source: { type: string, description: 'Where the rule is enforced, so a reader can go and check it.' }

    FindingPromotionVerdict:
      type: object
      required: [promotable, class, confidence, impact]
      description: |
        Why this finding is where it is. `class`/`confidence`/`impact` here are the
        EFFECTIVE tuple the boundary judged, which differs from the row's own stored
        values only when `evidenceCorrected` is true.
      properties:
        promotable: { type: boolean, description: 'Whether today''s boundary would open an incident for this evidence. True on a `suppressed` row — that is what makes it suppressed rather than retained.' }
        class: { $ref: '#/components/schemas/FindingClass' }
        confidence: { $ref: '#/components/schemas/FindingConfidence' }
        impact: { $ref: '#/components/schemas/FindingImpact' }
        evidenceCorrected:
          type: boolean
          description: |
            Absent (not false) in the ordinary case. Present when the STORED tuple was
            migration 000092's column defaults on a legacy generic mechanism and was
            therefore read as `(anomaly, unverified, none)` — a correction that predates
            this endpoint. Without it, a row stored as `fault/verified/degraded` and
            reported as not promotable reads as a bug rather than as the correction it is.
        unmet:
          type: array
          items: { type: string, enum: [class, confidence, impact] }
          description: Absent when promotable. Otherwise the criteria this finding fails, in class/confidence/impact order — the row-level "why did this stay a finding" answer.

    FindingSuppressionReason:
      type: string
      enum: [toleration, storm_protection]
      description: |
        The one of two things that can leave a promotable finding (cleared the boundary,
        still no incident) suppressed — an operator-created toleration, or storm
        protection's new-incident ceiling. The findings.suppression_reason column's entire
        closed vocabulary (migration 000124); see `FindingListItem.suppressionReason`.

    FindingListItem:
      type: object
      required: [id, clusterId, clusterDisplayName, detectorId, gvk, reason, message, severity, occurrenceCount, occurredAt, fingerprint, class, confidence, impact, disposition, promotion]
      description: |
        One finding on the fleet-wide list. Richer than the `Finding` shape nested inside
        `IncidentDetail`, which describes a finding already known to belong to an incident
        and so carries no evidence dimensions or disposition.

        `reason`/`message` are Kubernetes-derived text — untrusted; render through plain
        text interpolation only, never as HTML.
      properties:
        id: { type: string }
        clusterId: { type: string }
        clusterDisplayName: { type: string }
        detectorId: { type: string }
        ruleId: { type: string, description: 'Absent for a finding from a hand-written Go checker or a watch-based detector, which is the common case — the declarative rule layer is the minority of detections.' }
        gvk: { type: string }
        namespace: { type: string, description: 'Absent for a cluster-scoped object — normal, not missing data.' }
        objectName: { type: string, description: 'Absent when the detector named no object, which is also what makes the incident correlation fall back to fingerprint-only.' }
        reason: { type: string }
        message: { type: string }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        occurrenceCount: { type: integer }
        occurredAt: { type: string, format: date-time }
        fingerprint: { type: string }
        class:
          allOf: [ { $ref: '#/components/schemas/FindingClass' } ]
          description: The STORED evidence class. See `promotion.class` for the one the boundary judged.
        confidence: { $ref: '#/components/schemas/FindingConfidence' }
        impact: { $ref: '#/components/schemas/FindingImpact' }
        disposition: { $ref: '#/components/schemas/FindingDisposition' }
        incidentId: { type: string, description: 'Present exactly when `disposition` is `correlated`.' }
        suppressionReason:
          allOf: [ { $ref: '#/components/schemas/FindingSuppressionReason' } ]
          description: |
            Present only when `disposition` is `suppressed` AND this row was written after
            migration 000124 — that migration is not backfilled, so an
            older suppressed row still carries neither value and this stays absent for it.
            Absent on every other disposition. Never guessed: this is the same toleration-
            vs-storm-protection distinction `audit_events` records
            (`finding_suppressed_by_toleration` / `storm_protection_suppressed_new_incident`),
            now written onto the row itself at insert time instead of living only in the
            audit log.
        promotion: { $ref: '#/components/schemas/FindingPromotionVerdict' }

    FindingCounts:
      type: object
      required: [all, correlated, retainedUnpromoted, suppressed]
      description: |
        The disposition breakdown over the FULL scoped set — never the length of the
        returned page, and never narrowed by `?disposition=`. Never derive any of these
        from `findings.length`: this repo has a recorded bug of exactly that shape, a
        figure computed from a fetched page that silently understated itself the moment
        the list truncated while continuing to read as a fact.
      properties:
        all: { type: integer }
        correlated: { type: integer }
        retainedUnpromoted: { type: integer }
        suppressed: { type: integer }

    FindingWindow:
      type: object
      required: [since]
      description: The resolved time bounds the rows and the counts were both taken over. Always present, because `?since=` defaults rather than meaning "everything".
      properties:
        since: { type: string, format: date-time }
        until: { type: string, format: date-time, description: 'Absent when open-ended.' }

    FindingsResponse:
      type: object
      required: [findings, counts, window, promotionRule]
      properties:
        findings: { type: array, items: { $ref: '#/components/schemas/FindingListItem' } }
        nextCursor:
          type: string
          description: Present only when a FULL page came back. A client that ignores it is holding a truncated list.
        counts: { $ref: '#/components/schemas/FindingCounts' }
        window: { $ref: '#/components/schemas/FindingWindow' }
        promotionRule: { $ref: '#/components/schemas/FindingPromotionRule' }

    ToolCall:
      type: object
      required: [tool, args, result, error]
      description: Exactly one of result/error is non-null. args/result/error are untrusted cluster-derived content — render as plain text only.
      properties:
        tool: { type: string }
        args: { type: object, additionalProperties: true }
        result: {}
        error: { type: [string, 'null'] }
        evidenceId:
          type: string
          description: Set for every call the api backend actually dispatched (success or error); absent for a tool call refused before dispatch, or on an analysis stored before this field existed.
        corroborated:
          type: string
          enum: [corroborated, contradicted, unchecked, unverified]
          description: Meaningful only when the enclosing analysis's causalChainProvenance is "self-reported" — must be ignored on a "hub-observed" analysis, where it is always absent.

    TimelineEvent:
      type: object
      required: [id, eventType, summary, occurredAt]
      properties:
        id: { type: string }
        eventType: { type: string }
        summary: { type: string }
        detail: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }

    TimelineResponse:
      type: object
      required: [events]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/TimelineEvent' } }

    EvidenceDetail:
      type: object
      required: [id, incidentId, tool, outcome, args, redacted, capturedAt]
      description: |
        `result`/`error` are present with mutually-exclusive KEY PRESENCE (outcome-driven),
        not merely nullable — outcome "ok" omits `error` entirely, "error" omits `result`
        entirely. `redacted` is a real statement from the server, not implied silence —
        it is what actually makes this content safe to show.
      properties:
        id: { type: string }
        incidentId: { type: string }
        tool: { type: string }
        outcome: { type: string, enum: [ok, error] }
        args: { type: object, additionalProperties: true }
        result: {}
        error: { type: string }
        redacted: { type: boolean }
        capturedAt: { type: string, format: date-time }

    AnalysisStep:
      type: object
      required: [step, hypothesis, toolCalls, finding]
      properties:
        step: { type: integer }
        hypothesis: { type: string }
        toolCalls: { type: array, items: { $ref: '#/components/schemas/ToolCall' } }
        finding: { type: string }

    RuledOutHypothesis:
      type: object
      required: [hypothesis, reason]
      properties:
        hypothesis: { type: string }
        reason: { type: string }

    RemediationActionType:
      type: string
      enum:
        - ScaleDeployment
        - RestartPod
        - PatchResourceLimits
        - RevertContainerImage
        - OpenPR
        - PatchField
        - StructuredPatch
        - AnnotateResource
        - LabelResource
        - DeleteResource
        - CreateResource
        - CordonNode
        - DrainNode
      description: |
        The full closed set from `internal/remediation.ActionType`'s own constants
        (`internal/remediation/plan.go`), verified directly against that file rather than
        against `web/src/api/types.ts`'s `RemediationActionType` union — which currently
        names only 5 of these 11 and was the very discrepancy this contract test caught
        (`TestOpenAPIContract_ApprovalsListMatchesSchema` failed against a real
        `DeleteResource` row until this enum was widened to match the Go source; see this
        item's report). `PatchField` cannot execute today (the agent tool exists but
        `internal/api` has no case for it, so approving one 500s) and OpenPR is no longer
        offered fresh by the model — both still appear here because historical/queued
        plans carry them and a client must be able to render them without an enum error.

    GateOutcome: { type: string, enum: [AutoApprove, NeedsApproval, Blocked] }

    PlanApprovalDecision:
      type: object
      required: [verdict, createdAt]
      properties:
        verdict: { type: string, enum: [approved, rejected] }
        actorEmail: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    PlanExecutionOutcome:
      type: object
      required: [outcome, executedAt, id]
      description: '`unknown`: the mutating call''s own result was indeterminate (disconnect/timeout) and a live-cluster follow-up verify could not confidently confirm either way — never asserted as "failed" from that ambiguity alone.'
      properties:
        outcome: { type: string, enum: [succeeded, failed, unknown] }
        error: { type: string }
        executedAt: { type: string, format: date-time }
        id: { type: string }
        rollback:
          type: string
          description: Absent when the action type has no representable undo (e.g. a restart cannot be un-restarted) — absent because there is nothing to offer, not a permission problem.
        rolledBackAt: { type: string, format: date-time }

    RemediationPlan:
      type: object
      required: [id, actionType, targetGvk, targetNamespace, targetName, params, reversible, riskLevel, effectiveRiskLevel, summary, gateOutcome, gateReason, createdAt]
      description: |
        Shared shape returned by `POST /incidents/{id}/analyze`, `GET /incidents/{id}`, and
        `GET /approvals` — the SAME struct on the Go side (`planView`), by explicit design,
        so these three never drift into different shapes for the same conceptual object.
        Render `summary`, never `params`, as the human-facing description.
      properties:
        id: { type: string }
        actionType: { $ref: '#/components/schemas/RemediationActionType' }
        targetGvk: { type: string }
        targetNamespace: { type: string }
        targetName: { type: string }
        params: { type: object, additionalProperties: true }
        reversible: { type: boolean }
        riskLevel:
          type: string
          enum: [low, medium, high]
          description: |
            The MODEL'S OWN DECLARED risk — persisted verbatim, never overwritten (rewriting
            it would destroy the calibration signal that a class of plans is under-
            classified). NOT what decided whether a human was needed — see
            `effectiveRiskLevel`. Render this only as a secondary "model declared X" note,
            and only when it differs from `effectiveRiskLevel`.
        effectiveRiskLevel:
          type: string
          enum: [low, medium, high]
          description: |
            `riskLevel` raised to the deterministic floor for this action type and target,
            exactly as the gate computed it at decision time. THIS is the value that decided
            whether the gate needed a human, so it is what any risk badge on this plan MUST
            show — `riskLevel` alone can flatly contradict `gateReason`'s own text (e.g.
            "risk=high and reversible=false") when the floor raised it.
        summary: { type: string }
        gateOutcome: { $ref: '#/components/schemas/GateOutcome' }
        gateReason: { type: string }
        createdAt: { type: string, format: date-time }
        approval:
          $ref: '#/components/schemas/PlanApprovalDecision'
        execution:
          $ref: '#/components/schemas/PlanExecutionOutcome'

    CompleteAnalysis:
      type: object
      required: [status, model, causalChain, ruledOut, iterations, createdAt, tokensBilledIn, tokensCacheRead, tokensOut, costUsd, costBasis, incidentState, stateReason, plan, rootCause, confidence, partialReason]
      description: |
        The investigation loop reached a conclusion. `rootCause`/`confidence` are nullable
        even here — a legacy row can be "complete" with both null; narrow on `status` first,
        then still null-check before dereferencing.
      properties:
        id: { type: string }
        rawFinalAnswer: { type: string }
        parseError: { type: string }
        model: { type: string }
        status: { type: string, const: complete }
        causalChain: { type: array, items: { $ref: '#/components/schemas/AnalysisStep' } }
        causalChainProvenance: { type: string, enum: [hub-observed, self-reported] }
        ruledOut: { type: array, items: { $ref: '#/components/schemas/RuledOutHypothesis' } }
        iterations: { type: integer }
        createdAt: { type: string, format: date-time }
        tokensBilledIn: { type: integer }
        tokensCacheRead: { type: integer }
        tokensOut: { type: integer }
        costUsd:
          type: number
          description: Honestly 0 when no per-model pricing is configured — see `costBasis` before reading this as "free".
        costBasis: { type: string, enum: [metered, subscription, unknown] }
        evidenceCoverage: { $ref: '#/components/schemas/EvidenceCoverage' }
        triggeredBy: { type: string, enum: [manual, auto] }
        incidentState:
          type: string
          description: |
            Populated on a fresh `POST /analyze` response. On `GET /incidents/{id}`'s
            read-back of a historical analysis this is `""` (empty string, not omitted) —
            re-deriving it retroactively would need to re-run a gate/policy that may have
            since changed, so the frontend relies on the incident's own top-level `state`
            instead. This value divergence between the two callers is deliberate, not drift.
        stateReason: { type: string }
        plan:
          oneOf: [ { $ref: '#/components/schemas/RemediationPlan' }, { type: 'null' } ]
        pairedPlan:
          description: Present only when the route resolved `pullRequest+inPlace` and both halves were proposed. Never present without `plan`.
          oneOf: [ { $ref: '#/components/schemas/RemediationPlan' }, { type: 'null' } ]
        rootCause:
          oneOf:
            - type: object
              required: [statement]
              properties:
                statement: { type: string }
                isFault: { type: boolean }
            - type: 'null'
        confidence:
          oneOf: [ { type: number }, { type: 'null' } ]
        partialReason: { type: 'null' }
        suggestedNextSteps:
          description: Populated on the guidance route (no in-cluster action exists) even for a "complete" status; null otherwise.
          oneOf:
            - type: array
              items: { type: string }
            - type: 'null'

    PartialAnalysis:
      type: object
      required: [status, model, causalChain, ruledOut, iterations, createdAt, tokensBilledIn, tokensCacheRead, tokensOut, costUsd, costBasis, incidentState, stateReason, plan, rootCause, confidence, partialReason, suggestedNextSteps]
      description: |
        The investigation loop hit an iteration or time bound before concluding — a normal,
        useful, evidence-linked result. Never render as an error; render as "didn't reach a
        conclusion, here's what it found and what to check next."
      properties:
        id: { type: string }
        rawFinalAnswer: { type: string }
        parseError: { type: string }
        model: { type: string }
        status: { type: string, const: partial }
        causalChain: { type: array, items: { $ref: '#/components/schemas/AnalysisStep' } }
        causalChainProvenance: { type: string, enum: [hub-observed, self-reported] }
        ruledOut: { type: array, items: { $ref: '#/components/schemas/RuledOutHypothesis' } }
        iterations: { type: integer }
        createdAt: { type: string, format: date-time }
        tokensBilledIn: { type: integer }
        tokensCacheRead: { type: integer }
        tokensOut: { type: integer }
        costUsd: { type: number }
        costBasis: { type: string, enum: [metered, subscription, unknown] }
        evidenceCoverage: { $ref: '#/components/schemas/EvidenceCoverage' }
        triggeredBy: { type: string, enum: [manual, auto] }
        incidentState: { type: string }
        stateReason: { type: string }
        plan:
          oneOf: [ { $ref: '#/components/schemas/RemediationPlan' }, { type: 'null' } ]
        pairedPlan:
          oneOf: [ { $ref: '#/components/schemas/RemediationPlan' }, { type: 'null' } ]
        rootCause: { type: 'null' }
        confidence: { type: 'null' }
        partialReason:
          type: string
          enum: [iteration_limit, time_limit, malformed_final_answer]
        suggestedNextSteps: { type: array, items: { type: string } }

    AnalysisStarted:
      description: '`POST /incidents/{id}/analyze` — the investigation was claimed and is running.'
      type: object
      required: [incidentId, state, startedAt]
      properties:
        incidentId: { type: string }
        state:
          type: string
          enum: [Investigating]
        startedAt: { type: string, format: date-time }
        backend:
          type: string
          enum: [api, cli]
          description: The AI backend the run was configured to use. Omitted when unknown.
        model:
          type: string
          description: The configured model, when knowable before the run (the `api` backend). Omitted otherwise.

    EvidenceCoverage:
      type: object
      description: |
        What the investigation could and could not read, counted from the real recorded tool calls.
        Absent for analyses written before it was recorded.
      required: [answered, empty, denied, failed, truncated, notOffered]
      properties:
        answered: { type: integer }
        empty: { type: integer, description: Calls that worked and found nothing. }
        denied: { type: integer, description: Calls the cluster refused. }
        failed: { type: integer, description: Calls that did not complete. }
        truncated: { type: integer, description: Answered calls whose output was capped. }
        notOffered:
          type: array
          items: { type: string, enum: [metrics, dryRun, repository] }

    Analysis:
      description: Discriminate on `status` before reading any other field.
      oneOf:
        - { $ref: '#/components/schemas/CompleteAnalysis' }
        - { $ref: '#/components/schemas/PartialAnalysis' }

    DiffChange:
      type: object
      required: [path]
      properties:
        path: { type: string, description: 'Dotted path, list elements keyed by name where possible — `spec.template.spec.containers[web].image`, not `[0]`.' }
        before: {}
        after: {}
        added: { type: boolean }
        removed: { type: boolean }

    PreflightDiff:
      type: object
      required: [requested, additional, suppressed]
      properties:
        requested: { type: array, items: { $ref: '#/components/schemas/DiffChange' } }
        additional:
          type: array
          items: { $ref: '#/components/schemas/DiffChange' }
          description: What the cluster would ALSO change (API-server defaulting, mutating webhooks) — the part the approver could not have predicted.
        suppressed: { type: array, items: { type: string } }

    PreflightResponse:
      type: object
      required: [incidentId, planId, attestedAt, target, noChange]
      properties:
        incidentId: { type: string }
        planId: { type: string }
        attestedAt: { type: string, format: date-time }
        target:
          type: object
          required: [gvk, namespace, name]
          description: The object the change actually lands on — for a pod-template action, NOT the object the finding named.
          properties:
            gvk: { type: string }
            namespace: { type: string }
            name: { type: string }
        diff: { $ref: '#/components/schemas/PreflightDiff' }
        diffUnavailable:
          type: string
          description: Set instead of `diff` when the rehearsal succeeded but no comparison could be produced. Must never be read as "nothing would change".
        noChange: { type: boolean }
        blockedBy:
          type: array
          items: { type: string }
          description: Advisory guardrails approving would additionally require confirming — the diff is still shown even when this is non-empty.
        notes: { type: array, items: { type: string } }

    ApprovalDecisionResponse:
      type: object
      required: [incidentId, planId, verdict, incidentState, message]
      description: |
        `POST /incidents/{id}/approve|reject`'s shared response shape.

        For **reject**: `incidentState` is `"PlanRejected"` — a distinct, still-open
        orchestrator state, NOT `"Dismissed"`. (An earlier build did transition to
        Dismissed; that was a defect — refusing an unsafe fix is not the same fact as
        deciding the incident needs no action — and `internal/orchestrator` was changed to
        `PlanRejected` accordingly. Any client-side copy of this contract must track this
        Go behaviour, not the other way around.)

        For **approve**: `ScaleDeployment`/`RestartPod`/`PatchResourceLimits`/
        `RevertContainerImage` sign and execute within this same request — `incidentState`
        is `"Validating"` on success or `"Failed"`/`"ExecutionUnknown"` otherwise, never
        `"AwaitingApproval"`. `OpenPR` actually opens the pull request in this same request
        (this is NOT the execution-free no-op an older build's comment described) —
        `incidentState` stays `"AwaitingApproval"`. Always render `message`; it is the only
        place the real per-action-type outcome is stated.
      properties:
        incidentId: { type: string }
        planId: { type: string }
        verdict: { type: string, enum: [approved, rejected] }
        incidentState: { type: string }
        message: { type: string }

    IncidentTriageResponse:
      type: object
      required: [incidentId, verdict, incidentState, message]
      description: '`POST /incidents/{id}/resolve|dismiss`''s shared response — no `planId`, since most incidents never have a plan. Closing an incident is a statement about the past; nothing here mutes detection.'
      properties:
        incidentId: { type: string }
        verdict: { type: string, enum: [resolved, dismissed] }
        incidentState: { type: string }
        message: { type: string }

    EvidenceSummary:
      type: object
      required: [totalCalls, failedCalls, byTool]
      description: What the investigation actually asked the cluster, aggregated per-incident (not per-analysis) — an incident analysed twice reports both runs' calls together.
      properties:
        totalCalls: { type: integer }
        failedCalls: { type: integer, description: "A subset of totalCalls, not a separate bucket." }
        byTool: { type: object, additionalProperties: { type: integer } }

    RecentChange:
      type: object
      required: [category, time, source]
      description: '`time` is when the underlying Kubernetes fact happened, never when the investigation asked about it. Deliberately excludes a snapshot-derived "image changed"/"replica count changed" fact — only the controller''s OWN account of the change (e.g. Pulling/Pulled, ScalingReplicaSet) is included.'
      properties:
        time: { type: string, format: date-time }
        category: { type: string, enum: [created, rollout_created, replica_change, image_pull, warning_event] }
        source:
          type: string
          description: "The exact MCP tool this fact was read from ('get_events'|'list_resources'|'describe_resource') — render verbatim via a label map."
        objectKind: { type: string }
        objectNamespace: { type: string }
        objectName: { type: string }
        reason: { type: string, description: "Set only for the four event-sourced categories — the Kubernetes Event's own Reason, already redacted agent-side." }
        message: { type: string }

    RecentChangesView:
      type: object
      required: [items, windowHours, truncated]
      description: |
        Present-but-empty (`items: []`) and absent (the field is `null`) are two DIFFERENT
        answers: null means "no evidence exists for this incident"; empty means "we looked
        and found nothing relevant". Never collapse the two.
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RecentChange' } }
        windowHours:
          type: integer
          description: The bound actually enforced server-side, echoed so an empty list can say "looked at the Nh before the first finding and found nothing" instead of reading as unexamined.
        truncated:
          type: boolean
          description: True when more facts fell inside the window than were kept — state this rather than let a list at the cap read as complete.

    OwnershipRepo:
      type: object
      required: [url, path, pinned]
      properties:
        url: { type: string }
        path: { type: string }
        branch: { type: string }
        revision:
          type: string
          description: The commit the controller reports as last synced.
        pinned:
          type: boolean
          description: Whether `revision` is a real resolved SHA or only the branch/tag requested — unpinned means nobody can say which commit is actually running.
        resolvedFrom: { type: string, description: "The object and field this came from, so a reader can check the claim." }

    ObjectOwnership:
      type: object
      required: [managedBy, sourceKind, sourceName, sourceNamespace, objectGvk, objectNamespace, objectName]
      description: |
        What manages the live object, and therefore whether an in-place fix survives.
        Derived by the hub from the tool calls the investigation actually made — not a
        fresh cluster query. Absent (the enclosing field is null) means UNKNOWN, never
        "unmanaged": never render a revert warning's absence as a clean bill of health.
      properties:
        managedBy: { type: string, enum: [argocd, flux, helm] }
        sourceKind:
          type: string
          description: "'Application'/'ApplicationSet' for Argo CD, 'Kustomization'/'HelmRelease' for Flux, 'Release' (Helm's own noun) for Helm."
        sourceName: { type: string }
        sourceNamespace: { type: string }
        objectGvk: { type: string }
        objectNamespace: { type: string }
        objectName: { type: string }
        repo:
          description: Absent for a Helm release, and for a controller that has never synced.
          $ref: '#/components/schemas/OwnershipRepo'

    UnattendedBatchInfo:
      type: object
      required: [batchId, fleetGroupId, actionType, waveNumber, batchStatus, wave1Size, totalSize, held]
      description: |
        Whether this incident is staged into a fleet-correlated unattended rollout. Null
        for the large majority of incidents that never shared a fleet group and an
        unattended action_type with anything else — the same "absent means nothing to
        say" treatment as `ownership`, never a placeholder for the common case. `held` is
        the field this exists to expose.
      properties:
        batchId: { type: string }
        fleetGroupId: { type: string }
        actionType: { type: string }
        waveNumber: { type: integer }
        batchStatus: { type: string, enum: [wave1_pending, released, blocked, abandoned] }
        wave1Size: { type: integer }
        totalSize: { type: integer }
        held: { type: boolean }

    IncidentPullRequest:
      type: object
      required: [number]
      description: |
        `fieldPath`/`expectedValue` are the post-merge verification target and are absent
        for a real reason: since 2026-08-28 a repository change is a set of WHOLE-FILE
        edits, so there is no single field left to re-read to confirm the change landed.
        Present means a post-merge check will run against that field; absent means no
        automatic check is possible for this PR — never render a check that cannot run.
      properties:
        number: { type: integer }
        url: { type: string }
        openedAt:
          type: string
          format: date-time
          description: |
            When THIS pull request was opened (`incidents.pr_opened_at`). Replaced wholesale
            by a re-proposal, so it always describes the pull request `number` names — never
            an earlier one's. Absent for a pull request opened before migration 000114 whose
            URL the backfill could not match exactly; render an absent value as absent,
            never as a zero age.
        mergedAt: { type: string, format: date-time }
        closedUnmergedAt: { type: string, format: date-time }
        rejectionReason: { type: string }
        fieldPath: { type: string }
        expectedValue: { type: string }

    IncidentReopenCause:
      type: object
      required: [occurredAt, sameObject]
      description: |
        `sameObject=false` means the fix held and a DIFFERENT object of the same workload
        (correlation runs at the workload tier) started failing — the fix did not fail.
      properties:
        objectGvk: { type: string }
        objectNamespace: { type: string }
        objectName: { type: string }
        reason: { type: string }
        occurredAt: { type: string, format: date-time }
        sameObject: { type: boolean }

    RejectedPlanSummary:
      type: object
      required: [actionType, reason, rejectedAt]
      properties:
        actionType: { type: string }
        reason: { type: string }
        rejectedAt: { type: string, format: date-time }

    PriorIncidentLink:
      type: object
      required: [incidentId, state, firstSeen]
      description: Prior CLOSED incidents sharing this exact object, newest first, capped at 5. Always an array, never null.
      properties:
        incidentId: { type: string }
        state: { $ref: '#/components/schemas/IncidentState' }
        resolutionKind: { type: string, enum: [remediated, self_healed] }
        firstSeen: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        rootCause: { type: string }
        confidence: { type: number }
        rejectedPlan: { $ref: '#/components/schemas/RejectedPlanSummary' }

    IncidentAutomationGate:
      type: object
      required: [gate, reason, at]
      description: |
        Read back verbatim from the enforcing sweeper's own refusal — never recomputed or
        inferred here or anywhere downstream, which is exactly the "two evaluations that
        agree today and drift silently later" failure this field exists to prevent.
      properties:
        gate:
          type: string
          enum:
            - severity_not_selected
            - daily_spend_ceiling
            - no_ai_provider
            - cluster_unreachable
            - namespace_scope
            - maintenance_window
            - circuit_breaker
            - blast_radius
            - batch_hold
            - unattended_execution_disabled
        reason: { type: string }
        at: { type: string, format: date-time }

    Incident:
      type: object
      required: [id, clusterId, clusterDisplayName, fingerprint, severity, state, firstSeen, lastSeen, occurrenceCount]
      description: One row of `GET /incidents`, and the base shape `IncidentDetail` extends.
      properties:
        id: { type: string }
        clusterId: { type: string }
        clusterDisplayName: { type: string }
        fingerprint: { type: string }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        state: { $ref: '#/components/schemas/IncidentState' }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        occurrenceCount: { type: integer }
        fleetGroupId: { type: string, description: Set whenever this fingerprint is currently open on 2+ distinct clusters at once. Absent (not null) otherwise. }
        workloadGroupId: { type: string }
        workloadKey: { type: string }
        openingReason: { type: string }
        objectGroupId: { type: string }
        relatedWorkloadKey: { type: string }
        objectGvk: { type: string, description: Omitted entirely (not empty) when the opening finding named no object. }
        objectNamespace: { type: string }
        objectName: { type: string }
        resolvedAt: { type: string, format: date-time, description: 'The moment this incident actually closed — distinct from lastSeen (last finding recurrence). Absent for every incident that has never closed.' }
        resolutionKind:
          type: string
          enum: [remediated, self_healed]
          description: Set only on the transition INTO Resolved. Absent for a Dismissed incident too — a human's active rejection is a different fact, not a third value of this one.
        importanceExplanation:
          type: array
          items: { type: string }
          description: Set only when this row was fetched with `?sort=importance`. Absent (not empty) for every other sort.
        route:
          oneOf: [ { $ref: '#/components/schemas/ResolutionRoute' }, { type: 'null' } ]
          description: >-
            The resolution channel `internal/resolution.RouteFor` chose for this incident from
            ownership facts, before the model was asked anything (ADR-18). ABSENT on this list shape
            (and `null` on `IncidentDetail`) for an incident that predates routing or has never been
            investigated — render that as "not routed yet", never as a guessed route. The prose
            `routeReason` is detail-only.

    ResolutionRoute:
      type: string
      enum: [pullRequest, inPlace, 'pullRequest+inPlace', guidance]
      description: >-
        `internal/resolution.Route`'s four wire values, and the CHECK constraint on
        `incidents.route` (migration 000062). Named once here because both `Incident` and
        `IncidentDetail` carry it and an inline copy in each would be free to drift.

    IncidentDigestGroup:
      type: object
      required: [fingerprint, incidentCount, clusterCount, maxSeverity, oldestFirstSeen, newestLastSeen, sampleIncidentId]
      properties:
        fingerprint: { type: string }
        incidentCount: { type: integer }
        clusterCount: { type: integer }
        maxSeverity: { $ref: '#/components/schemas/IncidentSeverity' }
        oldestFirstSeen: { type: string, format: date-time }
        newestLastSeen: { type: string, format: date-time }
        sampleIncidentId: { type: string }
        objectGvk: { type: string }
        objectNamespace: { type: string }
        objectName: { type: string }
        openingReason: { type: string }

    IncidentSeverityMix:
      type: object
      required: [critical, high, medium, low]
      properties:
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }

    IncidentOverview:
      type: object
      required: [days, byState, byCluster, daily, generatedAt]
      properties:
        days: { type: integer }
        generatedAt: { type: string, format: date-time }
        byState:
          type: array
          description: Open incidents per state.
          items:
            type: object
            required: [state, count]
            properties:
              state: { type: string }
              count: { type: integer }
        byCluster:
          type: array
          description: Open incidents per cluster. A cluster with no open incident has no row.
          items:
            allOf:
              - { $ref: '#/components/schemas/IncidentSeverityMix' }
              - type: object
                required: [clusterId, open, requiresAction, fixNotHeld]
                properties:
                  clusterId: { type: string }
                  open: { type: integer }
                  requiresAction: { type: integer }
                  fixNotHeld: { type: integer }
        daily:
          type: array
          items:
            type: object
            required: [date, opened, resolved, openAtEnd]
            properties:
              date: { type: string, format: date }
              opened: { $ref: '#/components/schemas/IncidentSeverityMix' }
              resolved: { type: integer, description: 'Incidents that closed (resolved, dismissed or expired) that day.' }
              openAtEnd: { type: integer }

    IncidentDigestResponse:
      type: object
      required: [groups, totalIncidents]
      properties:
        groups: { type: array, items: { $ref: '#/components/schemas/IncidentDigestGroup' } }
        totalIncidents: { type: integer }
        truncated:
          type: boolean
          description: Present only when the 200-group cap was actually hit.

    IncidentQuickViewCounts:
      type: object
      required: [all, requiresAction, open, resolvedLast7Days, fixNotHeld, critical, high, medium]
      description: Computed server-side over EVERY incident matching scope, never limited by the list's own page size.
      properties:
        all: { type: integer }
        requiresAction:
          type: integer
          description: Not "open" — the states where nothing happens until a person acts.
        open:
          type: integer
          description: The lifecycle is not over. Wider than requiresAction, which excludes in-progress states; the two are supposed to differ.
        resolvedLast7Days:
          type: integer
          description: Incidents whose resolved_at falls in a rolling 7 days from now. Counts when work landed, so a later reopen does not un-count it.
        fixNotHeld:
          type: integer
          description: ARGUS acted and it did not demonstrably work — Failed, ExecutionUnknown, ValidationUnknown, Reopened. Narrower than requiresAction, which also counts incidents nothing has been tried on.
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }

    IncidentsResponse:
      type: object
      required: [incidents, counts]
      properties:
        incidents: { type: array, items: { $ref: '#/components/schemas/Incident' } }
        nextCursor:
          type: string
          description: Present only when a FULL page came back. A client that ignores it is holding a truncated list.
        counts: { $ref: '#/components/schemas/IncidentQuickViewCounts' }
        lookalikeGroups:
          type: array
          description: >-
            Present when `groups=lookalike` was asked for: incidents sharing kind, namespace, opening
            reason, severity and state, counted over every match rather than the page, groups of two or
            more only. `key` is kind|namespace|reason|severity|state.
          items:
            type: object
            required: [key, count]
            properties:
              key: { type: string }
              count: { type: integer }
        breakdown:
          type: array
          description: |
            Matching incidents counted by status (disposition) and severity, with every filter applied
            except `status`, `severity` and `requiresAction` — the axes being counted. Unlike `counts` it
            honours `search`. A cell with no incidents is absent, not zero-valued.
          items:
            type: object
            required: [status, severity, count]
            properties:
              status: { type: string, enum: [requiresAction, inProgress, closed] }
              severity: { type: string, enum: [low, medium, high, critical] }
              count: { type: integer }

    IncidentDetail:
      description: '`GET /incidents/{id}` — `Incident` plus everything the detail page needs.'
      allOf:
        - { $ref: '#/components/schemas/Incident' }
        - type: object
          required: [analysis, findings, findingGroups, ownership, evidence, recentChanges, unattendedBatch, pullRequest, reopenedBy, route, routeReason, applier, automationGate, analysisStartedAt, analysisBackend, analysisModel, analysisError, priorIncidents]
          properties:
            analysis:
              oneOf: [ { $ref: '#/components/schemas/Analysis' }, { type: 'null' } ]
            findings:
              type: array
              items: { $ref: '#/components/schemas/Finding' }
              description: A SLICE, newest first — only the most recent few events per reason. Never derive a count or time range from this array's length; use findingGroups.
            objectsFolded:
              type: integer
              description: Distinct objects whose findings joined this incident, over its whole history. Absent when the count could not be read.
            findingGroups:
              type: array
              items: { $ref: '#/components/schemas/FindingReasonGroup' }
              description: One entry per distinct reason, covering the FULL history — the sum of `count` here is the incident's real event total.
            ownership:
              oneOf: [ { $ref: '#/components/schemas/ObjectOwnership' }, { type: 'null' } ]
            evidence:
              description: 'Null means NOT RECORDED, never "no evidence was gathered" — an analysis from before evidence tracking existed gathered real evidence the hub simply did not keep.'
              oneOf: [ { $ref: '#/components/schemas/EvidenceSummary' }, { type: 'null' } ]
            recentChanges:
              oneOf: [ { $ref: '#/components/schemas/RecentChangesView' }, { type: 'null' } ]
            unattendedBatch:
              oneOf: [ { $ref: '#/components/schemas/UnattendedBatchInfo' }, { type: 'null' } ]
            pullRequest:
              oneOf: [ { $ref: '#/components/schemas/IncidentPullRequest' }, { type: 'null' } ]
            reopenedBy:
              oneOf: [ { $ref: '#/components/schemas/IncidentReopenCause' }, { type: 'null' } ]
              description: Null unless state is Reopened and a ValidationOutcome timeline event recorded a cause.
            route:
              oneOf: [ { $ref: '#/components/schemas/ResolutionRoute' }, { type: 'null' } ]
              description: Always present here, `null` when the incident has never been routed — unlike the list shape, which omits it.
            routeReason: { type: [string, 'null'] }
            applier:
              type: [string, 'null']
              description: |
                Who applies a change to this object (`incidents.applier`, migration 000062) —
                e.g. `gitopsController`. The fact that JUSTIFIES the route rather than
                restating it: it is what makes `pullRequest` a consequence of how the cluster
                works rather than a policy ARGUS is imposing. Null when the incident has
                never been routed.
            automationGate:
              oneOf: [ { $ref: '#/components/schemas/IncidentAutomationGate' }, { type: 'null' } ]
            analysisStartedAt:
              type: [string, 'null']
              format: date-time
              description: |
                When the current (`state` is `Investigating`) or most recent investigation
                started, manual or automatic — its `InvestigationStarted` timeline event. Null if
                none ever started.
            analysisBackend:
              type: [string, 'null']
              enum: [api, cli, null]
              description: The AI backend that run was claimed with. Null when not recorded (an automatic run).
            analysisModel:
              type: [string, 'null']
              description: The configured model when that run started. Null when not knowable before the run (a `cli` agent picks its own; the finished analysis's `model` is authoritative).
            analysisError:
              type: [string, 'null']
              description: |
                Why the most recent manually started investigation did not complete (it ran in
                the background after `POST /analyze` answered `202`). Null unless it failed;
                cleared when the next investigation starts.
            priorIncidents:
              type: array
              items: { $ref: '#/components/schemas/PriorIncidentLink' }

    TolerateIncidentResponse:
      type: object
      required: [incidentId, incidentState, toleration, message]
      properties:
        incidentId: { type: string }
        incidentState: { type: string }
        toleration: { $ref: '#/components/schemas/Toleration' }
        message: { type: string }

    # ------------------------------------------------------- approvals
    ApprovalSortKey: { type: string, enum: [waiting, risk, severity] }
    ApprovalSortDirection: { type: string, enum: [asc, desc] }

    ApprovalQueueItem:
      type: object
      required: [incidentId, clusterId, clusterDisplayName, fingerprint, severity, firstSeen, lastSeen, occurrenceCount, plan, confidence, rootCauseStatement, causalChain, ruledOut, alreadyApproved]
      description: One `GET /approvals` row. `plan.approval`/`plan.execution` are always absent here (only populated on `GET /incidents/{id}`'s embedded plan).
      properties:
        incidentId: { type: string }
        clusterId: { type: string }
        clusterDisplayName: { type: string }
        fingerprint: { type: string }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        occurrenceCount: { type: integer }
        plan: { $ref: '#/components/schemas/RemediationPlan' }
        confidence: { oneOf: [ { type: number }, { type: 'null' } ] }
        rootCauseStatement: { type: string }
        causalChain: { type: array, items: { $ref: '#/components/schemas/AnalysisStep' } }
        ruledOut: { type: array, items: { $ref: '#/components/schemas/RuledOutHypothesis' } }
        causalChainProvenance: { type: string, enum: [hub-observed, self-reported] }
        alreadyApproved:
          type: boolean
          description: True once someone has approved this exact plan without the incident leaving AwaitingApproval — realistically an OpenPR-only case today.
        supersededByUrl:
          type: string
          description: Set when ARGUS already proposed the durable fix at source. Approving is refused 409; the row STAYS in the queue because "should I merge this PR?" remains a real decision.
        executionBlockedReason:
          type: string
          description: Set when this in-place plan cannot execute right now because the cluster has no remediation agent connected. Approving is refused 409 (no-remediation-agent); the UI disables Approve and shows this sentence beside it. Never set for OpenPR plans.

    ApprovalCounts:
      type: object
      required: [pending, approved, high, medium, low]
      description: |
        Always computed over the FULL matching clusterId/actionType[/riskLevel] scope, never
        just the returned page. `pending`/`approved` narrow with `?riskLevel=`;
        `high`/`medium`/`low` deliberately do NOT (they describe the risk breakdown of the
        whole scope, which riskLevel itself slices, not further narrows).
      properties:
        pending: { type: integer }
        approved: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }

    ApprovalsResponse:
      type: object
      required: [approvals, counts]
      properties:
        approvals: { type: array, items: { $ref: '#/components/schemas/ApprovalQueueItem' } }
        nextCursor: { type: string }
        counts: { $ref: '#/components/schemas/ApprovalCounts' }

    # ----------------------------------------------------- repositories
    ObjectMapping:
      type: object
      required: [path]
      description: |
        A Helm-release-or-manifest scope paired with the repository path that renders it.
        Verified against `web/src/api/types.ts`'s `ObjectMapping` (internal/api's
        `scm.ObjectMapping`) — NOT the earlier, incorrect `{bindingId, path, scope}` guess
        this schema originally carried, which `npm run build` would not have caught (a
        looser generated type silently accepts the real shape too) but which is exactly
        the kind of drift this item exists to stop repeating.
      properties:
        releaseName: { type: string }
        namespace: { type: string }
        labelSelector: { type: object, additionalProperties: { type: string } }
        path: { type: string }

    RepositoryBinding:
      type: object
      required: [id, provider, url, host, credentialStored, createdAt, objectMappings]
      description: A registered Git repository ARGUS may open a pull request against, and the credential it uses. The token is NEVER returned in any form — only `credentialStored`.
      properties:
        id: { type: string }
        provider: { type: string, enum: [github, gitlab] }
        url: { type: string }
        host: { type: string }
        apiBaseUrl: { type: string }
        defaultBranch: { type: string }
        credentialStored: { type: boolean }
        expiresAt: { type: string, format: date-time }
        expiresInDays:
          type: integer
          description: Computed server-side so every consumer agrees on when to warn. NEGATIVE means already expired.
        createdAt: { type: string, format: date-time }
        objectMappings:
          type: array
          items: { $ref: '#/components/schemas/ObjectMapping' }
          description: Never omitted, even when empty — an absent key and an empty list are different facts for a form deciding whether to render "no mappings yet" vs. a client bug.

    RepositoriesResponse:
      type: object
      required: [repositories]
      properties:
        repositories: { type: array, items: { $ref: '#/components/schemas/RepositoryBinding' } }

    CreateRepositoryBindingRequest:
      type: object
      required: [provider, url, token]
      description: token is write-only and never comes back. Re-registering the same URL rotates the credential rather than failing.
      properties:
        provider: { type: string, enum: [github, gitlab] }
        url: { type: string }
        token: { type: string }
        apiBaseUrl: { type: string }
        defaultBranch: { type: string }
        expiresAt: { type: string, format: date-time }
        objectMappings: { type: array, items: { $ref: '#/components/schemas/ObjectMapping' } }

    UpdateRepositoryBindingRequest:
      type: object
      description: |
        A genuine partial update — every field is independently optional; OMITTING one
        leaves it exactly as stored. `token`: omit to leave unchanged, non-empty rotates it.
        `expiresAt`: omit = unchanged, `""` clears it, otherwise must parse as RFC 3339.
        `objectMappings`: omit = unchanged; a non-nil list (including `[]`) REPLACES it —
        there is no per-mapping add/remove. `provider` is deliberately not editable here.
      properties:
        url: { type: string }
        apiBaseUrl: { type: string }
        defaultBranch: { type: string }
        token: { type: string }
        expiresAt: { type: string }
        objectMappings: { type: array, items: { $ref: '#/components/schemas/ObjectMapping' } }

    RepositoryCheckResult:
      type: object
      required: [ok, provider, repository, defaultBranch, message]
      description: What `POST /repositories/{id}/check` returns on success. A failure comes back as a problem document instead, carrying the provider's own reason.
      properties:
        ok: { type: boolean, const: true }
        provider: { type: string }
        repository: { type: string }
        defaultBranch: { type: string }
        message: { type: string, description: "States plainly that this proves READ access only, not write." }

    # ------------------------------------------------------- tolerations
    SuppressedFindingGroup:
      type: object
      required: [reason, count, firstSeen, lastSeen, sampleMessage, severity]
      properties:
        reason: { type: string, description: 'Literal "(no reason reported)" if the stored value is null/empty.' }
        count: { type: integer }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        sampleMessage: { type: string }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }

    TolerationOrigin:
      type: object
      required: [incident, analysis, ownership]
      description: |
        The incident a toleration was created FROM. Deliberately the SAME Incident/Analysis
        shapes the incident screens use, not narrower copies, so a toleration's detail
        renders through the same components instead of a second vocabulary for one set of
        facts. `analysis` null means "never investigated", never "no cause".
      properties:
        incident: { $ref: '#/components/schemas/Incident' }
        analysis:
          oneOf: [ { $ref: '#/components/schemas/Analysis' }, { type: 'null' } ]
        ownership:
          oneOf: [ { $ref: '#/components/schemas/ObjectOwnership' }, { type: 'null' } ]

    Toleration:
      type: object
      required: [id, clusterId, clusterDisplayName, objectKey, objectGvk, objectNamespace, objectName, allReasons, note, createdBy, autoCreated, createdAt, suppressedCount]
      description: |
        A suppression rule — "stop opening new incidents for this object", either every
        reason (allReasons true) or a specific set. `note` is the one field whose entire
        job is explaining the decision; render as content, never as trailing metadata.
      properties:
        id: { type: string }
        clusterId: { type: string }
        clusterDisplayName: { type: string, description: Empty if the cluster row is gone — a rule that outlived its cluster is still listed. }
        objectKey: { type: string }
        objectGvk: { type: string }
        objectNamespace: { type: string, description: "Empty for a cluster-scoped object — normal, not missing data." }
        objectName: { type: string }
        reasons: { type: array, items: { type: string } }
        allReasons: { type: boolean }
        note: { type: string }
        incidentId:
          type: string
          description: Absent for a rule created before this column existed, or whose incident aged out of retention — a normal state.
        createdBy: { type: string, description: "Empty for a rule ARGUS created for itself — see autoCreated. Never a fabricated author." }
        createdByEmail: { type: string }
        autoCreated:
          type: boolean
          description: >-
            True only for a rule created automatically when an incident closed
            Dismissed or Expired, which therefore has no human author. Both kinds
            are removed the same way. A client MUST use this rather than inferring
            from an empty createdBy, and must not render an automatic rule as
            authored by "unknown" — ARGUS is the author.
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        suppressedCount:
          type: integer
          description: What this rule has actually done. Zero is a genuine candidate-for-removal signal, not missing data.
        firstSuppressed: { type: string, format: date-time }
        lastSuppressed: { type: string, format: date-time }

    TolerationDetail:
      type: object
      required: [toleration, origin, suppressed]
      description: |
        `origin` is null in two situations the client must tell apart using
        `toleration.incidentId`: no originating incident recorded at all (no id), or one is
        recorded but its row is no longer stored (id present, origin null).
      properties:
        toleration: { $ref: '#/components/schemas/Toleration' }
        origin:
          oneOf: [ { $ref: '#/components/schemas/TolerationOrigin' }, { type: 'null' } ]
        suppressed: { type: array, items: { $ref: '#/components/schemas/SuppressedFindingGroup' } }

    # ------------------------------------------------------------- audit
    AuditEventSummary:
      type: object
      required: [id, occurredAt, actorId, actorEmail, actorDisplayName, actorAuthMethod, sourceIp, capability, clusterId, clusterDisplayName, outcome, action, detailsSummary]
      description: Mirrors `auditEventSummary` exactly. Raw `details`/`scope` are NOT included here — only on AuditEventDetail — matching Incident/IncidentDetail's split.
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        actorId: { type: [string, 'null'] }
        actorEmail: { type: [string, 'null'] }
        actorDisplayName: { type: [string, 'null'] }
        actorAuthMethod: { type: string }
        sourceIp: { type: [string, 'null'] }
        capability: { type: [string, 'null'], description: Null for a system-raised event with no human capability exercised. }
        clusterId: { type: [string, 'null'] }
        clusterDisplayName: { type: [string, 'null'] }
        outcome: { type: string, enum: [success, denied, error] }
        action:
          type: string
          description: Prefers the write path's own action name, falls back to capability. Empty string for the rare row supporting neither — render an em dash.
        detailsSummary: { type: string, description: 'A short "key=value, key=value" digest. Never carries a raw secret value.' }

    AuditEventsResponse:
      type: object
      required: [auditEvents]
      properties:
        auditEvents: { type: array, items: { $ref: '#/components/schemas/AuditEventSummary' } }
        nextCursor: { type: string }

    AuditEventDetail:
      description: '`GET /audit-events/{id}` — AuditEventSummary plus the raw structured payload and this row''s own hash-chain fields.'
      allOf:
        - { $ref: '#/components/schemas/AuditEventSummary' }
        - type: object
          required: [scope, details, prevHash, hash]
          properties:
            scope: { type: [object, 'null'], additionalProperties: true }
            details:
              type: [object, 'null']
              additionalProperties: true
              description: Never render through raw HTML injection — plain text/JSON only, same rule as Finding.message.
            prevHash: { type: string }
            hash: { type: string, description: This row's own chain hash — lets an admin spot-check linkage without running `argusctl audit verify`. }

    AuditEventExportRow:
      type: object
      required: [id, occurredAt, actorId, actorEmail, actorDisplayName, actorAuthMethod, sourceIp, capability, scope, clusterId, clusterDisplayName, outcome, action, detailsSummary, details, prevHash, hash]
      description: |
        The export's flattened row shape — ALL fields are plain strings, `""` replacing
        every null (unlike the list/detail JSON shapes, which use real `null`). Includes
        BOTH the raw `details`/`scope` (as JSON text) AND `detailsSummary` together.
      properties:
        id: { type: string }
        occurredAt: { type: string }
        actorId: { type: string }
        actorEmail: { type: string }
        actorDisplayName: { type: string }
        actorAuthMethod: { type: string }
        sourceIp: { type: string }
        capability: { type: string }
        scope: { type: string, description: Compact JSON text. }
        clusterId: { type: string }
        clusterDisplayName: { type: string }
        outcome: { type: string }
        action: { type: string }
        detailsSummary: { type: string }
        details: { type: string, description: Compact JSON text. }
        prevHash: { type: string }
        hash: { type: string }

    # -------------------------------------------------------------- admin
    AutomationWindow:
      type: object
      required: [id, kind, schedule, durationSeconds, timezone, createdAt, openNow, upcoming]
      description: |
        A **freeze** window, if open, blocks automation unconditionally. A **maintenance**
        window is a PERMISSION — an empty maintenance list means no time restriction, never
        "nothing permitted". `schedule` is a 5-field cron naming the window's START, not
        "when it applies" — `durationSeconds` extends it. `openNow` is evaluated
        server-side so the UI cannot disagree with the sweeper that actually decides.
      properties:
        id: { type: string }
        kind: { type: string, enum: [maintenance, freeze] }
        schedule: { type: string }
        durationSeconds: { type: integer }
        timezone: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        openNow: { type: boolean }
        invalidReason:
          type: string
          description: Set when a stored window cannot be evaluated. A malformed FREEZE is treated as in force (fail-blocking), so this must be visible.
        upcoming:
          type: array
          description: When this window is open over the next 90 days, earliest first, at most 40 intervals, from the same matching rule as `openNow`. Empty when the window cannot be evaluated.
          items:
            type: object
            required: [start, end]
            properties:
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }

    AutomationWindowsResponse:
      type: object
      required: [windows, automationOpenNow, decisionReason]
      properties:
        windows: { type: array, items: { $ref: '#/components/schemas/AutomationWindow' } }
        automationOpenNow:
          type: boolean
          description: Whether automation would run right now, answered by the same code the sweeper uses — not a second cron implementation in the client.
        decisionReason: { type: string }

    CreateAutomationWindowRequest:
      type: object
      required: [kind, schedule, durationSeconds]
      properties:
        kind: { type: string, enum: [maintenance, freeze] }
        schedule: { type: string }
        durationSeconds: { type: integer }
        timezone: { type: string, description: 'Defaults to "UTC" if empty.' }
        reason: { type: string }

    CircuitBreakerTrip:
      type: object
      required: [id, fleetWide, trippedAt, reason, badOutcomes, threshold]
      properties:
        id: { type: string }
        clusterId: { type: string }
        clusterName: { type: string }
        fleetWide: { type: boolean, description: A fleet-wide trip carries no cluster and stops unattended execution everywhere. }
        trippedAt: { type: string, format: date-time }
        reason: { type: string }
        badOutcomes: { type: integer }
        threshold: { type: integer }
        resetAt:
          type: string
          format: date-time
          description: Absent while the trip is OPEN — reset is manual by design, so this field is what separates "needs someone to look" from history.
        resetByEmail: { type: string }
        resetNote: { type: string }

    CircuitBreakerResponse:
      type: object
      required: [enabled, maxPerCluster, maxFleetWide, windowSeconds, open, history]
      description: |
        Bounds unattended execution on OUTCOME — distinct from automation windows (time)
        and blast-radius caps (volume); none of the three substitutes for another. A
        breaker STAYS tripped until manually reset, unlike a blast-radius cap.
      properties:
        enabled: { type: boolean }
        maxPerCluster: { type: integer }
        maxFleetWide: { type: integer }
        windowSeconds: { type: integer }
        open: { type: array, items: { $ref: '#/components/schemas/CircuitBreakerTrip' } }
        history: { type: array, items: { $ref: '#/components/schemas/CircuitBreakerTrip' } }

    # ---------------------------------------------------------- changes
    ChangeUndo:
      type: object
      required: [available]
      description: |
        Whether this change can be undone, and — when it cannot — the same refusal
        `POST /executions/{id}/rollback` would return, because both come from
        `checkUndoable` (internal/api/rollback.go).

        `available: true` is not a promise the undo will succeed: three of the rollback
        path's refusals (the field has moved since, the change is already gone, the agent
        is disconnected) can only be evaluated against the live cluster at request time.
      properties:
        available: { type: boolean }
        executionId:
          type: string
          description: What `POST /executions/{id}/rollback` takes. Present only when `available`.
        description:
          type: string
          description: What undoing would do, in the words captured off the live object before the forward change.
        reason: { type: string, description: 'Short refusal title. Present only when `available` is false.' }
        detail: { type: string, description: 'The full refusal, written for an operator. Present only when `available` is false.' }

    Change:
      type: object
      required: [id, kind, status, clusterId, clusterName, incidentId, summary, unattended, undo]
      description: |
        One row on the changes feed. Kind-specific fields are absent rather than
        zero-valued: a pull request has no `outcome`, an in-place patch has no `filePaths`.

        `status` is the field to branch on, not `kind`. `kind` says which channel
        (`inPlace`/`pullRequest`); `status` says whether the cluster actually changed.
        A `pullRequest` row covers both a merged change (`landed`) and an open proposal
        (`proposed`), which are opposite answers to the question this feed exists to ask,
        so nothing here may be rendered as applied, merged, undoable or attributed to an
        applier without checking it.
      properties:
        id:
          type: string
          description: |
            A stable list key, not an addressable resource id — the execution's own id for
            `inPlace`, and `pr:<incidentId>` for `pullRequest`, which has no row of its own.
        kind: { type: string, enum: [inPlace, pullRequest] }
        status:
          type: string
          enum: [landed, proposed]
          description: |
            `landed` — the cluster changed. An in-place execution is always landed, INCLUDING
            a failed one: it reached the cluster and `outcome` says how it went.
            `proposed` — ARGUS opened a pull request and the cluster has NOT changed. Only an
            open pull request is ever proposed. A pull request closed unmerged is on neither
            list; it changed nothing and is waiting on nobody.
        changedAt:
          type: string
          format: date-time
          description: |
            `remediation_executions.executed_at`, or `incidents.pr_merged_at` — in both cases
            the moment the cluster actually changed. ABSENT when `status` is `proposed`,
            because no such moment exists yet; use `proposedAt` there. Exactly one of the two
            is present on every row.
        proposedAt:
          type: string
          format: date-time
          description: |
            When the pull request was opened (`incidents.pr_opened_at`). Present when `status`
            is `proposed`. Absent on a landed row — a merged pull request's opened-at belongs
            to its incident, and repeating it here would invite reading one column as two
            different meanings of "when it happened".
        clusterId: { type: string }
        clusterName: { type: string }
        incidentId: { type: string }
        summary: { type: string, description: 'Plain language, from the same renderer the approval queue uses. Never a raw action type.' }
        targetGvk:
          type: string
          description: |
            The workload, on BOTH kinds. For an in-place change it is the object that was
            patched; for a repository change it is the OpenPR recommendation's target — the
            logical object the pull request changes — read from the same
            `remediation_recommendations.target_*` columns, which is what makes the two
            symmetric. Deliberately not the incident's `object_key`, which is what the
            FINDING was on (typically an ephemeral Pod), not what the merged files declare.
            Absent on a repository change with no OpenPR recommendation recorded, which is
            the self-service route's normal case.
        targetNamespace: { type: string, description: 'See `targetGvk`.' }
        targetName: { type: string, description: 'See `targetGvk`.' }
        outcome: { type: string, enum: [succeeded, failed, unknown], description: 'In-place only.' }
        error: { type: string, description: 'In-place only, and only when the execution failed or could not be confirmed.' }
        pullRequestNumber: { type: integer, description: 'Pull request only. Merged or open — check `status`.' }
        pullRequestUrl: { type: string, description: 'Pull request only. On a `proposed` row this is where the operator has to go to merge it.' }
        filePaths:
          type: array
          items: { type: string }
          description: |
            Pull request only, and absent for one opened before migration 000075 recorded
            them. Paths only — the stored column also holds each file's whole content,
            which this list has no use for.
        unattended: { type: boolean, description: 'Applied by the unattended executor with no human decision behind it. Always false for a pull request — a merge is a human act in the provider, and an open one has not been applied at all.' }
        actorEmail:
          type: string
          description: |
            The approver. Absent when none is recorded, which is the normal case for a pull
            request opened through the self-service repository-change route — that path
            records its actor in the audit chain rather than as an approval decision.
        undo: { $ref: '#/components/schemas/ChangeUndo' }

    ChangesResponse:
      type: object
      required: [changes, windowHours, limit, truncated, hasAnyChanges]
      properties:
        changes: { type: array, items: { $ref: '#/components/schemas/Change' } }
        windowHours: { type: integer }
        limit: { type: integer }
        truncated: { type: boolean, description: 'More changes exist in this window than `limit`. The count shown beside the list has to say so.' }
        hasAnyChanges:
          type: boolean
          description: |
            Has this feed ever had anything on it at all, ignoring BOTH the window and the
            cluster filter — so an empty list can be rendered as "nothing yet", "nothing in
            this window" or "nothing on this cluster" rather than one vague message. Counts
            open pull requests too: a screen that says ARGUS has never done anything while
            rendering a proposal underneath it would be contradicting itself.

    # ------------------------------------------------- repository changes
    RepositoryFileResponse:
      type: object
      description: One file's current, unedited content at the commit the GitOps controller reports synced.
      required: [incidentId, repository, filePath, filePathSource, filesScanned, syncedRevision, content]
      properties:
        incidentId: { type: string }
        repository: { type: string, description: 'The repository URL resolved from the incident''s ownership, not from the request.' }
        filePath: { type: string, description: 'Repository-relative. Echoed when the caller named it; the located one otherwise.' }
        filePathSource:
          type: string
          description: |
            `named_by_caller`, `located_by_argus`, or `located_by_argus_via_<source>` when
            the object identity was parsed out of the incident's own sync-failure message
            rather than read off a live object. The three carry different responsibility
            and a UI may render them differently; the audit record keeps the same fact.
        filesScanned: { type: integer, description: 'How many YAML files were read to locate this one. 0 when the caller named it.' }
        syncedRevision: { type: string, description: 'The pinned commit the content was read at — what the controller reports applied, never a branch head.' }
        content: { type: string, description: 'The whole file, verbatim.' }

    RepositoryChangeFile:
      type: object
      description: |
        One file's WHOLE proposed content. Not a diff and not a patch — the field-and-value
        grammar was removed because it could express only a small fraction of the fixes
        this channel exists for.
      required: [path, content]
      properties:
        path:
          type: string
          description: |
            Repository-relative. A request, never an authorisation: it is confined to the
            synced directory and checked against the forbidden-path denylist before
            anything is read or written.
        content:
          type: string
          description: |
            The whole file exactly as it should read after the change. A file that does not
            exist at the synced commit is created. Must be empty when `delete` is true.
        delete:
          type: boolean
          description: |
            Remove `path` from the repository entirely instead of writing `content`. A
            distinct field rather than empty content, so "make this file empty" and "delete
            this file" stay different requests.

    RepositoryChangeRequest:
      type: object
      description: |
        The proposed change. The repository, the directory and the commit are deliberately
        NOT in it — they come from the incident's stored ownership.
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RepositoryChangeFile' }
        reason:
          type: string
          description: |
            Why the change is being made, quoted into the pull request body. Optional; when
            absent the incident's own analysis supplies it if it has a root cause statement.

    RepositoryChangeFileResult:
      type: object
      description: One file's outcome. `unchanged` files are reported and NOT committed.
      required: [path, created, deleted, unchanged, diff, linesAdded, linesRemoved, lineCount, documentCount, parsed, checks, advisories]
      properties:
        path: { type: string }
        created: { type: boolean, description: The file did not exist at the synced commit. }
        deleted: { type: boolean, description: This change REMOVES the file rather than writing it. }
        unchanged:
          type: boolean
          description: |
            The submitted content already matched the file. Reported and not committed — an
            operator who opened three files and edited one is a normal thing to submit.
        diff: { type: string, description: Unified diff against the file at the pinned synced commit. }
        linesAdded: { type: integer }
        linesRemoved: { type: integer }
        lineCount: { type: integer }
        documentCount: { type: integer, description: YAML documents in the proposed content. }
        parsed: { type: boolean, description: 'Whether ARGUS could parse the content as YAML. False is not a refusal for a templated file — see `advisories`.' }
        checks: { type: array, items: { type: string }, description: 'What ARGUS checked and established, in words.' }
        advisories:
          type: array
          items: { type: string }
          description: |
            The things a reviewer must check because ARGUS could NOT: a templated file it
            did not render, a changed document count, an object identity that moved. A
            client MUST render these next to the diff.

    RepositoryChangeVerification:
      type: object
      description: |
        What ARGUS checked, per file and in aggregate. Identical in shape on the preview
        and on the opened pull request, because the same code computes both.
      required: [files, filesChanged, linesAdded, linesRemoved, checks, advisories, label, caveat]
      properties:
        files: { type: array, items: { $ref: '#/components/schemas/RepositoryChangeFileResult' } }
        filesChanged: { type: integer, description: 'Entries actually being committed — `unchanged` ones are excluded.' }
        linesAdded: { type: integer }
        linesRemoved: { type: integer }
        checks: { type: [array, 'null'], items: { type: string }, description: 'Aggregate of the per-file checks, prefixed with the file they came from when there is more than one.' }
        advisories: { type: [array, 'null'], items: { type: string }, description: 'Aggregate of the per-file advisories, prefixed the same way.' }
        label: { type: string, description: 'The verification label, also applied to the pull request (`argus/verified-locally`).' }
        caveat:
          type: string
          description: |
            What that label withholds, in the same words the pull request body carries. A
            whole-file change makes no "only this moved" claim at all — never render the
            label without it.

    RepositoryChangePreviewResponse:
      type: object
      description: What a pull request WOULD contain. Nothing was branched, committed or opened.
      required: [incidentId, repository, syncedRevision, baseBranch, branch, verification, renderEvidence]
      properties:
        incidentId: { type: string }
        repository: { type: string }
        syncedRevision: { type: string }
        baseBranch: { type: string, description: What the pull request would merge into. }
        branch:
          type: string
          description: |
            The branch the change WOULD be opened on, so a client can warn about an
            existing one before the operator commits to anything.
        verification: { $ref: '#/components/schemas/RepositoryChangeVerification' }
        renderEvidence: { $ref: '#/components/schemas/RenderEvidence' }

    RenderEvidence:
      type: object
      description: |
        Whether ARGUS rendered the chart or overlay and compared the result, so "is this an
        effective change" is answered on the diff a human reviews BEFORE approving, not
        only afterwards. The same map shape the audit and timeline records carry, reused
        rather than re-typed so the surfaces cannot disagree.

        Three states: `{"attempted": false}`; `{"attempted": true, "degraded": "..."}` when
        it was tried and could not produce a usable answer — including, deliberately,
        whenever the source is a Helm chart with no values-file list available, since a
        defaults-only render cannot confirm the real deployed configuration; or an
        attempted, non-degraded answer carrying `rendererKind`, `effective`,
        `objectsCompared`, `objectsChanged` and `summary`.
      required: [attempted]
      properties:
        attempted: { type: boolean }
        degraded: { type: string }
        rendererKind: { type: string }
        effective: { type: boolean, description: 'Whether the change actually alters what the cluster would receive. Absent when `degraded` is set — never infer `false` from its absence.' }
        objectsCompared: { type: integer }
        objectsChanged: { type: integer }
        summary: { type: string }

    RepositoryChangeResponse:
      type: object
      description: |
        The opened pull request. Verbose on purpose: the per-file diff and the advisories
        are the product here, and a client that only showed "PR opened" would throw away
        the part that makes the pull request reviewable.
      required: [incidentId, repository, pullRequestNumber, url, branch, baseBranch, commitSha, commits, syncedRevision, verification, message]
      properties:
        incidentId: { type: string }
        repository: { type: string }
        pullRequestNumber: { type: integer }
        url: { type: string }
        branch: { type: string }
        baseBranch: { type: string }
        commitSha: { type: string, description: The branch head. }
        commits: { type: [array, 'null'], items: { type: string }, description: One SHA per file committed. }
        syncedRevision: { type: string, description: 'The commit the files were READ at — what the controller reports applied, not the branch head.' }
        verification: { $ref: '#/components/schemas/RepositoryChangeVerification' }
        warning:
          type: string
          description: |
            Set when the pull request exists but something non-fatal did not (today, only a
            labelling failure). Non-empty means "read this", not "it failed".
        message: { type: string, description: 'States plainly that nothing in the cluster has changed yet.' }

    # --------------------------------------------------- repository links
    LinkCandidate:
      type: object
      description: One registered repository (and chart path) that renders this incident's live object.
      required: [bindingId, repoUrl, chartPath]
      properties:
        bindingId: { type: string }
        repoUrl: { type: string }
        chartPath: { type: string }
        valuesFile: { type: string }

    OtherClusterRunningRelease:
      type: object
      description: |
        A cluster ARGUS's OWN incident history records the identical Helm release and
        namespace on — not a live fleet inventory, which does not exist. A cluster running
        the release with no incidents ever recorded is genuinely unknown here, and a
        "widen this link" control must never claim otherwise.
      required: [clusterId, clusterDisplayName]
      properties:
        clusterId: { type: string }
        clusterDisplayName: { type: string }

    DiscoverRepositoryLinkResponse:
      type: object
      required: [status, candidates, mode, releaseName, namespace, objectGvk, objectNamespace, objectName, otherClusters]
      properties:
        status:
          type: string
          enum: [proven, ambiguous, none, degraded, declined]
          description: |
            `proven` — exactly one candidate; pre-fill it. `ambiguous` — two or more
            registered repositories genuinely render the same object (a monorepo and a
            split repo, a fork, dev/prod overlays): present every one, pick none. `none` —
            nothing rendered the object and every attempted render completed, a real,
            honest negative (a third-party chart looks like this). `degraded` — rendering
            could not be attempted or every attempt failed, which tells ARGUS NOTHING
            about whether the repository produces the object, and is never conflated with
            `none`. `declined` — somebody already said don't ask about this identity.
        candidates: { type: [array, 'null'], items: { $ref: '#/components/schemas/LinkCandidate' } }
        degraded: { type: string, description: 'Why rendering could not answer, present only with `status: "degraded"`.' }
        mode:
          type: string
          enum: [helm, manifest]
          description: |
            Which identity shape this ran against. The two differ in what gets rendered and
            in what a confirmed mapping is keyed on — a release name and namespace, or the
            object's own labels as the cluster reported them.
        releaseName: { type: string, description: 'Set for `helm` only; empty string in `manifest` mode, which has no release identity at all.' }
        namespace: { type: string, description: 'The release namespace. Set for `helm` only.' }
        objectGvk: { type: string, description: 'Always set, in both modes — `apiVersion/Kind`.' }
        objectNamespace: { type: string }
        objectName: { type: string }
        otherClusters:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/OtherClusterRunningRelease' }
          description: |
            Helm mode only, and best-effort: empty (or absent) also means the lookup failed
            and the candidate result was returned anyway. Manifest mode never offers a
            widen option, because there is no release identity to widen by.

    ConfirmRepositoryLinkRequest:
      type: object
      description: |
        The three things the operator actually states. The release/namespace or label
        selector is re-read from the incident's own ownership and can never be named here.
      required: [bindingId, path]
      properties:
        bindingId: { type: string, description: Which registered repository binding to add the mapping to. }
        path: { type: string, description: Where inside that repository this object's configuration lives. }
        scope:
          allOf: [ { $ref: '#/components/schemas/GrantScope' } ]
          description: |
            Omit entirely to get the default — `Cluster`, on this incident's own cluster.
            Narrow is the safe default; widening is an explicit act.

    # ------------------------------------------------- promotion reconcile
    PromotionReconcileRequest:
      type: object
      properties:
        apply:
          type: boolean
          description: |
            Must be explicitly true to change anything. The zero value is a preview, so a
            caller who forgets the field gets the safe behaviour.
        note:
          type: string
          maxLength: 2000
          description: Required when `apply` is true, and recorded in the audit chain with the closed incident ids.
        limit:
          type: integer
          description: 'Caps how many candidates are acted on and listed. Defaults to (and is capped at) 500; `truncated` says when more exist.'
      example: { apply: false }

    PromotionReconcileIncident:
      type: object
      description: One candidate's evidence summary — enough to check the verdict rather than trust the count.
      required: [incidentId, clusterId, state, firstSeen, findings, findingReasons, closed]
      properties:
        incidentId: { type: string }
        clusterId: { type: string }
        state: { type: string }
        openingReason: { type: string, description: 'The finding reason that opened the incident, when one is recorded.' }
        firstSeen: { type: string, format: date-time }
        findings: { type: integer, description: 'Finding rows attached to this incident. Every one still exists after an applied run.' }
        findingReasons: { type: [array, 'null'], items: { type: string }, description: 'The distinct reasons across those findings, sorted.' }
        closed: { type: boolean, description: 'False in a dry run, and false in an applied run for an incident that was skipped.' }
        skipReason: { type: string, description: 'Why this candidate was skipped — another writer owns it, or there is no legal transition to `Expired`.' }

    PromotionReconcileResponse:
      type: object
      required: [applied, incidentsWithFindings, candidates, closed, skippedInProgress, findingsRetained, truncated, incidents, message]
      properties:
        applied: { type: boolean, description: Echoes the request. False means nothing was changed. }
        incidentsWithFindings:
          type: integer
          description: |
            How many open incidents the scan considered. An open incident with no findings
            at all is not in it and is never a candidate — an empty history is not a
            non-promotable one.
        candidates: { type: integer, description: Open incidents whose entire finding history today's boundary would not promote. }
        closed: { type: integer }
        skippedInProgress: { type: integer }
        findingsRetained:
          type: integer
          description: |
            Finding rows attached to the incidents listed below. Every one of them still
            exists; this endpoint never deletes or rewrites a finding, and reports this
            count so that is checkable rather than asserted.
        truncated: { type: boolean, description: 'More candidates exist than `limit`.' }
        incidents: { type: array, items: { $ref: '#/components/schemas/PromotionReconcileIncident' } }
        message: { type: string, description: 'What was, or would be, done — in words, including the re-send instruction after a dry run.' }

    # ------------------------------------------------------------ rollback
    RollbackRequest:
      type: object
      description: |
        Acknowledgements only — every field is optional, and an empty body is a valid
        request. Each flag answers one specific refusal and must not be sent pre-emptively.
      properties:
        confirmScaleFromZero: { type: boolean, description: 'Answers `.../scale-from-zero-refused`: putting a workload back to zero replicas is still scaling to zero.' }
        confirmGitOpsManaged: { type: boolean, description: 'Answers `.../gitops-managed-refused`: undoing a patch on a GitOps-managed object is still a change the next sync reverts.' }
        confirmationToken: { type: string, description: Echoed back from the guardrail refusal that asked for it — the boolean alone no longer proves the refusal was shown. }
        confirmValueChanged:
          type: boolean
          description: |
            Answers `.../undo-value-changed`. A separate admission from the two above: not
            "I know this is a stop-gap" but "I know I am about to overwrite a value
            somebody else set". Recorded in the audit trail.

    RollbackResponse:
      type: object
      required: [executionId, incidentId, incidentState, undid, message]
      properties:
        executionId: { type: string }
        incidentId: { type: string }
        incidentState:
          type: string
          description: |
            Where the incident landed. EMPTY when the outcome could not be committed — the
            undo happened, the attempt row is still open, and the recovery sweep will
            finish it. Render the absence; never print a state of `""`.
        undid: { type: string, description: 'The compensating action in words, as it was recorded at the original execution.' }
        message: { type: string, description: 'Includes the standing caveat: an undo removes a fix, it does not re-diagnose the problem, which is still there.' }

    # -------------------------------------------------- detection dry-run
    DetectionDryRunOutcome:
      type: object
      description: A created/suppressed tally, used for both what actually happened and what the candidate would have done.
      required: [createdCount, suppressedCount]
      properties:
        createdCount: { type: integer }
        suppressedCount: { type: integer }

    DetectionDryRunFilterBucket:
      type: object
      required: [clusterId, clusterName, detectorId, findingCount, filteredUnderCandidate]
      properties:
        clusterId: { type: string }
        clusterName: { type: string }
        detectorId: { type: string }
        findingCount: { type: integer }
        filteredUnderCandidate: { type: boolean }

    DetectionDryRunFilterResult:
      type: object
      description: |
        How many of the window's real findings would never have reached correlation at all
        under the candidate's `disabledDetectorIds` — no findings row, no incident touched,
        exactly the hub-side filter the live path applies.
      required: [filteredCount, byClusterDetector]
      properties:
        filteredCount: { type: integer }
        byClusterDetector: { type: array, items: { $ref: '#/components/schemas/DetectionDryRunFilterBucket' } }

    DetectionDryRunStormBucket:
      type: object
      required: [clusterId, clusterName, detectorId, opportunities, actual, candidate, newlySuppressedCount, newlyAllowedCount]
      properties:
        clusterId: { type: string }
        clusterName: { type: string }
        detectorId: { type: string }
        opportunities: { type: integer }
        actual: { $ref: '#/components/schemas/DetectionDryRunOutcome' }
        candidate: { $ref: '#/components/schemas/DetectionDryRunOutcome' }
        newlySuppressedCount: { type: integer }
        newlyAllowedCount: { type: integer }

    DetectionDryRunStormResult:
      type: object
      required: [candidateConfigured, eligibleOpportunities, actual, candidate, newlySuppressedCount, newlyAllowedCount, byClusterDetector]
      properties:
        candidateConfigured: { type: boolean, description: Whether the candidate sets a storm-protection ceiling at all. }
        eligibleOpportunities:
          type: integer
          description: |
            "Would this finding open a brand new incident" decisions whose detector is NOT
            among the candidate's `disabledDetectorIds`. One whose detector IS disabled is
            counted once, in `disabledDetectorFilter`, and excluded here entirely — under
            the candidate it never arrives, so it never faces a storm decision either.
        actual: { $ref: '#/components/schemas/DetectionDryRunOutcome' }
        candidate: { $ref: '#/components/schemas/DetectionDryRunOutcome' }
        newlySuppressedCount: { type: integer, description: 'Opportunities the candidate would suppress that reality created — what a "N incidents would have been suppressed instead" narrative reads.' }
        newlyAllowedCount: { type: integer, description: The other direction. }
        byClusterDetector: { type: array, items: { $ref: '#/components/schemas/DetectionDryRunStormBucket' } }

    DetectionDryRunResponse:
      type: object
      required: [windowDays, windowStart, generatedAt, totalFindingsInWindow, disabledDetectorFilter, stormProtection]
      properties:
        windowDays: { type: integer }
        windowStart: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        totalFindingsInWindow: { type: integer }
        disabledDetectorFilter: { $ref: '#/components/schemas/DetectionDryRunFilterResult' }
        stormProtection: { $ref: '#/components/schemas/DetectionDryRunStormResult' }

    DetectionSettingsRequest:
      type: object
      description: |
        The `detection` section of the settings tree, and — verbatim, same type, same
        validation function — the body of `POST /detection/dry-run`.

        An absent key and an explicit `null` are not distinguished: both mean "nothing
        disabled" for the two id lists. The two storm-protection numbers must be set
        together or both left null; a threshold with no window would never apply.
      properties:
        disabledDetectorIds:
          type: [array, 'null']
          items: { type: string }
          description: 'Rejected unless every entry is a known detector id (`k8s-warning-events`, `k8s-pod-conditions`, `k8s-sweep`) and no entry repeats.'
        disabledRuleIds:
          type: [array, 'null']
          items: { type: string }
          description: Rule-level control, validated against the known rule ids the same way.
        stormProtectionMaxNewIncidents: { type: [integer, 'null'], description: 'Positive, or null to disable storm protection.' }
        stormProtectionWindowSeconds: { type: [integer, 'null'], description: 'Positive seconds, or null to disable storm protection.' }

    # ------------------------------------------------------------ analytics
    IssueClassSummary:
      type: object
      description: One recurring issue class — incidents grouped by fingerprint, ranked by count.
      required: [fingerprint, sampleGvk, sampleNamespace, sampleObjectName, sampleReason, incidentCount, clusterCount, totalOccurrences, firstSeen, lastSeen]
      properties:
        fingerprint: { type: string }
        sampleGvk: { type: string }
        sampleNamespace: { type: [string, 'null'] }
        sampleObjectName: { type: [string, 'null'] }
        sampleReason: { type: [string, 'null'] }
        incidentCount: { type: integer }
        clusterCount: { type: integer, description: How many distinct clusters this class has been seen on. }
        totalOccurrences: { type: integer }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }

    NoisyNamespaceSummary:
      type: object
      required: [namespace, findingCount, incidentCount, clusterCount]
      properties:
        namespace: { type: string }
        findingCount: { type: integer }
        incidentCount: { type: integer }
        clusterCount: { type: integer }

    NewNoisyNamespaceSummary:
      type: object
      description: 'As `NoisyNamespaceSummary`, plus `firstSeen` — "since when" is the fact that answers "how new is this".'
      required: [namespace, findingCount, incidentCount, clusterCount, firstSeen]
      properties:
        namespace: { type: string }
        findingCount: { type: integer }
        incidentCount: { type: integer }
        clusterCount: { type: integer }
        firstSeen: { type: string, format: date-time }

    UnstableClusterSummary:
      type: object
      required: [clusterId, clusterDisplayName, totalIncidents, reopenedOrFailedCount, openCount]
      properties:
        clusterId: { type: string }
        clusterDisplayName: { type: string }
        totalIncidents: { type: integer }
        reopenedOrFailedCount: { type: integer }
        openCount: { type: integer }

    InvestigationOutcomes:
      type: object
      description: |
        Whether the investigation loop is actually reaching conclusions. "Complete" means it
        concluded with a real root cause and confidence; "partial" means a bound (max
        iterations, time limit) was hit first.
      required: [totalAnalyses, completeCount, partialCount, completeRate, avgIterations]
      properties:
        totalAnalyses: { type: integer }
        completeCount: { type: integer }
        partialCount: { type: integer }
        completeRate:
          type: [number, 'null']
          description: |
            NULL, never a fabricated 0, when `totalAnalyses` is 0: "0 of 0 investigations
            reached a conclusion" is undefined and "0 of 40 did" is a genuinely bad rate,
            and collapsing them into the same number loses the distinction.
        avgIterations: { type: [number, 'null'], description: 'Tool-calling round-trips per investigation. NULL on no data, for the same reason.' }

    DailyTrendPoint:
      type: object
      description: One UTC day. Zero-filled for a day with no analyses, so a sparkline has no gaps.
      required: [day, investigations, totalTokens]
      properties:
        day: { type: string, description: '`YYYY-MM-DD`, UTC.' }
        investigations: { type: integer }
        totalTokens: { type: integer }

    CostAndTokensSummary:
      type: object
      required: [totalInvestigations, avgTokensBilledIn, avgTokensCacheRead, avgTokensOut, totalCostUsd, unmeasuredCostCount, costTrackingNote, dailyTrend]
      properties:
        totalInvestigations: { type: integer }
        avgTokensBilledIn: { type: number }
        avgTokensCacheRead: { type: number }
        avgTokensOut: { type: number }
        totalCostUsd: { type: number, description: Covers ONLY analyses whose cost was actually measured. }
        unmeasuredCostCount:
          type: integer
          description: |
            How many analyses are excluded because their provider cannot report a
            per-investigation cost (a subscription-billed CLI run). Reported rather than
            folded in as zero, so a UI can say "plus N with no cost data" instead of
            implying the total is complete.
        costTrackingNote: { type: string, description: The API's own sentence explaining what the number above does and does not cover. }
        dailyTrend: { type: array, items: { $ref: '#/components/schemas/DailyTrendPoint' } }

    NotBuiltSection:
      type: object
      description: |
        A panel that is deliberately NOT computed, with the reason in prose. Render the
        reason; faking the chart with the data that does exist is what these entries exist
        to prevent.
      required: [id, label, reason]
      properties:
        id: { type: string }
        label: { type: string }
        reason: { type: string }

    InsightsResponse:
      type: object
      required: [generatedAt, issueClasses, noisyNamespaces, newIssueClasses, newNoisyNamespaces, newSignalWindowDays, unstableClusters, investigationOutcomes, costAndTokens, notBuilt]
      properties:
        generatedAt: { type: string, format: date-time }
        issueClasses: { type: array, items: { $ref: '#/components/schemas/IssueClassSummary' }, description: Top 10 by incident count over the requested window. }
        noisyNamespaces: { type: array, items: { $ref: '#/components/schemas/NoisyNamespaceSummary' } }
        newIssueClasses:
          type: array
          items: { $ref: '#/components/schemas/IssueClassSummary' }
          description: |
            Classes with NO history before `newSignalWindowDays` ago. A separate list from
            `issueClasses`, which keeps its own count-based ranking unchanged.
        newNoisyNamespaces: { type: array, items: { $ref: '#/components/schemas/NewNoisyNamespaceSummary' } }
        newSignalWindowDays:
          type: integer
          description: |
            The fixed lookback the two "new" lists use — carried on the payload rather than
            hardcoded in the UI, so the screen's caption and the query can never disagree.
            Independent of the `days` parameter.
        unstableClusters: { type: array, items: { $ref: '#/components/schemas/UnstableClusterSummary' } }
        investigationOutcomes: { $ref: '#/components/schemas/InvestigationOutcomes' }
        costAndTokens: { $ref: '#/components/schemas/CostAndTokensSummary' }
        notBuilt: { type: array, items: { $ref: '#/components/schemas/NotBuiltSection' } }

    RejectedRecommendationSummary:
      type: object
      description: |
        Recommendations grouped by (action type, target kind), kept only where at least one
        decision on the group was a rejection — which is what makes `rejectionRate` always
        computable rather than a division by zero.
      required: [actionType, targetGvk, recommendedCount, decidedCount, rejectedCount, rejectionRate, sampleRejectionReason, lastRejectedAt]
      properties:
        actionType: { type: string }
        targetGvk: { type: string }
        recommendedCount: { type: integer }
        decidedCount: { type: integer, description: 'How many of those a human actually decided. Never derive a rate from `recommendedCount`.' }
        rejectedCount: { type: integer }
        rejectionRate: { type: number, description: '`rejectedCount / decidedCount`.' }
        sampleRejectionReason: { type: [string, 'null'], description: 'One real rejection reason from the group, or null when none carried one.' }
        lastRejectedAt: { type: string, format: date-time }

    AutomationCandidateSummary:
      type: object
      description: |
        The narrow, honest definition: this exact (action, target kind, risk) combination
        already requires a human today, and every time it has come up the human agreed.
        `approvedCount == decidedCount` is the strongest form of that signal. It is NOT a
        confidence-bucketed recommendation — recommendations carry no confidence column.
      required: [actionType, targetGvk, riskLevel, decidedCount, approvedCount, rejectedCount, approvalRate, lastDecidedAt]
      properties:
        actionType: { type: string }
        targetGvk: { type: string }
        riskLevel: { type: string }
        decidedCount: { type: integer }
        approvedCount: { type: integer }
        rejectedCount: { type: integer }
        approvalRate: { type: number }
        lastDecidedAt: { type: string, format: date-time }

    RemediationQualityResponse:
      type: object
      required: [generatedAt, frequentlyRejected, automationCandidates]
      properties:
        generatedAt: { type: string, format: date-time }
        frequentlyRejected: { type: array, items: { $ref: '#/components/schemas/RejectedRecommendationSummary' } }
        automationCandidates: { type: array, items: { $ref: '#/components/schemas/AutomationCandidateSummary' } }

    SpendTodayResponse:
      type: object
      required: [generatedAt, date, todaySpendUsd, pricingConfigured, spendCountable, dailySpendCeilingUsd, ceilingBreached, ceilingEnforceable]
      properties:
        generatedAt: { type: string, format: date-time }
        date: { type: string, description: 'The UTC day this covers, `YYYY-MM-DD`. The day boundary is UTC, not the viewer''s.' }
        todaySpendUsd:
          type: number
          description: |
            Sum of METERED analysis cost for today only. Analyses whose provider cannot
            report a per-investigation cost are excluded, never counted as zero — read
            `spendCountable` before presenting this as a total.
        pricingConfigured: { type: boolean, description: 'Whether per-token pricing is configured at all. Without it, measured cost is always 0 and means nothing.' }
        spendCountable: { type: boolean, description: 'Whether the ACTIVE provider can report per-investigation spend. False means this figure cannot be complete.' }
        dailySpendCeilingUsd: { type: [number, 'null'], description: 'The configured ceiling, or null when none is set.' }
        ceilingBreached: { type: boolean, description: 'Today''s spend has reached or passed the ceiling. Always false when no ceiling is active.' }
        ceilingEnforceable:
          type: boolean
          description: |
            Descriptive only — it does NOT gate enforcement. It can be false while
            `ceilingBreached` is true; a caller showing both must let "breached" win,
            because that is the one that actually stopped automatic investigation.

    DiagnosticsDetectorStatus:
      type: object
      description: Never renders a missing report as healthy or failing — `status` is explicitly `unknown` in that case.
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, failing, unknown] }
        lastSuccessAt: { type: string, format: date-time }
        error: { type: string }
        errorAt: { type: string, format: date-time }
        timedOutChecks:
          type: array
          items: { type: string }
          description: |
            Checks that did not answer in this detector's most recent pass. Unlike `error`
            it describes only that pass, so its absence means the last pass was complete
            (or that the agent predates the field) — never that nothing ever hung.
        deniedReads: { type: array, items: { type: string }, description: 'Resources the agent''s RBAC refused, which is a configuration fact rather than a fault.' }

    DiagnosticsDetectors:
      type: object
      required: [warningEvents, podConditions, sweep]
      properties:
        warningEvents: { $ref: '#/components/schemas/DiagnosticsDetectorStatus' }
        podConditions: { $ref: '#/components/schemas/DiagnosticsDetectorStatus' }
        sweep: { $ref: '#/components/schemas/DiagnosticsDetectorStatus' }

    DiagnosticsCluster:
      type: object
      required: [id, displayName, state]
      properties:
        id: { type: string }
        displayName: { type: string }
        state: { type: string }
        agentVersion: { type: string }
        lastHeartbeatAt: { type: string, format: date-time }
        factsUpdatedAt:
          type: string
          format: date-time
          description: |
            When the hub last received this cluster's facts — the age of everything in
            `detectors`. ABSENT when no inventory sync has ever completed; never a
            fabricated zero time.
        detectors:
          allOf: [ { $ref: '#/components/schemas/DiagnosticsDetectors' } ]
          description: |
            Absent when the agent's build predates detector-status reporting, or its facts
            have not synced. The two are indistinguishable on the wire and both mean "no
            detector data" — never "healthy" and never "failing".

    DiagnosticsAIProvider:
      type: object
      description: Configuration PRESENCE, never a value. `baseUrl`/`model`/`runnerUrl` name an endpoint and a model, not a credential.
      required: [id, name, kind, active, apiKeySet, runnerTokenSet, connectivityChecked]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        active: { type: boolean }
        apiKeySet: { type: boolean }
        runnerTokenSet: { type: boolean }
        baseUrl: { type: string }
        model: { type: string }
        runnerUrl: { type: string }
        connectivityChecked: { type: boolean, description: 'False unless the request asked for `?probe=true`; every field below is then absent.' }
        connectivityOk: { type: boolean }
        connectivityKind: { type: string }
        connectivitySummary: { type: string }
        connectivityDetail: { type: string }
        connectivityCaveat: { type: string, description: What the probe did NOT establish — a successful reachability check is not a successful investigation. }

    DiagnosticsRepository:
      type: object
      required: [id, provider, host, credentialStored, connectivityChecked]
      properties:
        id: { type: string }
        provider: { type: string }
        host: { type: string }
        credentialStored: { type: boolean, description: Whether a credential exists. Never the credential. }
        connectivityChecked: { type: boolean }
        connectivityOk: { type: boolean }
        connectivitySummary: { type: string }

    DiagnosticsInternalError:
      type: object
      description: One recent `outcome=error` audit row, reduced to the same action/summary shape `GET /audit-events` computes, so the two can never read differently.
      required: [occurredAt, summary]
      properties:
        occurredAt: { type: string, format: date-time }
        action: { type: string }
        capability: { type: string }
        clusterId: { type: string }
        summary: { type: string, description: Scrubbed of every collected secret value and then run through the bounded redaction pattern layer. }

    DiagnosticsMigration:
      type: object
      description: The applied migration state, read straight from `schema_migrations`.
      required: [dirty, known]
      properties:
        version: { type: integer }
        dirty: { type: boolean }
        known: { type: boolean, description: 'False when the table could not be read at all — distinguished from a real answer, never reported as version 0.' }
        error: { type: string }

    DiagnosticsOmission:
      type: object
      required: [field, reason]
      properties:
        field: { type: string }
        reason: { type: string }

    DiagnosticsManifest:
      type: object
      description: |
        What makes the bundle trustworthy: not just what is in it, but a stated account of
        what was deliberately left out and why.
      required: [included, omitted, truncated, bundleSizeBytes, maxBundleBytes]
      properties:
        included: { type: array, items: { type: string } }
        omitted: { type: array, items: { $ref: '#/components/schemas/DiagnosticsOmission' } }
        truncated: { type: boolean }
        bundleSizeBytes: { type: integer }
        maxBundleBytes: { type: integer }

    DiagnosticsBundle:
      type: object
      required: [generatedAt, hub, migration, clusters, clustersTruncated, aiProviders, aiProvidersTruncated, repositories, repositoriesTruncated, recentInternalErrors, recentInternalErrorsTruncated, probed, manifest]
      properties:
        generatedAt: { type: string, format: date-time }
        hub:
          type: object
          required: [version]
          properties:
            version: { type: string }
        migration: { $ref: '#/components/schemas/DiagnosticsMigration' }
        clusters: { type: array, items: { $ref: '#/components/schemas/DiagnosticsCluster' } }
        clustersTruncated: { type: boolean }
        aiProviders: { type: array, items: { $ref: '#/components/schemas/DiagnosticsAIProvider' } }
        aiProvidersTruncated: { type: boolean }
        repositories: { type: array, items: { $ref: '#/components/schemas/DiagnosticsRepository' } }
        repositoriesTruncated: { type: boolean }
        recentInternalErrors: { type: [array, 'null'], items: { $ref: '#/components/schemas/DiagnosticsInternalError' } }
        recentInternalErrorsTruncated: { type: boolean }
        probed: { type: boolean, description: 'Echoes whether `?probe=true` was asked for.' }
        manifest: { $ref: '#/components/schemas/DiagnosticsManifest' }

    # ------------------------------------------------------- administration
    Grant:
      type: object
      description: |
        One grant row — grant MANAGEMENT, as opposed to the resolved set
        `GET /users/me/effective-permissions` returns.
      required: [id, role, scope, grantedBy, grantedAt, expiresAt]
      properties:
        id: { type: string }
        role:
          type: string
          description: |
            A builtin role name or a custom role id. EMPTY for a pre-existing ad hoc
            capability-set grant — none are created through this API, but a row like that
            can already exist and must render rather than crash.
        scope: { $ref: '#/components/schemas/GrantScope' }
        grantedBy: { type: string }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time, description: 'Null means it does not expire.' }
        justification:
          type: string
          description: |
            The free-text reason the admin gave. Absent on grants created before this was
            collected — which is exactly the state that makes "why does this person have
            this access" unanswerable, so a review UI should say "not recorded" rather
            than leave the column blank.

    User:
      type: object
      description: One account plus its currently-active (non-revoked, non-expired) grants.
      required: [id, email, displayName, mustChangePassword, disabledAt, createdAt, grants]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        mustChangePassword: { type: boolean }
        disabledAt: { type: [string, 'null'], format: date-time, description: 'Null means enabled. A disabled account keeps its grants and its history.' }
        createdAt: { type: string, format: date-time }
        grants: { type: array, items: { $ref: '#/components/schemas/Grant' } }

    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
        displayName: { type: string }
        initialGrant:
          type: object
          description: 'Optional, applied atomically with the create — the common case is "make a user who can immediately do something".'
          required: [role]
          properties:
            role: { type: string }
            scope: { $ref: '#/components/schemas/GrantScope' }

    CreateUserResponse:
      type: object
      required: [user, temporaryPassword]
      properties:
        user: { $ref: '#/components/schemas/User' }
        temporaryPassword:
          type: string
          description: |
            Returned exactly once, here and nowhere else. Never logged and never in the
            audit record. The account must change it on first sign-in.

    CreateGrantRequest:
      type: object
      required: [role, scope]
      properties:
        role: { type: string, description: A builtin role name or a custom role id. }
        scope: { $ref: '#/components/schemas/GrantScope' }
        justification: { type: string, description: 'Optional, and the first thing an access review reads.' }

    UserLifecycleResponse:
      type: object
      description: The shared shape for disable/enable/remove — id plus the new status.
      required: [userId, status]
      properties:
        userId: { type: string }
        status: { type: string, enum: [disabled, enabled, removed] }

    CustomRole:
      type: object
      description: |
        A named bundle of EXISTING capabilities — never a new permission. Assigned through
        the same `POST /users/{id}/grants` a builtin role is.
      required: [id, name, capabilities, createdBy, createdAt]
      properties:
        id: { type: string }
        name: { type: string, description: Never one of the five builtin role names. }
        capabilities: { type: array, items: { type: string }, description: 'Every entry is a real, current capability from the catalogue.' }
        createdBy: { type: string, description: 'Empty on the response to `PUT /custom-roles/{id}`, which does not re-read the row.' }
        createdAt: { type: string, description: 'RFC 3339, and empty on the `PUT` response for the same reason.' }

    CreateCustomRoleRequest:
      type: object
      required: [name, capabilities]
      properties:
        name: { type: string }
        capabilities: { type: array, items: { type: string } }

    ClusterGroup:
      type: object
      description: |
        A named subset of the cluster inventory, existing to be the target of a
        `ClusterGroup`-scoped grant. Membership is explicit and audited, not a dynamic
        label-selector match.
      required: [id, name, clusterIds]
      properties:
        id: { type: string }
        name: { type: string }
        clusterIds: { type: array, items: { type: string } }

    IdentityGroupMapping:
      type: object
      required: [id, groupName, roleId]
      properties:
        id: { type: string }
        groupName: { type: string, description: The group name as the identity provider reports it in the groups claim. }
        roleId: { type: string, description: 'A builtin role name or a custom role id, checked to exist when the mapping is created.' }

    IdentityProvider:
      type: object
      description: One configured OIDC provider. The client secret is write-only over this API and appears nowhere below.
      required: [id, displayName, issuer, clientId, scopes, groupsClaim, redirectUri, enabled, hasClientSecret, groupMappings]
      properties:
        id: { type: string }
        displayName: { type: string, description: What the sign-in button says. }
        issuer: { type: string }
        clientId: { type: string }
        scopes: { type: [array, 'null'], items: { type: string } }
        groupsClaim: { type: string, description: Which claim carries group membership for the mappings below. }
        redirectUri: { type: string }
        enabled: { type: boolean, description: 'A provider can only be stored enabled if discovery against its issuer succeeded at write time.' }
        hasClientSecret: { type: boolean, description: 'Whether one is stored — never the secret. This is what lets a form render "leave blank to keep".' }
        groupMappings: { type: array, items: { $ref: '#/components/schemas/IdentityGroupMapping' } }

    SaveIdentityProviderRequest:
      type: object
      description: The create and the update body — the same shape, with the id in the path on an update.
      required: [displayName, issuer, clientId]
      properties:
        displayName: { type: string }
        issuer: { type: string }
        clientId: { type: string }
        scopes: { type: array, items: { type: string } }
        groupsClaim: { type: string }
        redirectUri: { type: string }
        enabled: { type: boolean, description: 'Setting this true triggers a discovery check BEFORE the row is written; a provider that cannot discover is rejected rather than stored broken.' }
        clientSecret:
          type: [string, 'null']
          description: |
            Three distinguishable cases: absent keeps what is stored, `""` makes this a
            public client, a value replaces it. A form that cannot read the secret back
            needs exactly that distinction.

    # ------------------------------------------------------------- settings
    LLMSettings:
      type: object
      required: [baseUrl, model, apiKeySet, providerKind, cliRunnerUrl, cliAgent, cliRunnerTokenSet, cliBackendAvailable]
      properties:
        baseUrl: { type: string }
        model: { type: string }
        apiKeySet: { type: boolean, description: Whether a key is stored. There is no path that returns it. }
        providerKind: { type: string, enum: [api, cli], description: 'Always concrete — the never-configured case normalises to `api`, so a client never interprets `""`.' }
        cliRunnerUrl: { type: string }
        cliAgent: { type: string }
        cliRunnerTokenSet: { type: boolean }
        cliBackendAvailable:
          type: boolean
          description: |
            Whether THIS hub can serve a `cli` provider at all — it needs an MCP listener,
            which is off by default. A `cli` provider can be configured perfectly and still
            be unusable; before this was reported, the failure appeared only on pressing
            Analyze, as an error blaming the base URL. A client must warn when a `cli`
            provider is active and this is false.

    NotifySettings:
      type: object
      required: [webhookConfigured]
      properties:
        webhookConfigured: { type: boolean, description: Whether a webhook URL is stored. The URL itself is treated as a secret and is not returned. }

    AnalysisSettings:
      type: object
      description: The investigation loop's own bounds — separate from `llm`, which is the provider connection.
      required: [maxIterations, timeLimitSeconds, effectiveMaxIterations, effectiveTimeLimitSeconds, retrievalEnabled]
      properties:
        maxIterations: { type: [integer, 'null'], description: 'The stored override. Null means "not configured", falling back to the env var and then a hardcoded default.' }
        timeLimitSeconds: { type: [integer, 'null'], description: Same null-means-consult-a-further-tier contract. }
        effectiveMaxIterations: { type: integer, description: 'What the very next analysis would actually use, whichever tier it came from. Render this as the hint beside a null.' }
        effectiveTimeLimitSeconds: { type: integer, description: 'The same, for the time budget.' }
        retrievalEnabled:
          type: boolean
          description: |
            No fallback tier exists for this one, so there is no `effective` pair. Defaults
            to false: retrieval measured 31% more expensive with no measurable confidence
            benefit on one real repeated fault, and an inconclusive result must not ship as
            an unconditional cost increase.

    AutomationSettings:
      type: object
      description: Whether a newly-detected incident is investigated without anyone pressing Analyze.
      required: [autoAnalysisEnabled, autoAnalysisSeverities]
      properties:
        autoAnalysisEnabled: { type: boolean }
        autoAnalysisSeverities:
          type: array
          items: { type: string, enum: [low, medium, high, critical] }
          description: |
            Whichever severities are selected. Never null on the wire, and an EMPTY array is
            a complete, valid answer meaning nothing is auto-analysed — never "every
            severity qualifies".

    RetentionSettings:
      type: object
      description: |
        How long each partitioned table is kept before the daily maintenance job drops its
        oldest partitions. Null means keep forever, which is also the shipped default —
        there is no further tier to resolve, so there is no `effective` pair here.
      required: [auditRetentionDays, incidentRetentionDays, findingRetentionDays]
      properties:
        auditRetentionDays: { type: [integer, 'null'] }
        incidentRetentionDays: { type: [integer, 'null'] }
        findingRetentionDays: { type: [integer, 'null'] }

    DetectionSettings:
      type: object
      description: |
        The two detection controls that are real and live-editable: per-detector (and
        per-rule) disabling, and storm protection. Null means off; the two storm numbers are
        set or cleared together.
      required: [disabledDetectorIds, stormProtectionMaxNewIncidents, stormProtectionWindowSeconds, disabledRuleIds]
      properties:
        disabledDetectorIds: { type: array, items: { type: string }, description: 'Never null on the wire. A disabled detector''s findings are dropped at the hub before correlation: no findings row, no incident touched.' }
        stormProtectionMaxNewIncidents: { type: [integer, 'null'] }
        stormProtectionWindowSeconds: { type: [integer, 'null'] }
        disabledRuleIds: { type: array, items: { type: string }, description: 'Rule-level control, same non-null contract.' }

    AutonomySettings:
      type: object
      description: |
        The autonomy CEILING, and the unattended executor's blast-radius caps. A null here
        does NOT mean "never auto-approve" — it means "fall back to the conservative
        default", which is why every one of them has an `effective*` twin stating what would
        actually apply. This section cannot weaken the hard, non-configurable
        high-risk-and-irreversible floor, which runs before any field here is consulted.
      required: [autoApproveMaxRisk, minConfidenceForAutoApprove, requireReversibleForAutoApprove, unattendedExecutionEnabled, maxUnattendedPerCluster, maxUnattendedFleetWide, unattendedWindowSeconds, unattendedNamespaces, effectiveMaxUnattendedPerCluster, effectiveMaxUnattendedFleetWide, effectiveUnattendedWindowSeconds, effectiveAutoApproveMaxRisk, effectiveMinConfidenceForAutoApprove, effectiveRequireReversibleForAutoApprove]
      properties:
        autoApproveMaxRisk: { type: [string, 'null'], enum: [low, medium, high, null] }
        minConfidenceForAutoApprove: { type: [number, 'null'] }
        requireReversibleForAutoApprove: { type: [boolean, 'null'], description: 'Nullable on purpose: as a plain bool, a request that included this section while omitting the key decoded to false and silently weakened the gate.' }
        unattendedExecutionEnabled:
          type: boolean
          description: |
            TRUE auto-approve — an AutoApprove verdict actually executing with no human.
            False unless deliberately turned on.
        maxUnattendedPerCluster: { type: [integer, 'null'], description: 'Null means the conservative fallback, never "no limit".' }
        maxUnattendedFleetWide: { type: [integer, 'null'], description: 'Null means the conservative fallback, never "no limit".' }
        unattendedWindowSeconds: { type: [integer, 'null'] }
        unattendedNamespaces:
          type: [array, 'null']
          items: { type: string }
          description: |
            Where unattended execution may act. **Empty means NOWHERE** — an empty allowlist
            denies, it does not permit everything.
        effectiveMaxUnattendedPerCluster: { type: integer }
        effectiveMaxUnattendedFleetWide: { type: integer }
        effectiveUnattendedWindowSeconds: { type: integer }
        effectiveAutoApproveMaxRisk: { type: string }
        effectiveMinConfidenceForAutoApprove: { type: number }
        effectiveRequireReversibleForAutoApprove: { type: boolean }

    CostSettings:
      type: object
      description: |
        The operator-configured pricing table and the daily spend ceiling. All three prices
        are null until someone sets them, and "not all three set" is treated as no pricing
        table at all — cost is then a real, honest 0, never a guessed per-model rate.
      required: [pricePerMillionInputTokens, pricePerMillionCachedTokens, pricePerMillionOutputTokens, pricingConfigured, spendCountable, dailySpendCeilingUsd, ceilingEnforceable, todaySpendUsd, ceilingBreached]
      properties:
        pricePerMillionInputTokens: { type: [number, 'null'] }
        pricePerMillionCachedTokens: { type: [number, 'null'] }
        pricePerMillionOutputTokens: { type: [number, 'null'] }
        pricingConfigured: { type: boolean, description: 'The hub''''s own answer to "are all three set", so a UI never re-derives it from three nullable numbers.' }
        spendCountable:
          type: boolean
          description: |
            Whether the ACTIVE provider can report per-investigation spend. Pricing being
            configured is necessary and NOT sufficient: under a subscription-billed provider
            every analysis records a notional cost that the ceiling's own sum excludes, so
            the ceiling can never be reached however low it is set.
        dailySpendCeilingUsd: { type: [number, 'null'], description: 'Null means no ceiling — today''s actual behaviour until an operator sets one.' }
        ceilingEnforceable: { type: boolean, description: 'Descriptive only; it does not gate enforcement. Describes the SAVED ceiling, unlike `spendCountable`, which is independent of it.' }
        todaySpendUsd: { type: number, description: 'Not a column — the live figure, computed exactly the way the enforcement check computes it.' }
        ceilingBreached:
          type: boolean
          description: |
            The enforcement check's own answer, NOT `todaySpendUsd >= dailySpendCeilingUsd`.
            The two differ, and that is the point: a screen computing the comparison itself
            once rendered "ceiling reached" on a total the hub was not even looking at.

    AppearanceSettings:
      type: object
      description: |
        The sign-in screen's style, the app-wide primary colour, and the Overview page's default
        time window. `loginStyle` alone configures something a not-yet-authenticated visitor sees,
        which is why it alone is also served by `GET /auth/sso/providers` (the login page cannot
        read this route; reading it is what signing in is for) — `primaryColorId`/
        `overviewDefaultWindowDays` instead ride on `GET /users/me`, since every authenticated user
        needs them, not just one holding `org:settings:write`.
      required: [loginStyle, styles, primaryColorId, primaryColorOptions, overviewDefaultWindowDays]
      properties:
        loginStyle: { type: string }
        styles: { type: array, items: { type: string }, description: 'The valid values, shipped with the current one so a selector cannot drift from the hub''s own list.' }
        primaryColorId: { type: string, description: 'One of primaryColorOptions.' }
        primaryColorOptions: { type: array, items: { type: string }, description: 'The valid preset ids, shipped with the current one for the same reason `styles` is.' }
        overviewDefaultWindowDays: { type: integer, enum: [14, 30] }

    GeneralSettings:
      type: object
      description: The two account-security floors that used to be hardcoded constants.
      required: [minPasswordLength, sessionIdleTimeoutMinutes]
      properties:
        minPasswordLength: { type: integer, description: 'The floor a self-chosen password must clear. Default 12, range 8-128.' }
        sessionIdleTimeoutMinutes: { type: [integer, 'null'], description: 'Null means no idle limit. Range 5-10080 (7 days) when set.' }

    OutboundPrivateDestination:
      type: object
      description: |
        One named exception to the default-deny on private destinations, for the AI-provider
        and repository HTTP clients. Nothing here is a secret — the justification is echoed
        back in full, because an exception nobody can read back is one nobody can review.
      required: [destination, reason]
      properties:
        destination: { type: string }
        reason: { type: string }

    OutboundSettings:
      type: object
      required: [privateDestinations]
      properties:
        privateDestinations: { type: array, items: { $ref: '#/components/schemas/OutboundPrivateDestination' }, description: Never null on the wire. }

    PostureSettings:
      type: object
      description: >-
        Posture checks turned off and namespaces left out of posture for every cluster, on top of each
        agent's own chart values. Namespace patterns may start or end with "*".
      required: [disabledChecks, ignoredNamespaces]
      properties:
        disabledChecks: { type: array, items: { type: string } }
        ignoredNamespaces: { type: array, items: { type: string } }

    SettingsResponse:
      type: object
      required: [llm, notify, analysis, automation, retention, detection, autonomy, cost, appearance, general, outbound, posture]
      properties:
        llm: { $ref: '#/components/schemas/LLMSettings' }
        notify: { $ref: '#/components/schemas/NotifySettings' }
        analysis: { $ref: '#/components/schemas/AnalysisSettings' }
        automation: { $ref: '#/components/schemas/AutomationSettings' }
        retention: { $ref: '#/components/schemas/RetentionSettings' }
        detection: { $ref: '#/components/schemas/DetectionSettings' }
        autonomy: { $ref: '#/components/schemas/AutonomySettings' }
        cost: { $ref: '#/components/schemas/CostSettings' }
        appearance: { $ref: '#/components/schemas/AppearanceSettings' }
        general: { $ref: '#/components/schemas/GeneralSettings' }
        outbound: { $ref: '#/components/schemas/OutboundSettings' }
        posture: { $ref: '#/components/schemas/PostureSettings' }

    UpdateSettingsRequest:
      type: object
      description: |
        Every section is optional and independently omittable. Omit one and it is untouched;
        include one and every field in it is taken as given — a key missing inside a present
        section CLEARS the stored value. The three secret fields are the exception and use
        the absent/`""`/value pointer contract.
      properties:
        llm:
          type: object
          properties:
            baseUrl: { type: string }
            model: { type: string }
            apiKey: { type: [string, 'null'], description: 'Absent leaves the stored key; `""` clears it; a value replaces it.' }
            providerKind: { type: string, enum: [api, cli] }
            cliRunnerUrl: { type: string }
            cliAgent: { type: string, enum: [claude, codex] }
            cliRunnerToken: { type: [string, 'null'], description: Same pointer contract as `apiKey`. }
        notify:
          type: object
          properties:
            webhookUrl: { type: [string, 'null'], description: Same pointer contract as `llm.apiKey`. }
        analysis:
          type: object
          properties:
            maxIterations: { type: [integer, 'null'], description: 'Null explicitly clears the override back to the env-var/default tier.' }
            timeLimitSeconds: { type: [integer, 'null'] }
            retrievalEnabled: { type: boolean }
        automation:
          type: object
          properties:
            autoAnalysisEnabled: { type: boolean }
            autoAnalysisSeverities:
              type: [array, 'null']
              items: { type: string, enum: [low, medium, high, critical] }
              description: 'Absent, null and `[]` all mean the same thing: nothing is eligible.'
        retention:
          type: object
          properties:
            auditRetentionDays: { type: [integer, 'null'], description: 'Null clears it back to keep-forever.' }
            incidentRetentionDays: { type: [integer, 'null'] }
            findingRetentionDays: { type: [integer, 'null'] }
        detection: { $ref: '#/components/schemas/DetectionSettingsRequest' }
        autonomy:
          type: object
          properties:
            autoApproveMaxRisk: { type: [string, 'null'], enum: [low, medium, high, null] }
            minConfidenceForAutoApprove: { type: [number, 'null'] }
            requireReversibleForAutoApprove: { type: [boolean, 'null'], description: 'Null clears it back to the safe default (true), NOT to false.' }
            unattendedExecutionEnabled: { type: boolean }
            maxUnattendedPerCluster: { type: [integer, 'null'] }
            maxUnattendedFleetWide: { type: [integer, 'null'] }
            unattendedWindowSeconds: { type: [integer, 'null'] }
            unattendedNamespaces: { type: [array, 'null'], items: { type: string }, description: 'Omitted or empty means unattended execution may act nowhere.' }
        cost:
          type: object
          properties:
            pricePerMillionInputTokens: { type: [number, 'null'] }
            pricePerMillionCachedTokens: { type: [number, 'null'] }
            pricePerMillionOutputTokens: { type: [number, 'null'] }
            dailySpendCeilingUsd: { type: [number, 'null'], description: 'Null clears the ceiling. There is no further fallback tier.' }
        appearance:
          type: object
          required: [loginStyle, primaryColorId, overviewDefaultWindowDays]
          properties:
            loginStyle: { type: string, description: 'Required when the section is present — an install always serves SOME login screen.' }
            primaryColorId: { type: string, description: 'Required when the section is present — must be one of GET''s primaryColorOptions.' }
            overviewDefaultWindowDays: { type: integer, enum: [14, 30], description: 'Required when the section is present.' }
        general:
          type: object
          required: [minPasswordLength]
          properties:
            minPasswordLength: { type: integer, description: 'Required when the section is present. Range 8-128.' }
            sessionIdleTimeoutMinutes: { type: [integer, 'null'], description: 'Null clears the idle limit back to none. Range 5-10080 when set.' }
        outbound:
          type: object
          description: 'Replaced wholesale: an absent or empty list clears every exception back to plain default-deny.'
          properties:
            privateDestinations: { type: [array, 'null'], items: { $ref: '#/components/schemas/OutboundPrivateDestination' } }
        posture:
          type: object
          description: 'Both lists replaced wholesale when the section is present.'
          properties:
            disabledChecks: { type: [array, 'null'], items: { type: string } }
            ignoredNamespaces: { type: [array, 'null'], items: { type: string } }

    AIProvider:
      type: object
      description: One configured provider. Secrets are reported as presence only.
      required: [id, name, kind, active, baseUrl, model, apiKeySet, runnerUrl, agent, runnerTokenSet]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [api, cli] }
        active: { type: boolean }
        baseUrl: { type: string, description: '`api` providers.' }
        model: { type: string }
        apiKeySet: { type: boolean }
        runnerUrl: { type: string, description: '`cli` providers.' }
        agent: { type: string }
        runnerTokenSet: { type: boolean }

    AIProvidersResponse:
      type: object
      description: 'Returned by every route in this group, including the mutations: an activate flips two rows and a delete may clear the active pointer, so the whole list comes back.'
      required: [providers, activeProviderId]
      properties:
        providers: { type: array, items: { $ref: '#/components/schemas/AIProvider' }, description: Always a non-nil array. }
        activeProviderId:
          type: string
          description: |
            Empty when nothing is active — a real state (fresh install, or the active
            provider was deleted), not an error, but one in which no analysis can run.

    AIProviderRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [api, cli] }
        baseUrl: { type: string, description: Required for an `api` provider. }
        model: { type: string }
        apiKey: { type: [string, 'null'], description: 'Omitted leaves it unchanged; `""` clears it; a value replaces it.' }
        runnerUrl: { type: string, description: Required for a `cli` provider. }
        agent: { type: string }
        runnerToken: { type: [string, 'null'], description: Same pointer contract as `apiKey`. }

    AIProviderTestResult:
      type: object
      description: |
        One real round-trip's result. Carries no stored configuration back at all — not the
        base URL, not the configured model, and obviously not the credential.
      required: [ok, kind, summary, detail, latencyMs]
      properties:
        ok: { type: boolean }
        kind: { type: string, description: 'The machine-readable classification of the outcome, the same value the failure problem carries as an extension member.' }
        summary: { type: string }
        detail: { type: string }
        caveat:
          type: string
          description: |
            What the test did NOT prove. Always populated on a pass and always shown: the one
            genuinely dangerous outcome here is a green tick read as "analysis will work".
        model: { type: string, description: 'The model the PROVIDER named in its own reply — diagnostic, not a reflection of stored state.' }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        latencyMs: { type: integer }

    NotificationDestination:
      type: object
      description: One configured destination. There is no `url` field, on purpose.
      required: [name, kind, urlConfigured]
      properties:
        name: { type: string, description: 'How rules refer to it, and the only identifier the caller gets.' }
        kind: { type: string }
        urlConfigured: { type: boolean, description: 'The only thing said about the URL. A destination with none delivers nothing.' }

    NotificationRule:
      type: object
      description: |
        One rule. The three matchers are nullable rather than empty strings so that
        "matches any severity" is visibly different from "matches the empty severity".
      required: [name, priority, clusterGroupId, clusterGroupName, minSeverity, transition, destination, enabled]
      properties:
        name: { type: string }
        priority: { type: integer, description: Lower-numbered rules are considered first; the table is ordered and its rows are only meaningful relative to each other. }
        clusterGroupId: { type: [string, 'null'], description: 'Null matches any cluster group.' }
        clusterGroupName: { type: [string, 'null'], description: 'Resolved for display only; not part of the match.' }
        minSeverity: { type: [string, 'null'], description: 'Null matches any severity.' }
        transition: { type: [string, 'null'], description: 'Null matches any transition.' }
        destination: { type: string, description: The name of one of the destinations above. }
        enabled: { type: boolean }

    NotificationDefaultRule:
      type: object
      description: |
        The synthetic catch-all, reported separately because it is NOT editable here — it
        is whatever the settings tree resolves the webhook URL to.
      required: [name, urlConfigured, source]
      properties:
        name: { type: string }
        urlConfigured: { type: boolean, description: 'False means anything no rule claimed is delivered nowhere — show this, do not leave it to be found in a log.' }
        source: { type: string, description: 'Where the default''s URL comes from, so a reader knows which screen to change it on.' }

    NotificationRoutingResponse:
      type: object
      required: [destinations, rules, defaultRule, transitions, severities]
      properties:
        destinations: { type: array, items: { $ref: '#/components/schemas/NotificationDestination' }, description: 'Built from the rules, so these are exactly the destinations the matcher would use.' }
        rules: { type: array, items: { $ref: '#/components/schemas/NotificationRule' } }
        defaultRule: { $ref: '#/components/schemas/NotificationDefaultRule' }
        transitions: { type: [array, 'null'], items: { type: string }, description: 'The closed set a rule may name, served so a client''s selects cannot drift from this build.' }
        severities: { type: [array, 'null'], items: { type: string }, description: 'The closed severity set, for the same reason.' }

    UpdateNotificationRoutingRequest:
      type: object
      description: The whole table. Anything omitted is removed — this is a replacement, not a merge.
      properties:
        destinations:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              url:
                type: [string, 'null']
                description: |
                  Absent or null KEEPS the URL already stored under this name — the only
                  workable shape when the GET never returns one, and what lets a UI
                  rename a destination or repoint a rule without holding its URL.
        rules:
          type: array
          items:
            type: object
            required: [name, destination]
            properties:
              name: { type: string }
              priority: { type: integer }
              clusterGroupId: { type: [string, 'null'] }
              minSeverity: { type: [string, 'null'] }
              transition: { type: [string, 'null'] }
              destination: { type: string, description: Must name a destination present in this same request. }
              enabled: { type: [boolean, 'null'], description: 'Absent means ENABLED — a rule nobody said anything about should be in force.' }

    # ----------------------------------------------- AD3: personal access tokens / MCP
    PersonalTokenStatus:
      type: string
      enum: [active, expired, revoked]
      description: Computed by the hub, so the UI never compares clocks itself.
    PersonalToken:
      type: object
      required: [id, name, hint, createdAt, expiresAt, lastUsedAt, revokedAt, status]
      properties:
        id: { type: string }
        name: { type: string, description: What the owner called it — which tool or machine it is for. }
        hint: { type: string, description: 'The last four characters of the secret, to tell two tokens apart.' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          description: Updated at most once a minute. Null means never used.
        revokedAt: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/PersonalTokenStatus' }
    PersonalTokenList:
      type: object
      required: [tokens, defaultDays, maxDays, maxActive]
      properties:
        tokens:
          type: array
          items: { $ref: '#/components/schemas/PersonalToken' }
        defaultDays: { type: integer, description: Lifetime a new token gets when none is asked for. }
        maxDays: { type: integer, description: The longest lifetime a token may have. }
        maxActive: { type: integer, description: How many active tokens one person may hold. }
    CreatePersonalTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expiresInDays: { type: integer, minimum: 1, maximum: 365, description: Default 90. }
    CreatePersonalTokenResponse:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: '#/components/schemas/PersonalToken' }
        secret: { type: string, description: 'The full token (`argus_pat_…`). Returned only here; only its hash is stored.' }
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id: { description: Absent for a notification. }
        method: { type: string, enum: [initialize, tools/list, tools/call, ping, notifications/initialized] }
        params: { type: object }
    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id: {}
        result: { type: object }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer }
            message: { type: string }
