# E14 lifecycle matrix, row 2 — "Pending pod — taint with no toleration".
# Campaign context and the full row inventory: README.md in this directory.
#
# NODE NAMES: originally written against kind-argus-disposable
# (argus-disposable-worker2). Updated 2026-09-03 to my-rke2-cluster-worker-2
# for this pass's run on `rke2` (its kubeconfig) — swap the
# `kubernetes.io/hostname` value below (and the taint target) again if this
# fixture is ever reused against a third cluster with different node names.
#
# Why this row: same catalogue category as row 1 (scheduling & pod
# admission, 48 entries) but a genuinely different MECHANISM — a taint,
# not a resource shortfall — so it exercises a different FailedScheduling
# message shape ("had untolerated taint") and is worth its own row rather
# than being folded into row 1 as a cosmetic variant.
#
# This fixture taints exactly ONE node (my-rke2-cluster-worker-2) rather
# than every node, so only pods that specifically target that node via
# nodeSelector are affected — nothing else running on the cluster (coredns,
# the argus-agent Deployment, kube-proxy, etc.) is disturbed. Untaint the
# node during cleanup.
#
# Usage:
#   kubectl taint nodes my-rke2-cluster-worker-2 e14-row02=special:NoSchedule
#   kubectl apply -f row02-pending-pod-taint-no-toleration.yaml
#   kubectl -n e14-row02 describe pod row02-taint-pending   # confirm "untolerated taint"
#   kubectl delete -f row02-pending-pod-taint-no-toleration.yaml
#   kubectl taint nodes my-rke2-cluster-worker-2 e14-row02=special:NoSchedule-   # untaint, cleanup
apiVersion: v1
kind: Namespace
metadata:
  name: e14-row02
  labels:
    e14-lifecycle-matrix: "true"
    e14-row: "row02-pending-taint-no-toleration"
---
apiVersion: v1
kind: Pod
metadata:
  name: row02-taint-pending
  namespace: e14-row02
  labels:
    app: row02-taint-pending
spec:
  # Forces the scheduler to consider ONLY the tainted node, with no
  # toleration for the taint applied above — this Pod can never be placed
  # anywhere, which is the point.
  nodeSelector:
    kubernetes.io/hostname: my-rke2-cluster-worker-2
  containers:
    - name: pause
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
---
# Healthy control: same nodeSelector, but WITH the matching toleration —
# schedules normally once the taint is present, proving the mechanism
# distinguishes "tainted, no toleration" from "tainted, tolerated" rather
# than just "pinned to a specific node".
apiVersion: v1
kind: Pod
metadata:
  name: row02-taint-control-healthy
  namespace: e14-row02
  labels:
    app: row02-taint-control-healthy
spec:
  nodeSelector:
    kubernetes.io/hostname: my-rke2-cluster-worker-2
  tolerations:
    - key: e14-row02
      operator: Equal
      value: special
      effect: NoSchedule
  containers:
    - name: pause
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
