{{- if include "argus-hub.localAgent" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "argus-local-enrollment" }}
{{- $key := "" }}
{{- if $existing }}
  {{- $key = index $existing.data "token" | b64dec }}
{{- else }}
  {{- $key = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  # A fixed name, because the agent chart's values (localAgent.enrollment)
  # name it statically. The hub registers the key as a single-use,
  # auto-accepting enrollment token for this cluster; the agent presents it.
  # Generated once and kept across upgrades, but not across an uninstall:
  # that deletes the agent's identity too, and a reinstall then needs a new
  # single-use token rather than the spent one.
  name: argus-local-enrollment
  labels: {{- include "argus-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $key | quote }}
{{- end }}
