  /incidents/{id}/quick-actions:
    post:
      operationId: requestIncidentQuickAction
      tags: [incidents]
      summary: Request a GitOps refresh/reconcile as a recommendation awaiting approval.
      description: |
        Requires `remediation:execute:inplace` on the incident's cluster. Records an
        AnnotateResource recommendation (Argo CD refresh or Flux reconcile) on the incident's latest
        analysis, gated by the live autonomy policy; nothing executes until it is approved.
      parameters: [ { $ref: '#/components/parameters/IncidentId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, namespace, name]
              properties:
                action: { type: string, enum: [argoRefresh, argoHardRefresh, fluxReconcileKs, fluxReconcileHr, fluxReconcileGit, fluxReconcileHelm, fluxReconcileOci] }
                namespace: { type: string }
                name: { type: string }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [recommendationId, gateOutcome, gateReason]
                properties:
                  recommendationId: { type: string }
                  gateOutcome: { type: string }
                  gateReason: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '409':
          description: The incident has no analysis yet.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
