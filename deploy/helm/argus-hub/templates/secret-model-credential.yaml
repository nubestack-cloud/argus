{{- if and (include "argus-hub.cliRunnerEnabled" .) (not .Values.cliRunner.modelCredential.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argus-hub.fullname" . }}-model-credential
  labels: {{- include "argus-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The operator's own model credential. ARGUS never ships one (lld/12 §10.7).
  # trimmed: `--set-file` keeps the file's trailing newline, which then rides
  # inside the credential and fails authentication in a confusing way.
  {{- with .Values.cliRunner.modelCredential.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | trim | quote }}
  {{- end }}
  {{- with .Values.cliRunner.modelCredential.claudeCodeOauthToken }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ . | trim | quote }}
  {{- end }}
  {{- with .Values.cliRunner.modelCredential.openaiApiKey }}
  OPENAI_API_KEY: {{ . | trim | quote }}
  {{- end }}
{{- end }}
