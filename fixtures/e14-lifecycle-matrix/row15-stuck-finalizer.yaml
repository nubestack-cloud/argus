# E14 lifecycle matrix, row 15 — the stuck finalizer (an object carries a
# finalizer nothing ever removes, so it is stuck Terminating forever).
# Campaign context and the full row inventory: README.md in this directory.
#
# Unblocked 2026-09-06 (PROJECT.md "Decided"). RUN 2026-09-06, plain
# kubectl fixture, `rke2`, own namespace (e14-row15-finalizer) — no GitOps
# involved. Exercises internal/agent/generic_predicates.go's
# checkGenericStuckFinalizer end to end through a real incident, not just
# the predicate unit tests.
#
# Fixture: a ConfigMap (in supportedGVKs, unlike Secret — see
# internal/agent/tools.go) carrying a finalizer nothing was ever going to
# clear, then deleted — leaving deletionTimestamp set but the object never
# actually removed.
apiVersion: v1
kind: Namespace
metadata:
  name: e14-row15-finalizer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: e14-row15-cm
  namespace: e14-row15-finalizer
  finalizers:
    - e14-test.argus.io/never-removed
data:
  note: "E14 row 15 fixture: this finalizer is never removed by any controller, so deletion sticks forever."

# To induce the fault: kubectl delete configmap e14-row15-cm -n
# e14-row15-finalizer --wait=false (the delete call sets deletionTimestamp
# but the object persists, since nothing removes the finalizer above).

# RESULT (2026-09-06): detected by checkGenericStuckFinalizer (reason
