{{- include "argus-hub.validate" . }}
{{- if not .Values.bootstrap.existingSecret }}
{{- $fullname := include "argus-hub.fullname" . }}
{{- /*
lookup-then-generate, not a bare randAlphaNum: without the lookup a
`helm upgrade` would mint a new password and lock the operator out of their own
installation. That is a classic chart bug and it is silent until someone tries
to sign in.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-bootstrap" $fullname) }}
{{- $password := .Values.bootstrap.password }}
{{- if not $password }}
  {{- if $existing }}
    {{- $password = index $existing.data "password" | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-bootstrap
  labels: {{- include "argus-hub.labels" . | nindent 4 }}
  {{- include "argus-hub.keepAnnotation" . | nindent 2 }}
type: Opaque
stringData:
  # The initial super-admin password. Read it once, sign in, change it. Never a
  # baked-in default: a shipped known password is the most common way a
  # self-hosted product gets compromised.
  password: {{ $password | quote }}
{{- end }}
