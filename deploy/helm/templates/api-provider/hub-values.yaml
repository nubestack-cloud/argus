# Values for argus-hub-chart:
#   helm upgrade --install argus-hub oci://registry-1.docker.io/nubestack/argus-hub-chart \
#     --version 0.2.0 -n argus-system --create-namespace -f hub-values.yaml
# Images are pinned by the chart version; leave image.* unset.
# The UI, the API and the agents' tunnel are all served at this host.
ingress:
  host: CHANGE_ME_HUB_HOST
  clusterIssuer: CHANGE_ME_ISSUER   # your cert-manager ClusterIssuer; or remove it and set tls.secretName
# Bundled Postgres (10Gi, no backups of its own) is the default. For
# production, use postgres.mode=external (docs/INSTALL.md, "External Postgres").
# Configure the API provider afterwards in Settings -> AI providers.
