        Requires `incident:read`. Every figure is aggregated over the whole matching set, never
        counted from a fetched page. Scoped by the same filters as `GET /incidents` (`clusterId`
        and the rest). `daily` has one row per UTC day, oldest first, ending today; `openAtEnd`
        is reconstructed from `first_seen` and `resolved_at`, so an incident that closed and
        reopened counts as open from its first sighting.
      parameters:
        - { name: clusterId, in: query, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, minimum: 7, maximum: 90, default: 14 } }
      responses:
        '200':
          description: OK
